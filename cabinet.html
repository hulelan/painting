<!DOCTYPE html>
<html lang="zh-Hans">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
<title>The Case</title>
<meta name="description" content="A case of handscrolls — choose one to unroll.">
<link rel="stylesheet" href="css/type.css?v=3">
<style>
:root{ --room:#0a0908; --warm:#d9b45a; --line:rgba(217,180,90,.20); }
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--room);color:#c9bda4;overflow:hidden;
  font-family:var(--type);-webkit-font-smoothing:antialiased;
  -webkit-user-select:none;user-select:none}

#room{position:fixed;inset:0;
  background:radial-gradient(70% 56% at 30% 2%, rgba(224,186,120,.11), transparent 64%), var(--room)}

/* ---- grounds, switched with ?bg=paper|silk|blush|dawn.
   Kept in step with index.html so the cabinet and the viewer never disagree
   about what room they are in. */
body[class*="bg-"]{ --line:var(--th-line); --warm:var(--th-accent); color:var(--th-ink) }
body[class*="bg-"] #room{background:linear-gradient(180deg,var(--th-bg),var(--th-bg2))}
body[class*="bg-"] #geo h1{color:var(--th-muted)}
body[class*="bg-"] #geo .sub{color:var(--th-muted)}
body[class*="bg-"] .cell{background:var(--th-bg2)}
body[class*="bg-"] .cell.open:hover{background:var(--th-bg)}
body[class*="bg-"] .cell .name{color:var(--th-ink)}
body[class*="bg-"] .cell .meta{color:var(--th-muted)}
body[class*="bg-"] .cell.shut{cursor:default;opacity:.62}
.cell.shut.away{cursor:pointer}
.cell.shut.away:hover{opacity:.85;background:#141109}
.cell.shut .name{color:#8d8270}
.cell.shut .meta{color:#6b6152}
.cell.shut .await{margin-top:6px;font-size:10px;letter-spacing:2px;color:#6b5f4a}
.scroll.shut{cursor:default;opacity:.5}
.scroll.shut .slip{color:#9a8f78}
.cell.empty .name{color:var(--th-line)}
body[class*="bg-"] .bar::after{background:rgba(255,255,255,.5)}
body[class*="bg-"] .bar i{background:rgba(255,255,255,.55)}
body.bg-paper{ --th-bg:#efe9dc; --th-bg2:#f6f1e7; --th-ink:#4a463c; --th-muted:#8a8375;
  --th-accent:#b6412e; --th-line:rgba(90,80,60,.20) }
body.bg-silk{ --th-bg:#ded2bb; --th-bg2:#e7ddc7; --th-ink:#4a4234; --th-muted:#8b8069;
  --th-accent:#a8402f; --th-line:rgba(80,68,46,.22) }
body.bg-blush{ --th-bg:#f6eff0; --th-bg2:#fbf6f6; --th-ink:#6a5b60; --th-muted:#9b8d92;
  --th-accent:#c98a9e; --th-line:rgba(120,95,105,.18) }
body.bg-dawn{ --th-bg:#fdf6ef; --th-bg2:#f7f0f3; --th-ink:#6b6069; --th-muted:#968a94;
  --th-accent:#e0a08c; --th-line:rgba(120,105,105,.16) }

/* ======================= GEOMETRIC ======================= */
#geo{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(86vw,900px)}
#geo h1{margin:0 0 5px;font-size:12px;font-weight:500;letter-spacing:6px;color:#7d735f;
  text-transform:uppercase}
#geo .sub{margin:0 0 26px;font-size:12px;letter-spacing:3px;color:#544c3e}
#grid{display:grid;grid-template-columns:repeat(2,1fr);gap:1px;
  background:var(--line);border:1px solid var(--line)}
@media(max-width:640px){ #grid{grid-template-columns:1fr} }
.cell{position:relative;background:#0e0c09;padding:22px 20px 18px;min-height:104px;
  display:flex;flex-direction:column;justify-content:flex-end;transition:background .35s ease}
.cell.open{cursor:pointer}
.cell.open:hover{background:#141109}
.bar{position:relative;height:15px;width:100%;background:var(--c);
  transition:height .35s cubic-bezier(.2,.7,.3,1), filter .35s ease}
.bar::after{content:"";position:absolute;left:0;right:0;top:0;height:2px;background:rgba(255,238,205,.42)}
.bar i{position:absolute;top:-3px;bottom:-3px;width:1px;background:rgba(10,8,6,.75)}
.cell.open:hover .bar{height:21px;filter:brightness(1.22)}
.cell .name{margin-top:14px;font-size:15px;letter-spacing:2px;color:#9d917a;transition:color .35s ease}
.cell .meta{margin-top:5px;font-size:12px;letter-spacing:1px;color:#4f483b}
.cell.open:hover .name{color:#f0e6cd}
.cell.empty .slotline{height:1px;width:100%;background:rgba(217,180,90,.10)}
.cell.empty .name{color:#33302a}

/* ======================= PICTORIAL ======================= */
#pic{position:absolute;inset:0;display:none}
#table{position:absolute;left:50%;bottom:0;transform:translateX(-50%);
  width:min(120vw,1500px);height:46vh;pointer-events:none;
  background:linear-gradient(180deg, rgba(150,112,66,.28), rgba(60,42,24,.15) 34%, rgba(10,8,6,0) 78%);
  box-shadow:inset 0 1px 0 rgba(236,200,140,.16)}
#woodbox{position:absolute;right:11%;top:36%;width:250px;height:96px;pointer-events:none;
  background:linear-gradient(180deg,#7a5c38,#4a3722 42%,#2a1f14);border-radius:3px;
  box-shadow:0 22px 44px rgba(0,0,0,.75), inset 0 2px 0 rgba(255,224,170,.14);
  transform:rotate(-1.4deg);opacity:.6}
#woodbox::before{content:"";position:absolute;left:7px;right:7px;top:7px;height:26px;border-radius:2px;
  background:linear-gradient(180deg,#241a10,#120c07);box-shadow:inset 0 3px 8px rgba(0,0,0,.85)}
#shelf{position:absolute;left:50%;top:54%;transform:translate(-50%,-50%);
  display:flex;flex-direction:column;align-items:center;gap:16px}
.scroll{position:relative;cursor:pointer;transition:transform .4s cubic-bezier(.2,.7,.3,1)}
.scroll .body{position:absolute;inset:0;border-radius:44px/50%;
  background:
    radial-gradient(circle at 12% 30%, rgba(255,244,214,.16) 0 3px, transparent 4px),
    radial-gradient(circle at 38% 66%, rgba(255,244,214,.13) 0 3px, transparent 4px),
    radial-gradient(circle at 64% 26%, rgba(255,244,214,.14) 0 3px, transparent 4px),
    radial-gradient(circle at 86% 62%, rgba(255,244,214,.12) 0 3px, transparent 4px),
    repeating-linear-gradient(38deg, rgba(255,240,206,.055) 0 3px, transparent 3px 9px),
    repeating-linear-gradient(-38deg, rgba(0,0,0,.09) 0 3px, transparent 3px 10px),
    linear-gradient(180deg, rgba(255,236,200,.34) 0%, var(--c1) 24%, var(--c2) 58%,
                    rgba(0,0,0,.55) 88%, rgba(0,0,0,.72) 100%);
  background-size:26px 26px,26px 26px,26px 26px,26px 26px,auto,auto,auto;
  box-shadow:0 20px 34px rgba(0,0,0,.72), inset 0 -6px 18px rgba(0,0,0,.45),
             inset 0 5px 12px rgba(255,232,190,.14)}
.scroll .end{position:absolute;top:2%;height:96%;right:-2px;width:26px;border-radius:50%;z-index:2;
  background:
    repeating-radial-gradient(circle at 46% 50%, rgba(238,228,204,.95) 0 2px, rgba(206,192,162,.92) 2px 4px),
    radial-gradient(circle at 42% 46%, #efe6cf, #b9a888 78%);
  box-shadow:inset -3px 0 8px rgba(0,0,0,.45), 0 6px 14px rgba(0,0,0,.5)}
.scroll .tie{position:absolute;top:-3%;height:106%;width:11px;z-index:3;border-radius:3px;
  background:linear-gradient(90deg, rgba(0,0,0,.35), rgba(226,214,184,.92) 38%, rgba(176,162,128,.9) 72%, rgba(0,0,0,.3));
  box-shadow:0 3px 8px rgba(0,0,0,.55)}
.scroll .slip{position:absolute;left:12%;top:50%;transform:translateY(-50%);z-index:4;
  padding:5px 12px;border-radius:1px;
  background:linear-gradient(180deg,rgba(240,231,209,.95),rgba(214,202,175,.88));
  color:#2a2119;letter-spacing:4px;white-space:nowrap;
  box-shadow:0 3px 9px rgba(0,0,0,.55);
  transition:color .4s ease, box-shadow .4s ease, background .4s ease}
.scroll:hover{transform:translateY(-6px)}
.scroll:hover .slip{color:#0a0705;
  background:linear-gradient(180deg,rgba(248,242,225,.99),rgba(228,218,192,.94));
  box-shadow:0 5px 20px rgba(0,0,0,.7), 0 0 24px rgba(224,186,120,.26)}
.scroll.ghost{opacity:.28;filter:brightness(.5) blur(.4px);pointer-events:none}

/* ======================= chrome ======================= */
#lang{position:fixed;right:18px;top:16px;z-index:9;font-size:12px;letter-spacing:3px;
  color:#6b6151;cursor:pointer;border:1px solid var(--line);padding:5px 10px;
  transition:color .3s, border-color .3s}
#lang:hover{color:#efe3c6;border-color:rgba(217,180,90,.5)}
#skin{position:fixed;left:18px;bottom:16px;z-index:9;font-size:12px;letter-spacing:2px;
  display:flex;align-items:center;gap:10px;color:#4d4638}
#skin span{cursor:pointer;transition:color .3s, border-color .3s;
  border-bottom:1px solid transparent;padding-bottom:2px}
#skin span:hover{color:#cbbd9c}
#skin span.on{color:#f0e6cd;border-bottom-color:rgba(217,180,90,.6)}
#skin i{width:1px;height:11px;background:rgba(217,180,90,.22);display:inline-block}
#classic{position:fixed;right:18px;bottom:16px;z-index:9;font-size:11px;letter-spacing:2px;
  color:#443e33;text-decoration:none;transition:color .3s}
#classic:hover{color:#a2957a}
</style>
</head>
<body>
<div id="room">
  <div id="geo">
    <h1 id="h1" class="t-ui">The Case</h1>
    <p class="sub" id="sub"></p>
    <div id="grid"></div>
  </div>
  <div id="pic">
    <div id="table"></div>
    <div id="woodbox"></div>
    <div id="shelf"></div>
  </div>
</div>

<div id="lang">中</div>
<div id="skin"><span data-s="geo"></span><i></i><span data-s="pic"></span></div>
<a id="classic" href="classic.html"></a>

<script src="assets/data/paintings.js"></script>
<script>
(function(){
const I18N={
  en:{h1:'The Case', lang:'中', geo:'Geometric', pic:'Pictorial', classic:'classic view',
      await:'no scan yet', elsewhere:'no free scan — see it at Chicago ↗',
      sub:n=>n.all+' compartments. '+n.open+' filled.'},
  zh:{h1:'畫　匣', lang:'EN', geo:'幾何', pic:'寫實', classic:'舊版',
      await:'尚無掃描本', elsewhere:'無自由授權掃描本　芝加哥大學可觀 ↗',
      sub:n=>N(n.all)+'格　'+N(n.open)+'實'}
};
// The case is built from the register now, not from a pair of hard-coded
// entries. A scroll with no scan is still shown -- shut, and labelled as such.
// Nine compartments: eight paintings and the poetry site.
const NUM=['〇','一','二','三','四','五','六','七','八','九','十'];
const N=x=>NUM[x]||String(x);
const REG=(window.PAINTINGS&&window.PAINTINGS.items)||[];
const SITE={zh:'詩　淵', en:'Shi Yuan', meta:{zh:'古詩古文 二九六六篇', en:'2,966 poems and prose works'},
            href:'https://classicalchinesepoetry.com/', ready:true, site:true};
function entries(lang){
  const out=REG.map(it=>({
    zh:it.zh, en:it.en,
    meta:{ zh:it.artist.zh+'　'+it.dynasty.zh+(it.museum?'　'+it.museum.zh:''),
           en:it.artist.en+' · '+it.dynasty.en+(it.museum?' · '+it.museum.en:'') },
    href: it.dir ? './?p='+it.slug+(location.search.replace(/^\?/,'')?'&'+location.search.replace(/^\?/,''):'')
                 : (it.viewer||it.record||''),
    away: !it.dir && !!(it.viewer||it.record),
    ready:!!it.dir }));
  out.push(SITE);
  return out;
}
// celadon, gold-tan, and the rest of the silk range; shut scrolls take none
const GEO_C=['#5c7a72','#9c8558','#7a6a86','#8a6a52','#5d7186','#6f7a55','#8b6470','#5f7a7c','#9c8558'];
const PIC_C=[['#5d7186','#3b5063'],['#8a6a52','#5e4335'],['#6f7a55','#4a5238'],['#7a6a86','#52465e'],
             ['#5c7a72','#3d554e'],['#8b6470','#5e434c'],['#5f7a7c','#3f5456'],['#9c8558','#6b5a39'],
             ['#8a6a52','#5e4335']];
const SHUT=['#4a4536','#332f26'];
let lang=localStorage.getItem('ccp_lang')||'zh';
let skin=localStorage.getItem('ccp_skin')||'geo';

const grid=document.getElementById('grid'), shelf=document.getElementById('shelf');

function buildGeo(d){
  grid.innerHTML='';
  entries(lang).forEach((it,i)=>{
    const cell=document.createElement('div');
    const name=(lang==='en'?it.en:it.zh), meta=(lang==='en'?it.meta.en:it.meta.zh);
    if(it.ready){
      cell.className='cell open';
      cell.innerHTML='<div class="bar" style="--c:'+GEO_C[i%GEO_C.length]+'">'+
        '<i style="left:27%"></i><i style="left:71%"></i></div>'+
        '<div class="name">'+name+'</div><div class="meta">'+meta+'</div>';
      cell.addEventListener('click',()=>{ location.href=it.href; });
    } else {
      // shut, not empty: the painting is known, the scan is not ours to host.
      // It still goes somewhere -- the museum's record, or Chicago's viewer.
      cell.className='cell shut'+(it.away?' away':'');
      cell.innerHTML='<div class="slotline"></div>'+
        '<div class="name">'+name+'</div><div class="meta">'+meta+'</div>'+
        '<div class="await">'+(it.away?d.elsewhere:d.await)+'</div>';
      if(it.away) cell.addEventListener('click',()=>window.open(it.href,'_blank','noopener'));
    }
    grid.appendChild(cell);
  });
}

function buildPic(d){
  const W=Math.min(innerWidth*0.46,520), D=Math.max(52,W/6.4);
  shelf.innerHTML='';
  const ghost=document.createElement('div');
  ghost.className='scroll ghost';
  ghost.style.cssText='width:'+(W*0.92)+'px;height:'+(D*0.86)+'px;--c1:#4a4536;--c2:#332f26';
  ghost.innerHTML='<div class="body"></div><div class="end"></div>';
  shelf.appendChild(ghost);
  entries(lang).forEach((it,i)=>{
    const s=document.createElement('div');
    const c=it.ready?PIC_C[i%PIC_C.length]:SHUT;
    s.className='scroll'+(it.ready?'':' shut');
    s.style.cssText='width:'+W+'px;height:'+D+'px;--c1:'+c[0]+';--c2:'+c[1];
    const short=(lang==='en'?it.en:it.zh);
    s.innerHTML='<div class="body"></div>'+
      '<div class="tie" style="left:27%"></div><div class="tie" style="left:71%"></div>'+
      '<div class="end"></div>'+
      '<div class="slip" style="font-size:'+Math.max(11,Math.min(14,D*0.24))+'px">'+short+'</div>';
    if(it.ready) s.addEventListener('click',()=>{ location.href=it.href; });
    else s.title=d.await;
    shelf.appendChild(s);
  });
}

function build(){
  const d=I18N[lang];
  document.documentElement.lang = lang==='en'?'en':'zh-Hans';
  document.getElementById('h1').textContent=d.h1;
  const es=entries(lang);
  document.getElementById('sub').textContent=d.sub({all:es.length, open:es.filter(e=>e.ready).length});
  document.getElementById('lang').textContent=d.lang;
  document.getElementById('classic').textContent=d.classic;
  document.title=d.h1;
  document.querySelector('#skin [data-s="geo"]').textContent=d.geo;
  document.querySelector('#skin [data-s="pic"]').textContent=d.pic;
  document.querySelectorAll('#skin span').forEach(s=>s.classList.toggle('on',s.dataset.s===skin));
  document.getElementById('geo').style.display = skin==='geo'?'block':'none';
  document.getElementById('pic').style.display = skin==='pic'?'block':'none';
  if(skin==='geo') buildGeo(d); else buildPic(d);
}

document.getElementById('lang').addEventListener('click',()=>{
  lang = lang==='en'?'zh':'en'; localStorage.setItem('ccp_lang',lang); build();
});
document.querySelectorAll('#skin span').forEach(s=>{
  s.addEventListener('click',()=>{ skin=s.dataset.s; localStorage.setItem('ccp_skin',skin); build(); });
});
addEventListener('resize',()=>{ if(skin==='pic') build(); });
build();
})();
</script>
<script>
// ?font=b|c|d|e swaps the type stack so the options can be judged in place.
(function(){
  var g=/[?&]bg=(paper|silk|blush|dawn)/.exec(location.search);
  if(g) document.body.classList.add('bg-'+g[1]);
  var m=/[?&]font=([a-e])/.exec(location.search); if(!m||m[1]==='b') return;
  document.body.classList.add('font-'+m[1],'fonttag');
  var N={a:'EB Garamond (was default)',c:'Helvetica Neue',d:'Avenir Next',e:'Futura'};
  var d=document.createElement('div'); d.id='fontTag';
  d.textContent='type \u00b7 '+m[1].toUpperCase()+' '+N[m[1]];
  document.body.appendChild(d);
})();
</script>
</body>
</html>
