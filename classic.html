<!DOCTYPE html>
<html lang="zh-Hans">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>展卷</title>
  <meta name="description" content="全卷高清，自右向左展卷阅览。">
  <link rel="stylesheet" href="css/shell.css">
  <style>
    :root { --paper:#f4efe4; --cinnabar:#a8322d; }
    * { box-sizing: border-box; }
    html, body {
      margin: 0; padding: 0; height: 100%;
      background: #14120f; color: #d9cfba; overflow: hidden;
      font-family: "Songti SC", "Noto Serif SC", Georgia, serif;
      -webkit-font-smoothing: antialiased;
    }
    #stage {
      position: fixed; inset: 0;
      height: 100vh; height: 100dvh;
      overflow-x: auto; overflow-y: hidden;
      cursor: grab;
      scrollbar-width: none;
      -webkit-overflow-scrolling: touch;
      background: #14120f;
    }
    #stage::-webkit-scrollbar { display: none; }
    #stage.grabbing { cursor: grabbing; }
    /* Tiles are absolutely placed at integer offsets computed in JS, so adjacent
       strips share an exact pixel boundary — no sub-pixel hairline seams. */
    #rail { position: relative; height: 100%; }
    #rail img {
      position: absolute; top: 0; height: 100%;
      display: block; border: 0;
      -webkit-user-drag: none; user-select: none; pointer-events: none;
    }
    /* A hanging scroll unrolls downward: the rail is a column, the stage
       scrolls vertically, and the painting's width is what fits the screen. */
    body.vert #stage { overflow-x: hidden; overflow-y: auto; }
    body.vert #rail { height: auto; margin: 0 auto; }
    body.vert #rail img { top: auto; left: 0; height: auto; width: 100%; }

    .caption {
      position: fixed; left: 18px; bottom: 16px; z-index: 1500;
      font-size: 15px; letter-spacing: 2px; color: #e7ddc9;
      text-shadow: 0 1px 6px rgba(0,0,0,0.9);
      transition: opacity .5s ease; pointer-events: none;
    }
    .caption small { display:block; font-size: 12px; color:#b7ab97; letter-spacing:1px; margin-top:2px; }
    .hint {
      position: fixed; left: 50%; top: 50%; z-index: 1500;
      transform: translate(-50%, -50%);
      padding: 12px 22px; border-radius: 999px;
      background: rgba(20,18,15,0.55); backdrop-filter: blur(3px);
      color: #efe7d5; font-size: 16px; letter-spacing: 3px;
      box-shadow: 0 4px 22px rgba(0,0,0,0.5);
      transition: opacity .6s ease; pointer-events: none;
    }
    .hint .arrow { display:inline-block; animation: nudge 1.4s ease-in-out infinite; }
    @keyframes nudge { 0%,100%{ transform:translateX(0) } 50%{ transform:translateX(-6px) } }
    body.vert .hint .arrow { animation-name: nudgeY; }
    @keyframes nudgeY { 0%,100%{ transform:translateY(0) } 50%{ transform:translateY(6px) } }
    .faded { opacity: 0 !important; }

    .progress { position: fixed; left:0; bottom:0; height:3px; z-index:1600;
      background: linear-gradient(90deg, var(--cinnabar), #d9b45a);
      width:0; transition: width .08s linear; opacity:.85; }

    .veil { position: fixed; inset:0; z-index:1700; display:flex;
      align-items:center; justify-content:center; background:#14120f;
      color:#b7ab97; letter-spacing:4px; font-size:15px;
      transition: opacity .6s ease; }
    .veil.gone { opacity:0; pointer-events:none; }
    .veil .dot { animation: blink 1.2s infinite; }
    @keyframes blink { 0%,100%{opacity:.25} 50%{opacity:1} }
  </style>
</head>
<body class="art-immersive">
  <div class="tabstrip" id="tabstrip">
    <div class="tabrow tabrow-works" id="works">
      <a class="tabstrip-tab" href="https://classicalchinesepoetry.com/">诗渊</a>
    </div>
    <div class="tabrow tabrow-views" id="views" hidden>
      <span class="views-label">观法</span>
      <a class="tabstrip-tab active" href="classic.html">展卷</a>
      <a class="tabstrip-tab" href="grid.html">叠卷</a>
      <a class="tabstrip-tab" href="nav.html">导览</a>
    </div>
  </div>

  <div id="stage"><div id="rail"></div></div>

  <div class="caption" id="caption"></div>
  <div class="hint" id="hint"><span class="arrow">←</span>　向左展卷</div>
  <div class="progress" id="progress"></div>
  <div class="veil" id="veil">展卷中<span class="dot">…</span></div>

  <script src="assets/data/paintings.js"></script>
  <script>
  // Which scroll: ?p=<slug> from the register, the register's default otherwise.
  // The manifest is document.written so it is in place before the viewer runs.
  (function () {
    var R = window.PAINTINGS, m = /[?&]p=([a-z0-9_-]+)/i.exec(location.search);
    var slug = (m && m[1]) || R.default;
    var it = R.items.filter(function (x) { return x.slug === slug && x.dir; })[0]
          || R.items.filter(function (x) { return x.slug === R.default; })[0];
    window.PAINTING = it;
    document.write('<scr' + 'ipt src="' + it.dir + '/manifest.js"></scr' + 'ipt>');
  })();
  </script>
  <script>
  (function () {
    var P = window.PAINTING;
    var S = window.SCROLL || { w: 1, h: 1, tiles: [] };
    var VERT = S.axis === 'v';
    if (VERT) document.body.classList.add('vert');
    document.title = P.zh + ' · 展卷';
    document.getElementById('caption').innerHTML =
      '《' + P.zh + '》<small>' + P.artist.zh + '　' + P.dynasty.zh + '</small>';
    if (VERT) document.getElementById('hint').innerHTML = '<span class="arrow">↓</span>　向下展卷';

    // the works row lists every scroll that has a scan; the views row is for
    // 千里江山图 alone, since 叠卷 and 导览 were only ever built for it
    var works = document.getElementById('works');
    window.PAINTINGS.items.forEach(function (it) {
      if (!it.dir) return;
      var a = document.createElement('a');
      a.className = 'tabstrip-tab' + (it.slug === P.slug ? ' active' : '');
      a.href = 'classic.html?p=' + it.slug;
      a.textContent = it.zh;
      works.appendChild(a);
    });
    document.getElementById('views').style.display = P.slug === 'qianli' ? '' : 'none';

    var stage = document.getElementById('stage');
    var rail  = document.getElementById('rail');
    var n = S.tiles.length;

    // cumulative source offset of each tile boundary, along the scroll's axis
    var cum = [0];
    S.tiles.forEach(function (t) { cum.push(cum[cum.length - 1] + t.w); });

    var imgs = S.tiles.map(function (t, i) {
      var img = document.createElement('img');
      img.src = P.tiles + t.f;
      img.alt = '';
      img.decoding = 'async';
      img.loading = (VERT ? i < 3 : i >= n - 5) ? 'eager' : 'lazy';   // opening region loads immediately
      rail.appendChild(img);
      return img;
    });

    var scale = 1, xs = [];
    function layout() {
      if (VERT) {
        var W = Math.min(stage.clientWidth, 900);
        if (!W || !S.w) return;
        scale = W / S.w;
        xs = cum.map(function (c) { return Math.round(c * scale); });
        for (var j = 0; j < imgs.length; j++) {
          imgs[j].style.top = xs[j] + 'px';
          imgs[j].style.height = (xs[j + 1] - xs[j]) + 'px';
        }
        rail.style.width = W + 'px';
        rail.style.height = xs[xs.length - 1] + 'px';
        return;
      }
      var H = stage.clientHeight;
      if (!H || !S.h) return;
      scale = H / S.h;
      xs = cum.map(function (c) { return Math.round(c * scale); });
      for (var i = 0; i < imgs.length; i++) {
        imgs[i].style.left  = xs[i] + 'px';
        imgs[i].style.width = (xs[i + 1] - xs[i]) + 'px';   // integer, gap-free
      }
      rail.style.width = xs[xs.length - 1] + 'px';
    }

    // A handscroll opens at its right edge, on the artwork itself: the far
    // right of a scan may be mounting silk (contentRight). A hanging scroll
    // opens at the top.
    function openAtStart() {
      if (VERT) { stage.scrollTop = 0; return; }
      var edge = Math.round((S.contentRight || S.w) * scale);
      stage.scrollLeft = Math.max(0, edge - stage.clientWidth);
    }
    function pos() { return VERT ? stage.scrollTop : stage.scrollLeft; }
    function setPos(v) { if (VERT) stage.scrollTop = v; else stage.scrollLeft = v; }
    function extent() { return VERT ? stage.scrollHeight - stage.clientHeight : stage.scrollWidth - stage.clientWidth; }

    var opened = false;
    function reflow(keepPlace) {
      var frac = null, max0 = extent();
      if (keepPlace && max0 > 0) frac = pos() / max0;
      layout();
      if (opened && frac !== null) setPos(frac * extent());
      else openAtStart();
    }

    layout(); openAtStart();
    requestAnimationFrame(function () { layout(); if (!opened) openAtStart(); });
    window.addEventListener('load', function () { layout(); if (!opened) openAtStart(); });
    window.addEventListener('resize', function () { reflow(true); });
    window.addEventListener('orientationchange', function () { setTimeout(function(){ reflow(true); }, 120); });

    var veil = document.getElementById('veil');
    function drop() { veil.classList.add('gone'); }
    var firstImg = VERT ? imgs[0] : imgs[imgs.length - 1];
    if (firstImg) { firstImg.complete ? drop() : firstImg.addEventListener('load', drop); }
    setTimeout(drop, 4000);

    // vertical wheel advances the unroll (leave real horizontal swipes native)
    if (!VERT) stage.addEventListener('wheel', function (e) {
      if (Math.abs(e.deltaX) > Math.abs(e.deltaY)) return;
      e.preventDefault();
      stage.scrollLeft -= e.deltaY;
      markMoved();
    }, { passive: false });

    // drag-to-pan on desktop; touch keeps native momentum
    var down = false, start = 0, startP = 0;
    stage.addEventListener('pointerdown', function (e) {
      if (e.pointerType === 'touch') return;
      down = true; markMoved(); start = VERT ? e.clientY : e.clientX; startP = pos();
      stage.classList.add('grabbing'); stage.setPointerCapture(e.pointerId);
    });
    stage.addEventListener('pointermove', function (e) {
      if (!down) return;
      setPos(startP - ((VERT ? e.clientY : e.clientX) - start));
    });
    function up() { down = false; stage.classList.remove('grabbing'); }
    stage.addEventListener('pointerup', up);
    stage.addEventListener('pointercancel', up);

    var caption = document.getElementById('caption');
    var hint = document.getElementById('hint');
    var progress = document.getElementById('progress');
    var moved = false;
    function markMoved() {
      opened = true;
      if (!moved) {
        moved = true;
        hint.classList.add('faded');
        setTimeout(function () { caption.classList.add('faded'); }, 2600);
      }
    }
    stage.addEventListener('scroll', function () {
      var max = extent();
      var seen = max > 0 ? (VERT ? pos() / max : 1 - pos() / max) : 0;
      progress.style.width = (seen * 100).toFixed(2) + '%';
      if (VERT) markMoved();
    }, { passive: true });
    stage.addEventListener('touchstart', function () { markMoved(); }, { passive: true });
    setTimeout(function () { if (!moved) hint.classList.add('faded'); }, 6000);

    // auto-hide the tab strip so the painting owns the screen
    var strip = document.getElementById('tabstrip');
    var hideT;
    function poke() {
      strip.classList.remove('tucked');
      clearTimeout(hideT);
      hideT = setTimeout(function () { strip.classList.add('tucked'); }, 2600);
    }
    poke();
    document.addEventListener('mousemove', function (e) { if (e.clientY < 100) poke(); });
    document.addEventListener('touchstart', function (e) {
      if (e.touches && e.touches[0] && e.touches[0].clientY < 100) poke();
    }, { passive: true });
  })();
  </script>
</body>
</html>
