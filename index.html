<!DOCTYPE html>
<html lang="zh-Hans">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
<title>A Thousand Li of Rivers and Mountains</title>
<meta name="description" content="Wang Ximeng's handscroll — unroll it, fold it, or select a detail.">
<link rel="stylesheet" href="css/type.css?v=3">
<style>
:root{
  --room:#0c0a08; --warm:#d9b45a; --line:rgba(217,180,90,.20);
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--room);overflow:hidden;
  font-family:var(--type);-webkit-font-smoothing:antialiased;
  -webkit-user-select:none;user-select:none;touch-action:none}

#room{position:fixed;inset:0;
  background:radial-gradient(88% 68% at 28% 6%, rgba(224,186,120,.11), transparent 62%), var(--room)}
#room::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:1;
  background:radial-gradient(132% 100% at 50% 50%, transparent 46%, rgba(0,0,0,.7) 100%)}

/* ---------------- the scroll ---------------- */
/* The eight scrolls range from 25:1 to 1:2, so a centred window put its top
   edge somewhere different on every painting and the chrome appeared to drift
   as you moved between them. Anchored to the top, the title and the panel sit
   in the same place on all of them, and the empty desk falls below -- which is
   where the empty part of a table is anyway. measure() sets the offset. */
#desk{position:absolute;left:50%;transform:translateX(-50%);z-index:2}
#window{position:absolute;overflow:hidden;background:#0e0c0a;cursor:crosshair;
  box-shadow:0 30px 80px rgba(0,0,0,.75), 0 0 0 1px rgba(217,180,90,.10)}
#window.panning{cursor:grabbing}
#window.zoomed{cursor:grab}
#rail{position:absolute;top:0;left:0;height:100%;transform-origin:0 0;will-change:transform}
#rail img{position:absolute;top:0;height:100%;display:block;border:0;
  -webkit-user-drag:none;pointer-events:none}
#window::before,#window::after{content:"";position:absolute;top:0;bottom:0;width:5%;
  pointer-events:none;z-index:4}
#window::before{left:0;background:linear-gradient(90deg,rgba(0,0,0,.55),transparent)}
#window::after{right:0;background:linear-gradient(270deg,rgba(0,0,0,.55),transparent)}
#sheen{position:absolute;inset:0;pointer-events:none;z-index:3;mix-blend-mode:soft-light;opacity:.45;
  background:
    repeating-linear-gradient(0deg, rgba(255,255,255,.05) 0 1px, transparent 1px 3px),
    linear-gradient(100deg, transparent 34%, rgba(255,244,214,.62) 50%, transparent 66%);
  background-size:auto, 260% 100%;
  background-position:0 0, var(--sheenX,0%) 0}

/* rolls: geometric, and the thing you drag to unroll */
.roll{position:absolute;top:0;height:100%;z-index:6;cursor:grab;transition:opacity .25s}
.roll.pulling{cursor:grabbing}
.roll .body{position:absolute;inset:0;
  background:#1a160f}                       /* D "blade": flat, no modelling */
#rollL .body{border-right:2px solid rgba(217,180,90,.5)}
#rollR .body{border-left:2px solid rgba(217,180,90,.5)}

/* ---- roll treatments, switched with ?rolls=b|c|d|e ----
   The default is a smooth three-stop gradient, i.e. a lit cylinder. These are
   angular alternatives: the roll stated as flat planes rather than modelled. */
body.rolls-b .roll .body{box-shadow:none;background:linear-gradient(90deg,
  #14110a 0 12%,#241f16 12% 26%,#3a3327 26% 42%,#4a4132 42% 58%,
  #3a3327 58% 74%,#241f16 74% 88%,#14110a 88% 100%)}
body.rolls-c .roll .body{box-shadow:none}
body.rolls-c #rollL .body{background:linear-gradient(90deg,
  #0d0b07 0 18%,#1b1710 18% 36%,#282218 36% 54%,#352d20 54% 72%,#43392a 72% 88%,#524634 88% 100%)}
body.rolls-c #rollR .body{background:linear-gradient(270deg,
  #0d0b07 0 18%,#1b1710 18% 36%,#282218 36% 54%,#352d20 54% 72%,#43392a 72% 88%,#524634 88% 100%)}
/* D is now the default; ?rolls=a restores the original lit cylinder. */
body.rolls-a .roll .body{box-shadow:0 18px 44px rgba(0,0,0,.55);
  background:linear-gradient(90deg, rgba(14,11,8,.96), rgba(52,45,34,.92) 46%, rgba(14,11,8,.96))}
body.rolls-a #rollL .body{border-right:1px solid rgba(217,180,90,.34)}
body.rolls-a #rollR .body{border-left:1px solid rgba(217,180,90,.34)}
body.rolls-e .roll .body{box-shadow:none;background:
  repeating-linear-gradient(90deg,#2a241a 0 11px,#100e09 11px 12px)}
#rollTag{position:fixed;left:12px;top:10px;z-index:40;font:11px/1 ui-monospace,Menlo,monospace;
  letter-spacing:2px;color:#7a6f5a;display:none}
body.rolltag #rollTag{display:block}

/* ---- grounds, switched with ?bg=paper|silk|blush|dawn ---------------------
   The default is a dark room: the painting glows, like a lit object in a vitrine.
   These invert that — the scroll lies on paper, as an album leaf does, and the
   chrome recedes to low-contrast ink. Everything below is expressed through
   variables so a theme is a palette, not a fork of the stylesheet. */
body[class*="bg-"]{ --line:var(--th-line); --warm:var(--th-accent); }
body[class*="bg-"] #room{background:linear-gradient(180deg,var(--th-bg),var(--th-bg2))}
body[class*="bg-"] #room::after{background:radial-gradient(130% 100% at 50% 46%,
  transparent 55%, rgba(120,104,78,.13) 100%)}
body[class*="bg-"] #window{background:var(--th-bg2);
  box-shadow:0 18px 46px var(--th-shadow), 0 0 0 1px var(--th-line)}
body[class*="bg-"] .roll .body{background:var(--th-roll)}
body[class*="bg-"] #rollL .body{border-right:2px solid var(--th-accent)}
body[class*="bg-"] #rollR .body{border-left:2px solid var(--th-accent)}
body[class*="bg-"] #sheen{opacity:.22}
body[class*="bg-"] .sect h2,
body[class*="bg-"] .stop .lb,
body[class*="bg-"] .persp,
body[class*="bg-"] #title,
body[class*="bg-"] #lang,
body[class*="bg-"] #back{color:var(--th-muted)}
body[class*="bg-"] .stop:hover .lb,
body[class*="bg-"] .stop.on .lb,
body[class*="bg-"] .persp:hover,
body[class*="bg-"] #lang:hover,
body[class*="bg-"] #back:hover{color:var(--th-ink)}
body[class*="bg-"] .stop .dot{background:var(--th-bg2);border-color:var(--th-accent)}
body[class*="bg-"] .stop.on .dot{background:var(--th-accent);box-shadow:none}
body[class*="bg-"] #card{background:var(--th-bg2);border-color:var(--th-line);
  box-shadow:0 8px 26px var(--th-shadow)}
body[class*="bg-"] #card .k{color:var(--th-ink)}
body[class*="bg-"] #card .n{color:var(--th-muted)}
body[class*="bg-"] #card .c{color:var(--th-muted)}
body[class*="bg-"] #loc{background:var(--th-bg2);border-color:var(--th-line)}
body[class*="bg-"] #locBox{border-color:var(--th-accent);
  box-shadow:0 0 0 9999px rgba(120,104,78,.22)}
body[class*="bg-"] #bleed{background:var(--th-bg)}
body[class*="bg-"] #dlabel{color:var(--th-ink);text-shadow:0 0 12px var(--th-bg)}
body[class*="bg-"] .mk{border-color:var(--th-accent);box-shadow:none}
body[class*="bg-"] #roads .case{stroke:rgba(255,255,255,.65)}
body[class*="bg-"] #roads .line{stroke:#3b3428}
body[class*="bg-"] #fold .row{border-color:var(--th-line);
  box-shadow:0 5px 16px var(--th-shadow)}
body[class*="bg-"] #marquee,body[class*="bg-"] #kept{border-color:var(--th-ink)}
body[class*="bg-"] body.topbar #panel{background:var(--th-bg)}

body.bg-paper{ --th-bg:#efe9dc; --th-bg2:#f6f1e7; --th-ink:#4a463c; --th-muted:#8a8375;
  --th-accent:#b6412e; --th-line:rgba(90,80,60,.20); --th-roll:#d6cbb4;
  --th-shadow:rgba(90,78,56,.22) }
body.bg-silk{ --th-bg:#ded2bb; --th-bg2:#e7ddc7; --th-ink:#4a4234; --th-muted:#8b8069;
  --th-accent:#a8402f; --th-line:rgba(80,68,46,.22); --th-roll:#c9bb9c;
  --th-shadow:rgba(80,66,42,.24) }
body.bg-blush{ --th-bg:#f6eff0; --th-bg2:#fbf6f6; --th-ink:#6a5b60; --th-muted:#9b8d92;
  --th-accent:#c98a9e; --th-line:rgba(120,95,105,.18); --th-roll:#e2d6da;
  --th-shadow:rgba(120,95,105,.18) }
body.bg-dawn{ --th-bg:#fdf6ef; --th-bg2:#f7f0f3; --th-ink:#6b6069; --th-muted:#968a94;
  --th-accent:#e0a08c; --th-line:rgba(120,105,105,.16); --th-roll:#ece0da;
  --th-shadow:rgba(120,105,100,.16) }
#bgTag{position:fixed;left:12px;top:42px;z-index:40;
  font:11px/1 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:2px;
  color:var(--th-muted,#7a6f5a);display:none}
body.bgtag #bgTag{display:block}

/* ---- pictograms, switched with ?icons=1 --------------------------------
   Each zoom icon is the SHAPE OF THE WINDOW that mode gives you: four stacked
   bars for the four-row fold, one wide bar for full breadth, a near-square for
   the pane, a marquee around a crop for a detail. The perspectives are the
   thing itself — a frame with a block sliding in it, rings, a winding line.
   With icons the headings are redundant, so they go. */
body.icons .sect h2{display:none}
body.icons .sect{margin-bottom:22px}
body.icons #track{margin-top:2px}
body.icons .stop .lb{margin-top:6px;line-height:0}
body.icons .persp .lb{line-height:0;display:inline-flex;align-items:center}
body.icons .ico{display:block;width:26px;height:26px}
body.icons .stop .ico{margin:0 auto}
body.icons .persp .ico{width:30px;height:22px}
.ico{fill:none;stroke:currentColor;stroke-width:1.6;
  stroke-linecap:square;stroke-linejoin:miter;vector-effect:non-scaling-stroke}
.ico .f{fill:currentColor;stroke:none}
body.topbar.icons .stop .lb{margin-top:3px}
body.topbar.icons .ico{width:22px;height:22px}
#marks{position:absolute;inset:0;z-index:7;pointer-events:none;display:none}
/* roads draw themselves as you arrive — see drawIn() */
/* placing a colophon: the next tap on the painting is where it goes */
body.placing #window{cursor:crosshair}
/* the mounting silk after the painting, and every colophon on it: one canvas */
#silk{position:absolute;inset:0;z-index:2;pointer-events:none;display:none}
#editor{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);z-index:70;
  width:min(420px,90vw);display:none;background:rgba(20,17,12,.96);
  border:1px solid #4a4030;border-radius:4px;padding:12px}
#editor.on{display:block}
#editor .where{font-size:11px;letter-spacing:.5px;margin-bottom:8px;padding-bottom:6px;
  border-bottom:1px solid rgba(90,80,60,.25)}
#editor .where.private{color:#7f9a88}
#editor .where.shared{color:#c2ae7f}
#editor .where.mounted{color:#d9b45a}
#editor .who{font-size:11px;color:#8d8270;margin-bottom:6px}
#editor .who:empty{display:none}
#editor textarea[readonly]{color:#e4d8b8;background:#151109}
#editor button.send{background:#2f3a22;border-color:#4f6a30;color:#dfeac2}
#editor input,#editor textarea{width:100%;background:#0f0c09;color:#e4d8b8;
  border:1px solid #3b342a;border-radius:2px;padding:7px 8px;margin-bottom:7px;
  font:inherit;font-size:13px;resize:vertical}
#editor .row{display:flex;gap:8px;justify-content:flex-end}
#editor button{background:#241f18;color:#cbbd9c;border:1px solid #3b342a;
  border-radius:2px;padding:5px 12px;font-size:12px;cursor:pointer}
#editor button.ok{background:#4a3f1e;border-color:#7a6530;color:#f3e6c2}
#editor button.del:hover{background:#4a221c;border-color:#7d3a2e;color:#f3d0c6}
/* the colophons, read in the order the scroll unrolls */
#script{position:fixed;right:22px;top:96px;bottom:26px;width:min(320px,42vw);z-index:60;
  display:none;overflow-y:auto;background:rgba(18,15,11,.95);border:1px solid #3a3327;
  border-radius:3px;padding:8px}
#script.on{display:block}
#script .row{padding:9px 10px;border-bottom:1px solid rgba(90,80,60,.18);cursor:pointer}
#script .row:hover{background:rgba(217,180,90,.07)}
#script .at{font-size:10px;color:#6f6552;letter-spacing:1px;margin-right:8px}
#script .tt{font-size:13px;color:#d9caa4}
#script .row.private .tt{color:#bfe6d2}
#script .tier{font-size:10px;margin-right:8px;padding:0 4px;border:1px solid #5a5040;color:#d9caa4;letter-spacing:1px}
#script .tier.mounted{color:#d9b45a;border-color:#6a5a34}
#script .tier.private{color:#bfe6d2;border-color:#3f6a55}
#script .by{font-size:10px;color:#6f6552;margin-left:8px}
#script .hand{font-size:11px;color:#8d8270;padding:2px 8px 10px;border-bottom:1px solid rgba(90,80,60,.2)}
#script .act{display:flex;flex-wrap:wrap;gap:6px;padding:8px 8px 6px}
#script .act button{background:#241f18;color:#cbbd9c;border:1px solid #3b342a;
  font:inherit;font-size:11px;letter-spacing:1px;padding:5px 9px;cursor:pointer}
#script .act button:hover{background:#2e2820;color:#f0e6cd}
#script .bd{margin-top:4px;font-size:12px;line-height:1.5;color:#8d8270;text-wrap:pretty}
#script .empty{padding:14px;font-size:12px;color:#6f6552;text-align:center}
#scriptCount{margin-left:6px;font-size:10px;color:#6f6552}
body.icons #scriptCount{display:none}
#toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:80;
  background:rgba(20,17,12,.95);border:1px solid #4a4030;border-radius:3px;
  padding:8px 14px;font-size:12px;color:#d8c9a4;opacity:0;transition:opacity .3s;
  pointer-events:none;max-width:86vw;text-align:center}
#toast.on{opacity:1}
#script .row.room .tt{color:#cfc2ee}
#script .by{font-size:10px;color:#8d8270;margin-left:7px}
/* a hanging scroll: no roll ends, no unrolling stops, no horizontal locator.
   Everything else -- zoom, notes, the panel, the language toggle -- stands. */
body.vert #rollL, body.vert #rollR, body.vert #sheen{display:none !important}
body.vert .sect.zoomsect, body.vert .persp[data-t="loc"]{display:none}
body.vert #rail img{display:block}
/* ---- English sets differently from Chinese ------------------------------
   A Chinese title is 5 characters in a fixed square grid; its English
   equivalent is "Illustration to the Second Prose Poem on the Red Cliff" --
   eight times the length, in glyphs of varying width. Layouts measured
   against the Chinese therefore break under the English, and the damage
   shows up as bad rag: one long line, then a word alone underneath.

   Three things, all cheap:

   1. letter-spacing goes. 2-3px is right for 方块字, which need the air; on
      Latin it pulls words into loose letters. This is the single biggest
      cause of the wrapping looking wrong.
   2. text-wrap: balance on short text -- titles, labels, captions. It evens
      the line lengths instead of filling greedily and leaving a stub. The
      browser applies it up to six lines (Chromium) or ten (Firefox), which
      is exactly the range these elements live in.
   3. text-wrap: pretty on running text, which prevents the last line being
      a single orphaned word.

   Measure stays out of it: the classic 45-75 characters is for paragraphs,
   and none of this is a paragraph. */
:lang(en) #title, :lang(en) .cell .name, :lang(en) .cell .meta,
:lang(en) .cell .await, :lang(en) #geo .sub, :lang(en) #notready,
:lang(en) .lb{
  letter-spacing:.2px; text-wrap:balance;
}
:lang(en) #credit{ letter-spacing:0; text-wrap:pretty }
/* the corner title is the worst case: longest string, narrowest column */
:lang(en) #title{ max-width:min(46vw,380px); line-height:1.45 }
/* and the cells were sized for five characters, not fifty */
:lang(en) .cell{ min-height:118px }
:lang(en) .cell .name{ font-size:14.5px; line-height:1.35 }
:lang(en) .cell .meta{ line-height:1.4 }
/* the photographs, each laid on the painting by its own homography */
#photos{position:absolute;left:0;top:0;z-index:6;transform-origin:0 0;display:none;
  pointer-events:none}
/* The outline marks the place; the photograph inside it is what fades. They
   were one element with one opacity, so hiding the photograph hid the outline
   too and the toggle appeared to do nothing at all. */
.shot{position:absolute;left:0;top:0;transform-origin:0 0;pointer-events:auto;
  cursor:pointer;outline:1px solid rgba(120,220,190,.55);outline-offset:-1px}
/* Switching the layer on shows the photographs themselves, all of them, laid
   where they belong -- that is the view that answers "are these placed right".
   Outlines alone were a worse answer to the same question. */
.shot img{width:100%;height:100%;display:block;opacity:.94;transition:opacity .25s ease}
.shot:hover{outline-color:rgba(170,245,220,1);z-index:2}
.shot.on{outline-color:rgba(255,215,106,.95);background:none;z-index:3}
.shot.on img{opacity:1}
/* with one open the rest drop back far enough to see the painting through them */
body.shotopen .shot:not(.on){outline-color:rgba(120,220,190,.25);background:none;pointer-events:none}
body.shotopen .shot:not(.on) img{opacity:.12}
/* the mark: fixed size, so it reads as an offer rather than a patch */
#collage{position:absolute;left:0;top:0;z-index:6;pointer-events:none;display:none}
#shotdots{position:absolute;inset:0;z-index:8;pointer-events:none;display:none}
.shotdot{position:absolute;width:13px;height:13px;margin:-7px 0 0 -7px;border-radius:50%;
  border:1px solid rgba(150,235,205,.85);background:rgba(20,40,36,.45);
  pointer-events:auto;cursor:pointer;transition:transform .2s ease, background .2s ease}
.shotdot::after{content:"";position:absolute;inset:3.5px;border-radius:50%;
  background:rgba(150,235,205,.9)}
.shotdot:hover{transform:scale(1.45);background:rgba(30,70,60,.7)}
body[class*="bg-"] .shotdot{border-color:rgba(40,110,95,.9);background:rgba(255,255,255,.55)}
body[class*="bg-"] .shotdot::after{background:rgba(30,90,78,.95)}
.persp.half .box::after{transform:scale(.55)}
#shotbar{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:70;
  display:none;align-items:center;gap:12px;background:rgba(20,17,12,.95);
  border:1px solid #4a4030;border-radius:4px;padding:9px 12px;max-width:92vw}
#shotbar.on{display:flex}
#shotbar .txt{min-width:180px}
#shotbar .nm{font-size:12px;color:#e2d4ae;letter-spacing:.5px}
#shotbar .st{font-size:10px;color:#8d8270;letter-spacing:.5px;margin-top:2px}
#shotbar input{width:190px;accent-color:#c9a24a}
#shotbar button{background:#241f18;color:#cbbd9c;border:1px solid #3b342a;
  border-radius:2px;padding:4px 9px;font-size:13px;cursor:pointer}
#shotbar button:hover{background:#2e2820;color:#f0e6cd}
#shotCount{margin-left:6px;font-size:10px;color:#6f6552}
body.icons #shotCount{display:none}
#notready{position:fixed;left:50%;top:14px;transform:translateX(-50%);z-index:60;
  background:rgba(24,20,14,.92);border:1px solid #4a4030;border-radius:3px;
  padding:9px 14px;font-size:12px;letter-spacing:1px;color:#d8c9a4;
  transition:opacity .6s ease;max-width:88vw;text-align:center}
#notready span{color:#8d8270;font-size:11px}
#notready.go{opacity:0;pointer-events:none}
  text-shadow:0 1px 6px #000}
/* a noted thing: a box round it, the remark set just above */
  box-shadow:0 0 14px rgba(217,180,90,.16), inset 0 0 18px rgba(217,180,90,.07);
  transition:border-color .3s}
  font-size:11px;letter-spacing:1px;color:#f0e2bb;text-shadow:0 1px 4px #000,0 0 10px #000}
.mk{position:absolute;width:26px;height:26px;margin:-13px 0 0 -13px;border-radius:50%;
  border:1px solid rgba(233,209,150,.5);pointer-events:auto;cursor:pointer;
  box-shadow:0 0 12px rgba(217,180,90,.25), inset 0 0 10px rgba(217,180,90,.13);
  transition:transform .3s ease, border-color .3s ease}
.mk:hover{transform:scale(1.35);border-color:rgba(247,231,190,.95)}

#card{position:absolute;z-index:12;max-width:210px;padding:9px 12px;
  background:rgba(18,15,11,.94);border:1px solid rgba(217,180,90,.45);
  box-shadow:0 8px 30px rgba(0,0,0,.7);opacity:0;pointer-events:none;
  transition:opacity .45s ease, transform .45s ease;transform:translateY(5px)}
#card.on{opacity:1;transform:translateY(0)}
#card .k{font-size:13px;letter-spacing:3px;color:#f0e6cd;margin-bottom:3px}
#card .n{font-size:12px;line-height:1.45;color:#9d917a}
#card .c{font-size:10px;letter-spacing:2px;color:#6b6151;margin-top:5px;text-transform:uppercase}

/* roads: white over a dark casing so the line survives both silk and shadow.
   non-scaling-stroke keeps it a constant screen width at every zoom. */
#roads{position:absolute;left:0;top:0;z-index:5;pointer-events:none;overflow:visible;
  transform-origin:0 0;display:none}
#roads path{fill:none;vector-effect:non-scaling-stroke;stroke-linecap:round;stroke-linejoin:round}
#roads .case{stroke:rgba(0,0,0,.5);stroke-width:3.4}
#roads .line{stroke:#fff;stroke-width:1.4}
/* stretches the tracer had to leap across — road inferred, not seen */
#roads .gap{stroke-dasharray:0.5 5}
#roads .gap.line{opacity:.8}
.persp.off{opacity:.35;cursor:default}

/* the dashed selection, and the outline kept afterwards for context */
#marquee,#kept{position:absolute;z-index:9;display:none;pointer-events:none;
  border:1px dashed rgba(245,230,192,.95)}
#marquee{background:rgba(217,180,90,.07)}
#kept{transition:opacity 1.1s ease;box-shadow:0 0 0 1px rgba(0,0,0,.5), 0 0 18px rgba(217,180,90,.26)}
#bleed{position:absolute;inset:0;z-index:10;pointer-events:none;background:#0d0b09;
  transition:opacity 1.4s ease}
#dlabel{position:absolute;left:50%;bottom:9%;transform:translateX(-50%);z-index:11;
  font-size:15px;letter-spacing:5px;color:#f4e8c8;opacity:0;pointer-events:none;
  transition:opacity .8s ease;text-shadow:0 0 14px rgba(0,0,0,.95)}

/* ---------------- fold ---------------- */

/* Which scroll. ?p=<slug> picks one from the register; the annotation files
   are per-painting, so they are written in here rather than fixed in the page.
   document.write is the honest tool for this: these scripts must be in place
   before the viewer below runs, and the alternative is rewriting the whole
   viewer as async for the sake of one lookup. */
(function(){
  // Arriving at the bare address used to open 千里江山图, which read as "this
  // site is that scroll" -- confusing once there were ten. No ?p= means the
  // case instead, where you choose. Every existing ?p= link still works, and
  // whatever else was on the URL travels with you.
  if(!/[?&]p=/.test(location.search)){
    location.replace('cabinet.html'+location.search+location.hash);
    return;
  }
  var R=window.PAINTINGS, m=/[?&]p=([a-z0-9_-]+)/i.exec(location.search);
  var slug=(m&&m[1])||R.default;
  var it=R.items.filter(function(x){return x.slug===slug;})[0];
  if(!it || !it.dir){                       // known but not digitised, or unknown
    window.NOT_READY = it || {slug:slug};
    it=R.items.filter(function(x){return x.slug===R.default;})[0];
  }
  window.PAINTING=it;
  var B='?b='+(window.BUILD||'0');
  document.write('<scr'+'ipt src="'+it.dir+'/manifest.js'+B+'"></scr'+'ipt>');
  (it.data||[]).forEach(function(d){
    document.write('<scr'+'ipt src="assets/data/'+d+'.js'+B+'" onerror="void 0"></scr'+'ipt>');
  });

  // case for a painting nobody has written after yet, hence the silent onerror
  document.write('<scr'+'ipt src="assets/data/tiba-'+slug+'.js'+B+'" onerror="void 0"></scr'+'ipt>');
  // where each gallery photograph sits on this scroll, if any have been placed
  document.write('<scr'+'ipt src="'+it.dir+'/photos/photos.js'+B+'" onerror="void 0"></scr'+'ipt>');
})();

  const xs=cum.map(c=>Math.round(c*scale));
  for(let i=0;i<imgs.length;i++){
    if(VERT){ imgs[i].style.top=xs[i]+'px'; imgs[i].style.left='0px';
              imgs[i].style.height=(xs[i+1]-xs[i])+'px'; imgs[i].style.width=Math.round(L*scale)+'px'; }
    else    { imgs[i].style.left=xs[i]+'px'; imgs[i].style.width=(xs[i+1]-xs[i])+'px'; }
  }
  if(VERT){ rail.style.width=Math.round(L*scale)+'px'; rail.style.height=xs[xs.length-1]+'px'; }
  else rail.style.width=xs[xs.length-1]+'px';
  roadsEl.setAttribute('width', VERT?Math.round(L*scale):xs[xs.length-1]);
  roadsEl.setAttribute('height', VERT?xs[xs.length-1]:apH);
  desk.style.width=apW+'px'; desk.style.height=apH+'px';
  win.style.width=apW+'px'; win.style.height=apH+'px';
  core=apH*0.030;
  const maxLen=(L-visW())*scale, rmax=apH*0.15;
  thick=Math.PI*(rmax*rmax-core*core)/Math.max(1,maxLen);
  loc.style.width=Math.min(vw*(narrow?0.94:0.60),740)+'px';
  layoutFold(); clamp(); render();
}
const rollRadius=len=>Math.sqrt(core*core+thick*Math.max(0,len)*scale/Math.PI);
// The scroll is longer than the painting. Past the last mountain (left of x=0
// on a handscroll, below PH on a hanging one) is mounting silk that the
// colophons are written on, so the pan domain reaches into it. Blank silk
// exists before anything is written; there has to be somewhere to write.
const TAIL_MIN=(VERT?L:PH)*0.5;
let tailLen=TAIL_MIN;
const railMin=()=>VERT?0:-tailLen;
const railMaxY=()=>VERT?PH+tailLen:PH;
function clamp(){
  x0=Math.max(railMin(),Math.min(Math.max(0,L-visW()),x0));
  y0=Math.max(0,Math.min(Math.max(0,railMaxY()-visH()),y0));
}

function layoutFold(){
  const narrow=innerWidth<=760;
  const availW=Math.min(innerWidth-(narrow?14:250),1360);
  const availH=innerHeight-(narrow?(showLoc?176:112):(showLoc?130:88));
  const N=Math.max(2,Math.min(9,Math.round(Math.sqrt(availH*CR/(availW*PH)))));
  const gap=8, seg=CR/N;
  let rowW=availW, rowH=rowW*PH/seg;
  const total=N*rowH+(N-1)*gap;
  if(total>availH){ const k=availH/total; rowW*=k; rowH*=k; }
  foldEl.style.gap=gap+'px'; foldEl.innerHTML='';
  for(let i=0;i<N;i++){
    const a=CR-(i+1)*seg;
    const d=document.createElement('div');
    d.className='row';
    // Whole view was painting every scroll from the Wang Ximeng strip, because
    // the strip was a fixed URL in the stylesheet. Each painting has its own.
    if(window.PAINTING&&PAINTING.strip) d.style.backgroundImage="url('"+PAINTING.strip+"')";
    d.style.width=rowW+'px'; d.style.height=rowH+'px';
    const bgW=(L/seg)*rowW;
    d.style.backgroundSize=bgW+'px '+(bgW*PH/L)+'px';
    d.style.backgroundPosition=(-(a/seg)*rowW)+'px 0px';
    d.innerHTML='<span class="seg">'+t('seg')(i,N)+'</span>';
    d.addEventListener('click',ev=>{
      const r=d.getBoundingClientRect();
      setMode('pane');
      x0=a+((ev.clientX-r.left)/rowW)*seg-visW()/2; clamp(); render();
    });
    foldEl.appendChild(d);
  }
}

function render(){
  if(mode!=='fold'){
    const sE=scale*Z;
    TX=-x0*sE; TY=-y0*sE;
    const tf='translate3d('+TX.toFixed(2)+'px,'+TY.toFixed(2)+'px,0) scale('+Z.toFixed(4)+')';
    rail.style.transform=tf;
    roadsEl.style.transform=tf; photosEl.style.transform=tf;
    roadsEl.style.display=(showRoads&&ROADS.length)?'block':'none';
    if(showRoads) litRoads();
    const fade=VERT?0:((mode==='wide')?0:(Z<=1.03?1:Math.max(0,1-(Z-1)/0.5)));
    rollL.style.opacity=fade; rollR.style.opacity=fade;
    rollL.style.pointerEvents=fade>.4?'auto':'none';
    rollR.style.pointerEvents=fade>.4?'auto':'none';
    if(fade>0){
      const RL=rollRadius(x0), RR=rollRadius(Math.max(0,L-x0-visW()));
      rollL.style.width=(2*RL)+'px'; rollL.style.left=(-2*RL)+'px';
      rollR.style.width=(2*RR)+'px'; rollR.style.left=apW+'px';
    }
    const f=Math.max(0,Math.min(1,x0/Math.max(1,L-visW())));
    sheen.style.setProperty('--sheenX',(12+f*76).toFixed(1)+'%');
    win.classList.toggle('zoomed', Z>1.03);
    renderMarks(sE); drawTiba(sE); renderShots(); renderKept(sE);
  }

}
const markEls=ITEMS.map(d=>{
  const el=document.createElement('div'); el.className='mk';
  el.addEventListener('pointerdown',ev=>ev.stopPropagation());
  el.addEventListener('click',ev=>{ ev.stopPropagation(); revealThing(d,true); });
  marksEl.appendChild(el); return el;
});
const card=document.createElement('div'); card.id='card'; win.appendChild(card);
let cardT=null;
function revealThing(d,known){
  const sE=scale*Z;
  const label=(TYPE[lang]&&TYPE[lang][d.type])||TYPE[lang].other;
  card.innerHTML='<div class="k">'+label+'</div>'+
    (d.note?'<div class="n">'+d.note+'</div>':'')+
    (known?'':'<div class="c">'+t('found')+'</div>');
  let cx=d.x*sE+TX+16, cy=d.y*sE+TY-10;
  cx=Math.max(8,Math.min(apW-224,cx)); cy=Math.max(8,Math.min(apH-90,cy));
  card.style.left=cx+'px'; card.style.top=cy+'px';
  card.classList.add('on');
  clearTimeout(cardT); cardT=setTimeout(()=>card.classList.remove('on'), known?4200:5200);
}
function renderMarks(sE){
  // the layer carries both; it hides only when neither wants it
  marksEl.style.display=showMarks&&mode!=='fold' ? 'block' : 'none';
  if(!showMarks||mode==='fold'){ markEls.forEach(e=>e.style.display='none'); return; }
  for(let i=0;i<ITEMS.length;i++){
    const d=ITEMS[i], el=markEls[i];
    const sx=d.x*sE+TX, sy=d.y*sE+TY;
    if(sx<-30||sx>apW+30||sy<-30||sy>apH+30){ el.style.display='none'; continue; }
    el.style.display='block'; el.style.left=sx+'px'; el.style.top=sy+'px';
  }
}
function renderKept(sE){
  if(!kept){ keptEl.style.display='none'; return; }
  keptEl.style.display='block';
  keptEl.style.left=(kept.x*sE+TX)+'px'; keptEl.style.top=(kept.y*sE+TY)+'px';
  keptEl.style.width=(kept.w*sE)+'px';   keptEl.style.height=(kept.h*sE)+'px';
}
function syncLoc(){
  loc.style.display=showLoc?'block':'none';
  if(!showLoc) return;
  const w=loc.clientWidth;
  if(mode==='fold'){ locBox.style.left='0px'; locBox.style.width=w+'px'; return; }
  const m=railMin(), span=L-m;
  const a=((x0-m)/span)*w, b=(visW()/span)*w;
  locBox.style.left=Math.max(0,Math.min(w-b,a))+'px';
  locBox.style.width=Math.max(3,b)+'px';
}

// the zoom number line; the third stop exists only once you've made one
function buildTrack(){
  [...track.querySelectorAll('.stop')].forEach(n=>n.remove());
  const stops=[['fold',t('whole')],['wide',t('wide')],['pane',t('pane')]];
  if(customUsed) stops.push(['custom',t('detail')]);
  stops.forEach(([k,label],i)=>{
    const el=document.createElement('div');
    el.className='stop'; el.dataset.k=k;
    el.style.left=(i/(stops.length-1))*100+'%';
    el.innerHTML='<div class="dot"></div><div class="lb"></div>';
    iconise(el.querySelector('.lb'),k,label);
    el.addEventListener('click',()=>setMode(k));
    track.appendChild(el);
  });
  syncTrack();
}
function syncTrack(){
  [...track.querySelectorAll('.stop')].forEach(el=>
    el.classList.toggle('on', el.dataset.k===mode));
}

function setMode(m){
  if(m==='custom'&&!customUsed) m='pane';
  mode=m;
  if(m==='fold'){ desk.style.display='none'; foldEl.style.display='flex'; layoutFold(); }
  else{
    desk.style.display='block'; foldEl.style.display='none';
    if(m==='pane'||m==='wide'){ Z=1; y0=0; kept=null; }
    else if(m==='custom'&&lastCustom){
      Z=lastCustom.Z; x0=lastCustom.x0; y0=lastCustom.y0; kept=lastCustom.kept;
      keptEl.style.opacity='1'; setTimeout(()=>{keptEl.style.opacity='0';},2600);
    }
  }
  measure();                                  // aperture geometry depends on the mode
  clamp(); render();
}

let last=performance.now();
function loop(now){
  const dt=Math.min(.05,(now-last)/1000); last=now;
  if(mode!=='fold'&&!panning){
    if(target!==null){
      const d=target-x0;
      if(Math.abs(d)<.6){ x0=target; target=null; vel=0; } else x0+=d*Math.min(1,dt*7);
    } else if(vel!==0){
      vel*=Math.pow(.94,dt*60); x0+=vel*dt;
      if(Math.abs(vel)<8){ vel=0; snap(); }
      const mx=Math.max(0,L-visW()); if(x0<railMin()||x0>mx) vel=0;
    }
  }
  clamp(); render(); requestAnimationFrame(loop);
}
function snap(){
  if(Z>1.03||!EP.length||x0<0) return;
  let best=null,bd=1e9;
  for(const e of EP){ const d=Math.abs(e.x0-x0); if(d<bd){bd=d;best=e.x0;} }
  if(best!==null&&bd<visW()*0.32) target=best;
}

// --- drag a ROLL to unroll -------------------------------------------------
let px=0,sx=0,eng=false,dv=0,lt=0,lx=0;
function rollDown(e){
  panning=true; eng=false; target=null; vel=0;
  px=e.clientX; sx=x0; lx=e.clientX; lt=performance.now();
  e.currentTarget.setPointerCapture(e.pointerId);
  e.currentTarget.classList.add('pulling'); e.stopPropagation();
}
function rollMove(e){
  if(!panning) return;
  const dx=e.clientX-px;
  if(!eng){ if(Math.abs(dx)<5) return; eng=true; px=e.clientX; sx=x0; }
  const sE=scale*Z;
  x0=sx-(e.clientX-px)/sE;
  const now=performance.now(), dt=(now-lt)/1000;
  if(dt>.004){ dv=-((e.clientX-lx)/sE)/dt; lx=e.clientX; lt=now; }
}
function rollUp(){
  if(!panning) return;
  panning=false; vel=eng?dv:0; dv=0;
  [rollL,rollR].forEach(r=>r.classList.remove('pulling'));
}
[rollL,rollR].forEach(r=>{
  r.addEventListener('pointerdown',rollDown);
  r.addEventListener('pointermove',rollMove);
  r.addEventListener('pointerup',rollUp);
  r.addEventListener('pointercancel',rollUp);
});

// --- drag the SILK to select; when already zoomed, to pan ------------------
let marq=null, panZ=null;
let tapAt=null;                 // where the pointer went down; a click that moved is a drag
win.addEventListener('pointerdown',e=>{
  if(pts.size>1) return;
  tapAt={x:e.clientX,y:e.clientY};
  const r=win.getBoundingClientRect();
  // touch: a finger drag means "move the scroll", always. Zoom is pinch.
  if(e.pointerType==='touch' || Z>1.03){
    panZ={x:e.clientX,y:e.clientY,x0:x0,y0:y0,lx:e.clientX,lt:performance.now(),v:0};
    target=null; vel=0;
    win.classList.add('panning'); win.setPointerCapture(e.pointerId); return;
  }
  marq={x:e.clientX-r.left,y:e.clientY-r.top};
  marqEl.style.display='block';
  marqEl.style.left=marq.x+'px'; marqEl.style.top=marq.y+'px';
  marqEl.style.width='0px'; marqEl.style.height='0px';
  win.setPointerCapture(e.pointerId);
});
win.addEventListener('pointermove',e=>{
  if(panZ){
    const sE=scale*Z;
    x0=panZ.x0-(e.clientX-panZ.x)/sE; y0=panZ.y0-(e.clientY-panZ.y)/sE;
    const now=performance.now(), dt=(now-panZ.lt)/1000;
    if(dt>.004){ panZ.v=-((e.clientX-panZ.lx)/sE)/dt; panZ.lx=e.clientX; panZ.lt=now; }
    clamp(); return;
  }
  if(!marq) return;
  const r=win.getBoundingClientRect(), cx=e.clientX-r.left, cy=e.clientY-r.top;
  marqEl.style.left=Math.min(marq.x,cx)+'px'; marqEl.style.top=Math.min(marq.y,cy)+'px';
  marqEl.style.width=Math.abs(cx-marq.x)+'px'; marqEl.style.height=Math.abs(cy-marq.y)+'px';
});
function winUp(){
  if(panZ){ vel=panZ.v||0; panZ=null; win.classList.remove('panning'); return; }  // flick glides
  if(!marq) return;
  const w=parseFloat(marqEl.style.width)||0, h=parseFloat(marqEl.style.height)||0;
  const lf=parseFloat(marqEl.style.left)||0, tp=parseFloat(marqEl.style.top)||0;
  marqEl.style.display='none'; marq=null;
  if(w<26||h<26){
    if(!showMarks && ITEMS.length && w<6 && h<6){      // a tap, not a scrub: go hunting
      const sE0=scale*Z, cx=(lf-TX)/sE0, cy=(tp-TY)/sE0;
      let best=null,bd=1e9;
      for(const d of ITEMS){ const q=Math.hypot(d.x-cx,d.y-cy); if(q<bd){bd=q;best=d;} }
      if(best && bd < 46/(scale*Z)) revealThing(best,false);
    }
    return;
  }
  const sE=scale*Z;
  const sel={x:x0+lf/sE, y:y0+tp/sE, w:w/sE, h:h/sE};
  const PAD=1.38;                                   // keep context around the selection
  const want=Math.min(apW/(sel.w*PAD*scale), apH/(sel.h*PAD*scale));
  Z=Math.max(MINZ, Math.min(nativeZ(), want));
  x0=sel.x+sel.w/2-visW()/2; y0=sel.y+sel.h/2-visH()/2;
  kept=sel; customUsed=true; clamp();
  lastCustom={Z:Z,x0:x0,y0:y0,kept:sel};
  mode='custom'; buildTrack(); render();
  keptEl.style.opacity='1';
  setTimeout(()=>{ keptEl.style.opacity='0'; },2600);
}
win.addEventListener('pointerup',winUp);
win.addEventListener('pointercancel',winUp);

// --- wheel travels; pinch changes zoom ------------------------------------
// Zoom has to hold a point still. Screen = (src - x0) * scale * Z, so keeping the
// source point under (px,py) fixed means moving the origin by the difference of
// the two reciprocals. Without this the top-left corner is what stays put, which
// is why zooming walked the view to the top no matter where you were looking.
// Where a photograph covers what you are looking at, it may be zoomed past the
// scan's own limit -- that is the whole point of having it. Elsewhere the
// ceiling stays where it was, because stretching the scan further shows nothing.
function zoomCap(){
  if(!SHOTS.length || shotMode===0) return nativeZ();
  const cx=x0+visW()/2, cy=y0+visH()/2;
  let best=1;
  for(const it of SHOTS){
    const b=it.box;
    if(cx>=b[0] && cx<=b[0]+b[2] && cy>=b[1] && cy<=b[1]+b[3])
      best=Math.max(best, Math.min(4, it.ppsp||1));
  }
  return nativeZ()*best;
}
function zoomAbout(nextZ, px, py){
  const before=scale*Z;
  Z=Math.max(1, Math.min(zoomCap(), nextZ));
  const after=scale*Z;
  if(after!==before){
    x0 += px/before - px/after;
    y0 += py/before - py/after;
  }
  clamp();
}
const winPt=e=>{ const r=win.getBoundingClientRect();
  return [e.clientX-r.left, e.clientY-r.top]; };
addEventListener('wheel',e=>{
  if(mode==='fold') return;
  if(e.ctrlKey){
    e.preventDefault();
    const before=Z, [px,py]=winPt(e);
    zoomAbout(Z*(1-e.deltaY*0.01), px, py);
    if(Z<=1.02&&before>1.02){ setMode('pane'); return; }
    if(Z>1.02){ customUsed=true; mode='custom'; lastCustom={Z:Z,x0:x0,y0:y0,kept:kept}; buildTrack(); }
    render(); return;
  }
  const d=Math.abs(e.deltaX)>Math.abs(e.deltaY)?e.deltaX:e.deltaY;
  target=null;
  if(VERT) y0+=d/(scale*Z)*1.1; else x0+=d/(scale*Z)*1.1;
  vel=0; clamp(); render();
},{passive:false});

// two-finger pinch
const pts=new Map(); let pinch0=null;
addEventListener('pointerdown',e=>{
  if(e.pointerType!=='touch') return;
  pts.set(e.pointerId,e);
  if(pts.size===2){ panZ=null; marq=null; marqEl.style.display='none';
    win.classList.remove('panning'); vel=0; }
},true);
addEventListener('pointermove',e=>{
  if(e.pointerType!=='touch'||!pts.has(e.pointerId)) return;
  pts.set(e.pointerId,e);
  if(pts.size===2){
    const [a,b]=[...pts.values()];
    const d=Math.hypot(a.clientX-b.clientX,a.clientY-b.clientY);
    // the midpoint between the fingers is the thing being pinched: hold it still
    const r=win.getBoundingClientRect();
    const px=(a.clientX+b.clientX)/2-r.left, py=(a.clientY+b.clientY)/2-r.top;
    if(pinch0===null){ pinch0={d:d,Z:Z}; return; }
    const before=Z;
    zoomAbout(pinch0.Z*(d/pinch0.d), px, py);
    if(Z<=1.02&&before>1.02) setMode('pane');
    else if(Z>1.02){ customUsed=true; mode='custom'; lastCustom={Z:Z,x0:x0,y0:y0,kept:kept}; buildTrack(); }
    render();
  }
},true);
function dropPt(e){ pts.delete(e.pointerId); if(pts.size<2) pinch0=null; }
addEventListener('pointerup',dropPt,true);
addEventListener('pointercancel',dropPt,true);

// --- locator ---------------------------------------------------------------
let scrub=false;
function seek(cx){
  const r=loc.getBoundingClientRect();
  const f=Math.max(0,Math.min(1,(cx-r.left)/r.width));
  if(mode==='fold') setMode('pane');
  x0=f*L-visW()/2; vel=0; target=null; clamp(); render();
}
loc.addEventListener('pointerdown',e=>{scrub=true;loc.setPointerCapture(e.pointerId);seek(e.clientX);});
loc.addEventListener('pointermove',e=>{if(scrub)seek(e.clientX);});

// --- perspectives ----------------------------------------------------------
document.querySelectorAll('.persp').forEach(el=>{

    if(k==='marks'){ showMarks=!showMarks; el.classList.toggle('on',showMarks); }
    if(k==='roads'){ if(!ROADS.length) return; showRoads=!showRoads; el.classList.toggle('on',showRoads); }
    if(k==='tiba'){ $('script').classList.toggle('on'); buildScript(); render(); return; }
    if(k==='shots'){ if(!SHOTS.length) return;

      el.classList.toggle('on', shotMode!==0);
      el.classList.toggle('half', shotMode===1);

    render();
  });
});

// Words become the accessible name and the tooltip, so nothing is lost by

function iconise(el,key,word){
  if(!el) return;
  if(ICONS_ON&&ICO[key]){ el.innerHTML=ico(key); el.setAttribute('aria-label',word); el.title=word; }
  else el.textContent=word;
}
// ---- the photographs, laid on the painting --------------------------------
// A placement is a homography from photo pixels to source pixels, and CSS can
// express exactly that: matrix3d takes the same 3x3, column-major, with the
// third row and column left as identity. So the photograph can be laid over the
// scroll where it claims to belong rather than shown beside it -- which is the
// only way to see whether a placement is right. Fade it against the scan and a
// few pixels of error are obvious; side by side, they are invisible.
const SHOTS=(window.PHOTOS&&window.PHOTOS.items)||[];
// 0 off · 1 marks · 2 laid on. Off is the default and means off: a photograph
// pushed in front of you unasked is the thing you did not want, and the plain
// scroll is what most looking is for.
let shotMode=0, shotOn=null, shotEls=[], dotEls=[];
const dotsEl=document.createElement('div'); dotsEl.id='shotdots';
const photosEl=$('photos');
function cssMatrix(H, k){          // photo px -> source px -> scaled px
  const a=H[0][0]*k, b=H[0][1]*k, c=H[0][2]*k;
  const d=H[1][0]*k, e=H[1][1]*k, f=H[1][2]*k;
  const g=H[2][0],   h=H[2][1];
  return `matrix3d(${a},${d},0,${g}, ${b},${e},0,${h}, 0,0,1,0, ${c},${f},0,1)`;
}
function buildShots(){
  photosEl.innerHTML=''; shotEls=[]; dotEls=[];
  if(!dotsEl.parentNode) marksEl.parentNode.insertBefore(dotsEl, marksEl);
  dotsEl.innerHTML='';
  SHOTS.forEach((it,i)=>{
    const wrap=document.createElement('div');
    wrap.className='shot';
    // the photograph's own pixel box; the matrix does the rest
    const pw=it.pw||it.w||0, ph=it.ph||it.h||0;
    wrap.style.width=(pw||100)+'px'; wrap.style.height=(ph||100)+'px';
    wrap.dataset.i=i;
    const img=document.createElement('img');
    img.decoding='async';
    // This element exists for ONE photograph at a time -- the one you open.
    // The collage of all of them is not made of elements at all: see the
    // canvas below. A DOM element with a matrix3d is a GPU layer rasterised at
    // its layout size, ~39 MB each at 2x, whatever the image inside; sixteen
    // of those is what was killing the tab, and shrinking the JPEGs could not
    // touch it. Nothing is loaded here until it is opened.
    const base=(PAINTING.dir||'assets/scroll')+'/photos/';
    img.dataset.full =base+'web/'+it.file.replace(/ /g,'_');
    it._small=base+'small/'+it.file.replace(/ /g,'_');
    wrap.appendChild(img);
    wrap.addEventListener('click',ev=>{ ev.stopPropagation(); openShot(i); });
    photosEl.appendChild(wrap); shotEls.push(wrap);
    // the mark: a small fixed dot, not a rectangle scaled with the painting.
    // It says a closer look exists here without showing it to you.
    const dot=document.createElement('div'); dot.className='shotdot';
    dot.title=(it.ppsp||1).toFixed(1)+'\u00d7';
    dot.addEventListener('pointerdown',ev=>ev.stopPropagation());
    dot.addEventListener('click',ev=>{ ev.stopPropagation(); openShot(i); });
    dotsEl.appendChild(dot); dotEls.push(dot);
  });
  const c=$('shotCount'); if(c) c.textContent = SHOTS.length? String(SHOTS.length):'';
}
// A photograph is worth showing exactly when it can out-resolve the scan.
// ppsp is photo pixels per source pixel; the scan gives one. So once the view
// is magnified enough that a source pixel covers more than a screen pixel, the
// scan is being stretched and the photograph has detail the scan cannot supply.
// That is the moment to fade it in, and it is why this is not a toggle: it is
// what zooming in *means* where a photograph exists.
// A mark is worth offering once the scan is being stretched -- that is when a
// photograph has something the scroll cannot show you. Before that it would
// only be clutter over a picture that is already sharp.
const MARK_FROM = () => nativeZ()*0.62;
// what the toggle looks like in each of its three states
function paintShotToggle(){
  const el=document.querySelector('.persp[data-t="shots"]'); if(!el) return;
  const lb=el.querySelector('.lb');
  const key = shotMode===2 ? 'shots2' : shotMode===1 ? 'shots1' : 'shots';
  const word = shotMode===2 ? (lang==='en'?'Photographs · laid on':'照片　铺')
             : shotMode===1 ? (lang==='en'?'Photographs · marks':'照片　点')
             : (lang==='en'?'Photographs':'照片');
  if(ICONS_ON && ICO[key]){ lb.innerHTML=ico(key); lb.setAttribute('aria-label',word); }
  else lb.textContent=word;
  el.title=word;
  const c=$('shotCount');
  if(c) c.textContent = shotMode===0 ? String(SHOTS.length) : '';
}
// The collage is drawn, not composited. One canvas the size of the window,
// every in-view photograph painted onto it with its own affine transform, then
// nothing else to hold: no layer per photograph, no decode kept at full size,
// and the cost of a hundred photographs is a hundred drawImage calls, which is
// cheap. This is what lets the collage exist at all on a small leaf where every
// photograph overlaps every other, and what lets it grow later.
//
// Affine, not projective: the fitted homographies have perspective terms of
// order 1e-7, which over an 800px image moves nothing by a pixel. The opened
// photograph, which is a DOM element, keeps the full matrix3d.
const collage=$('collage'), cctx=collage.getContext('2d');
const bitmaps=new Map();                    // index -> Image (small copy)
let collageDirty=false;
function bitmapFor(i){
  let im=bitmaps.get(i);
  if(im) return im;
  im=new Image(); im.decoding='async';
  // draw directly on load, not via requestAnimationFrame: rAF is suspended in
  // a hidden tab, and a collage that only paints once you look away and back
  // is a collage that appears not to work
  im.onload=()=>{ collageDirty=true; drawCollage(); };
  im.src=SHOTS[i]._small;
  bitmaps.set(i,im);
  return im;
}
function sizeCanvas(cv){
  const dpr=Math.min(2, window.devicePixelRatio||1);
  const W=Math.round(apW*dpr), H=Math.round(apH*dpr);
  if(cv.width!==W||cv.height!==H){ cv.width=W; cv.height=H; }
  cv.style.width=apW+'px'; cv.style.height=apH+'px';
  return dpr;
}
// source px -> screen px is (x*sE+TX, y*sE+TY); the photograph's own H maps
// photo px -> source px. Compose them and hand the 2x3 to the canvas.
function drawCollage(){
  if(shotMode!==2 || shotOn!==null || mode==='fold'){ collage.style.display='none'; return; }
  collage.style.display='block';
  const dpr=sizeCanvas(collage);
  cctx.setTransform(1,0,0,1,0,0);
  cctx.clearRect(0,0,collage.width,collage.height);
  const sE=scale*Z, left=x0, right=x0+visW(), top=y0, bot=y0+visH();
  const order=[];
  SHOTS.forEach((it,i)=>{ const b=it.box;
    if(b[0]<right && b[0]+b[2]>left && b[1]<bot && b[1]+b[3]>top) order.push(i); });
  // wide views underneath, close details on top: the detailed one is the one
  // you would want to see where two disagree
  order.sort((a,b)=>(SHOTS[b].box[2]*SHOTS[b].box[3])-(SHOTS[a].box[2]*SHOTS[a].box[3]));
  cctx.globalAlpha=0.94;
  for(const i of order){
    const it=SHOTS[i], im=bitmapFor(i);
    if(!(im.complete && im.naturalWidth)) continue;
    const H=it.H, k=(it.pw||im.naturalWidth)/im.naturalWidth;   // H is for the web copy; this bitmap is smaller
    const a=H[0][0]*k, b=H[1][0]*k, c=H[0][1]*k, d=H[1][1]*k, e=H[0][2], f=H[1][2];
    cctx.setTransform(dpr*sE*a, dpr*sE*b, dpr*sE*c, dpr*sE*d, dpr*(sE*e+TX), dpr*(sE*f+TY));
    cctx.drawImage(im,0,0);
  }
  cctx.setTransform(1,0,0,1,0,0);
  collageDirty=false;
}
// which photograph is under a point of the window, in collage mode: the most
// detailed one whose frame contains it
function shotAt(px,py){
  const sE=scale*Z, sx=(px-TX)/sE, sy=(py-TY)/sE;
  let best=-1, bestArea=Infinity;
  SHOTS.forEach((it,i)=>{
    const b=it.box;
    if(sx<b[0]||sx>b[0]+b[2]||sy<b[1]||sy>b[1]+b[3]) return;
    const H=it.H, k=1;
    // invert the affine part: photo = A^-1 (src - t)
    const a=H[0][0],c=H[0][1],e=H[0][2],bb=H[1][0],d=H[1][1],f=H[1][2];
    const det=a*d-bb*c; if(!det) return;
    const ux=( d*(sx-e) - c*(sy-f))/det, uy=(-bb*(sx-e) + a*(sy-f))/det;
    const pw=it.pw||0, ph=it.ph||0;
    if(ux<0||uy<0||ux>pw||uy>ph) return;
    const area=b[2]*b[3];
    if(area<bestArea){ bestArea=area; best=i; }
  });
  return best;
}
function renderShots(){
  const live = SHOTS.length && mode!=='fold';
  photosEl.style.display = (live && shotOn!==null) ? 'block' : 'none';
  dotsEl.style.display   = (live && shotMode===1 && shotOn===null) ? 'block' : 'none';
  if(!live){ collage.style.display='none'; return; }
  const k=scale, sE=scale*Z, left=x0, right=x0+visW(), top=y0, bot=y0+visH();
  // the DOM carries at most one photograph
  shotEls.forEach((el,i)=>{
    const want = shotOn===i;
    el.style.display = want ? 'block' : 'none';
    if(want) el.style.transform=cssMatrix(SHOTS[i].H, k);
  });
  drawCollage();
  if(shotMode!==1 || shotOn!==null) return;
  const marksNow = Z >= MARK_FROM();
  dotEls.forEach((d,i)=>{
    const it=SHOTS[i], b=it.box;
    const cx=(b[0]+b[2]/2)*sE+TX, cy=(b[1]+b[3]/2)*sE+TY;
    const near = b[0]<right && b[0]+b[2]>left && b[1]<bot && b[1]+b[3]>top;
    if(!near || !marksNow){ d.style.display='none'; return; }
    d.style.display='block'; d.style.left=cx+'px'; d.style.top=cy+'px';
  });
}
// One photograph at a time, faded against the painting underneath it. The
// slider is the instrument: at 0 you see the scan, at 1 the photograph, and a
// misplacement shows up as the picture sliding sideways as you drag.
function openShot(i){
  shotOn=i;
  document.body.classList.add('shotopen');
  shotEls.forEach((el,j)=>el.classList.toggle('on', j===i));
  const it=SHOTS[i], p=$('shotbar');
  p.classList.add('on');
  p.querySelector('.nm').textContent=it.file;
  p.querySelector('.st').textContent=
    (lang==='en'? 'x '+it.box[0]+'  ·  '+it.ppsp+'\u00d7 magnification  ·  '+it.inliers+' inliers  ·  ncc '+it.ncc
                : 'x '+it.box[0]+'　放大 '+it.ppsp+' 倍　'+it.inliers+' 对　相关 '+it.ncc);
  const sl=p.querySelector('input');
  sl.value=100;
  const im=shotEls[i].querySelector('img');
  if(im.dataset.full && !im.getAttribute('src')) im.src=im.dataset.full;
  im.style.opacity=1;
  gotoBox(it.box, it.ppsp);
}
function closeShot(){
  if(shotOn===null) return;
  shotEls.forEach(el=>{ el.classList.remove('on');
    const im=el.querySelector('img');
    im.style.opacity='';
    if(im.getAttribute('src')) im.removeAttribute('src');    // give the memory back
  });
  document.body.classList.remove('shotopen');
  $('shotbar').classList.remove('on'); shotOn=null;
  render();                                  // the collage comes back
}
function gotoBox(b, deep){
  // the scan's ceiling is nativeZ; a photograph carries ppsp times more detail,
  // so when one is open the ceiling rises to what its own pixels can support
  const cap = deep ? nativeZ()*Math.min(4, Math.max(1, deep)) : nativeZ();
  const want=Math.max(1.2, apH/((b[3]||400)*scale*1.25));
  Z=Math.max(1,Math.min(cap, want));
  x0=b[0]+b[2]/2-visW()/2; y0=b[1]+b[3]/2-visH()/2;
  customUsed=true; mode='custom'; clamp(); buildTrack(); render();
}
function stepShot(d){
  if(!SHOTS.length) return;
  if(shotOn===null){ openShot(d>0?0:SHOTS.length-1); return; }   // from anywhere, start walking
  openShot((shotOn+d+SHOTS.length)%SHOTS.length);
}

// ---- 題跋: writing after the painting, and on it ---------------------------
// A colophon is one person's writing about one painting, signed and dated.
// One record, three statuses: private (this browser), shared (the circle's
// endpoint), mounted (a committed file). The id is minted here and is the same
// string in all three places, so a mounted colophon is the same colophon,
// advanced, not a copy. Status is stored only in this browser; the endpoint
// implies shared and the file implies mounted, so nothing can drift.
const RANK={private:0,shared:1,mounted:2};
const TKEY='ccp_tiba_v1', HKEY='ccp_hand_v1';
const TIBA_API=(window.TIBA_API||'').replace(/\/+$/,'');
const PUB_TIBA=(window.TIBA&&window.TIBA.items)||[];
let MINE=[], SHARED=[], COLOPHONS=[], HAND={name:'',pass:''};
try{ const o=JSON.parse(localStorage.getItem(TKEY)||'null'); if(o&&o.items) MINE=o.items; }catch(e){}
try{ const o=JSON.parse(localStorage.getItem(HKEY)||'null'); if(o) HAND={name:o.name||'',pass:o.pass||''}; }catch(e){}
function saveTiba(){ try{ localStorage.setItem(TKEY,JSON.stringify({v:1,items:MINE})); }catch(e){} }
function saveHand(){ try{ localStorage.setItem(HKEY,JSON.stringify(HAND)); }catch(e){} }
// The invitation arrives in the fragment, is kept, and is taken off the URL so
// a copied address does not carry it on by accident. Inviting is a button.
(function(){
  const m=/[#&]tiba=([A-Za-z0-9_-]{8,64})/.exec(location.hash);
  if(!m) return;
  HAND.pass=m[1]; saveHand();
  history.replaceState(null,'',location.pathname+location.search);
})();
const invited=()=>!!(TIBA_API&&HAND.pass);
function newId(){
  const a=new Uint8Array(16); crypto.getRandomValues(a);
  return btoa(String.fromCharCode.apply(null,a)).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
}
function toast(msg){
  let t=$('toast');
  if(!t){ t=document.createElement('div'); t.id='toast'; document.body.appendChild(t); }
  t.textContent=msg; t.classList.add('on');
  clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove('on'),4000);
}
function askName(){
  const n=(window.prompt(lang==='en'?'Sign as:':'署名：',HAND.name||'')||'').trim().slice(0,40);
  if(n){ HAND.name=n; saveHand(); }
  return HAND.name;
}
// Join the three stores by id. Provenance sets a floor on status and the
// browser's own record is advanced to meet it, never rewound. The higher
// status wins the whole record, so a typo the owner fixed while mounting is
// what you read. Running this on its own output changes nothing.
function joinTiba(){
  const by=new Map(); let advanced=false;
  MINE.forEach(c=>{ if(c.slug===SLUG) by.set(c.id, Object.assign({}, c, {status:c.status||'private', mine:true})); });
  const merge=(rec,floor)=>{
    const prev=by.get(rec.id);
    if(prev && RANK[floor]<=RANK[prev.status]) return;
    by.set(rec.id, Object.assign({}, rec, {status:floor, mine:!!(prev&&prev.mine)}));
    const m=MINE.find(x=>x.id===rec.id);
    if(m && RANK[floor]>RANK[m.status||'private']){
      m.at=rec.at||m.at; m.by=rec.by||m.by; m.text=rec.text; if(rec.spot) m.spot=rec.spot;
      m.status=floor; advanced=true;
    }
  };
  SHARED.forEach(c=>merge(c,'shared'));
  PUB_TIBA.forEach(c=>merge(c,'mounted'));
  if(advanced) saveTiba();
  COLOPHONS=[...by.values()].sort((a,b)=> a.at<b.at?-1 : a.at>b.at?1 : a.id<b.id?-1:1);
  layoutTail(); buildScript(); paintTibaRow();
}
function fetchTiba(){
  if(!invited()) return Promise.resolve();
  return fetch(TIBA_API+'/t/'+HAND.pass+'?p='+encodeURIComponent(SLUG),{cache:'no-store'})
    .then(r=>{
      if(r.status===403){ HAND.pass=''; saveHand(); return Promise.reject(new Error(lang==='en'?'the invite no longer opens':'邀链已失效')); }
      return r.ok ? r.json() : Promise.reject(new Error('HTTP '+r.status));
    })
    .then(o=>{ SHARED=o.items||[]; joinTiba(); render(); })
    .catch(e=>{ if(!fetchTiba.warned){ fetchTiba.warned=true; toast((lang==='en'?'could not reach the circle: ':'未能连上共室：')+e.message); } });
}
function tibaPost(body){
  return fetch(TIBA_API+'/t/'+HAND.pass,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)})
    .then(r=>r.ok?r.json():r.json().then(e=>Promise.reject(new Error(e.error||r.status))));
}
function sendTiba(m){
  if(!invited()) return Promise.resolve();
  if(!m.by && !askName()){ toast(lang==='en'?'sign it first':'请先署名'); return Promise.resolve(); }
  m.by=m.by||HAND.name;
  const item={id:m.id,slug:m.slug,at:m.at,by:m.by,text:m.text}; if(m.spot) item.spot=m.spot;
  return tibaPost({op:'write',item:item})
    .then(o=>{ if(o.item&&o.item.id) m.id=o.item.id; if(RANK[m.status]<1) m.status='shared'; saveTiba(); return fetchTiba(); })
    .then(()=>toast(lang==='en'?'sent to the circle':'已呈'))
    .catch(e=>toast((lang==='en'?'could not send: ':'未能送出：')+e.message));
}
function withdrawTiba(m){
  const done=()=>{ MINE=MINE.filter(x=>x!==m); saveTiba(); joinTiba(); render(); };
  if(m.status!=='shared'||!invited()){ done(); return; }
  tibaPost({op:'withdraw',id:m.id,by:m.by})
    .then(()=>{ done(); return fetchTiba(); })
    .catch(e=>{ if(/404/.test(e.message)){ done(); return; }
                toast((lang==='en'?'could not withdraw: ':'未能撤回：')+e.message); });
}
// Every colophon of yours on every painting, in one file. tools/tiba.py takes
// it with --from, which is how the owner mounts without an endpoint.
function exportTiba(){
  const out={v:1, of:'classicalchinesepainting.com', savedAt:new Date().toISOString(), items:MINE};
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([JSON.stringify(out,null,1)],{type:'application/json'}));
  a.download='tiba-'+out.savedAt.slice(0,10)+'.json'; a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),4000);
  toast((lang==='en'?'saved ':'已存　')+MINE.length+(lang==='en'?' colophons':' 则'));
}
function copyInvite(){
  const u=location.origin+location.pathname+location.search+'#tiba='+HAND.pass;
  navigator.clipboard.writeText(u).then(
    ()=>toast(lang==='en'?'invite copied. Anyone holding it can read and write.':'已复制　持链者可读可题'),
    ()=>toast(u));
}

// ---- the tail: mounting silk past the painting -----------------------------
// Where a colophon sits is derived from the list and never stored. Oldest
// nearest the painting, each block after the last, so mounting one moves
// nothing and two browsers agree. Text is set in columns, as it would be.
const CROSS=VERT?L:PH;
const G=CROSS/28;                            // one glyph, in source px
const FONT='"Songti SC","STSong","Noto Serif SC","Source Han Serif SC","Times New Roman",serif';
const CJK=/[　-鿿豈-﫿＀-￯]/;
let TAIL={blocks:[], extent:0};
let mctx=null;
function textW(s,fs){
  if(!mctx) mctx=document.createElement('canvas').getContext('2d');
  mctx.font=fs+'px '+FONT; return mctx.measureText(s).width;
}
// A column holds `per` glyph units. A CJK character is one unit; a Latin word
// is set sideways and is as many units as it is long.
function columnsOf(text,fs,per){
  const cols=[]; let col=[], used=0;
  const push=()=>{ cols.push(col); col=[]; used=0; };
  String(text).split(/\r?\n/).forEach((line,li)=>{
    if(li>0) push();
    const toks=line.match(/[　-鿿豈-﫿＀-￯]|[^\s　-鿿豈-﫿＀-￯]+|\s+/g)||[];
    toks.forEach(tk=>{
      if(/^\s+$/.test(tk)){ if(used>0&&used<per){ col.push({t:'',u:0.45}); used+=0.45; } return; }
      const lat=!CJK.test(tk);
      const u = lat ? Math.max(1, textW(tk,fs)/fs+0.35) : 1;
      if(used+u>per && used>0) push();
      col.push({t:tk,u:u,lat:lat}); used+=u;
    });
  });
  if(col.length||!cols.length) push();
  return cols;
}
function sigOf(c){
  const d=(c.at||'').slice(0,10).replace(/-/g,'·');
  return (c.by||'')+(c.by&&d?'　':'')+d;
}
function layoutTail(){
  const M=G*1.3, gap=G*1.3, fs=G, sfs=G*0.7, blocks=[];
  const CH = VERT ? Math.min(CROSS*0.6, CROSS-2*M) : CROSS-2*M;
  const per=Math.floor(CH/fs), sper=Math.floor(CH/sfs);
  let cur = VERT ? L-M : -G, row=0;
  COLOPHONS.filter(c=>!c.spot).forEach(c=>{
    const cols=columnsOf(c.text||'',fs,per), sig=columnsOf(sigOf(c),sfs,sper);
    const w=G*0.4+cols.length*G*1.25+G*0.15+sig.length*sfs*1.3+G*0.4;
    if(VERT && cur-w<M && cur<L-M){ row++; cur=L-M; }
    const b = VERT ? {x:cur-w, y:PH+M*0.5+row*(CH+M*1.7), w:w, h:CH+M*1.2}
                   : {x:cur-w, y:M*0.5, w:w, h:PH-M};
    b.c=c; b.cols=cols; b.sig=sig; b.ty=b.y+M*0.6; b.fs=fs; b.sfs=sfs;
    blocks.push(b);
    cur=b.x-gap;
  });
  const extent = VERT ? (blocks.length ? (row+1)*(CH+M*1.7)+M : 0) : (blocks.length ? -cur+G : 0);
  TAIL={blocks:blocks, extent:extent};
  tailLen=Math.max(TAIL_MIN, extent);
  clamp();
}
const silk=$('silk'), sctx=silk.getContext('2d');
const GROUND={mounted:'#d8cbad', shared:'#e3d9c2', private:'#efe8d8'};
const INK='#2b2117';
const spotsNow=()=> Z>=1.25 || $('script').classList.contains('on');
function drawCol(col,size,cx,y){
  sctx.font=size+'px '+FONT;
  for(const it of col){
    if(!it.t){ y+=size*it.u; continue; }
    if(it.lat){
      sctx.save(); sctx.translate(cx,y); sctx.rotate(Math.PI/2);
      sctx.textAlign='left'; sctx.textBaseline='middle'; sctx.fillText(it.t,0,0);
      sctx.restore(); y+=size*it.u;
    } else { sctx.textAlign='center'; sctx.textBaseline='top'; sctx.fillText(it.t,cx,y); y+=size; }
  }
  return y;
}
function drawBlock(b){
  sctx.fillStyle=GROUND[b.c.status]||GROUND.private;
  sctx.fillRect(b.x,b.y,b.w,b.h);
  if(b.c.status==='private'){                 // an unpasted sheet laid beside the scroll
    sctx.save(); sctx.setLineDash([G*0.25,G*0.2]); sctx.lineWidth=G*0.05; sctx.strokeStyle='rgba(60,40,20,.45)';
    sctx.strokeRect(b.x,b.y,b.w,b.h); sctx.restore();
  }
  sctx.fillStyle=INK;
  let x=b.x+b.w-G*0.4-G*0.625;
  for(const col of b.cols){ drawCol(col,b.fs,x,b.ty); x-=G*1.25; }
  x-=G*0.15;
  sctx.fillStyle='#5a4632';
  let yEnd=b.ty;
  for(const col of b.sig){ yEnd=Math.max(yEnd, drawCol(col,b.sfs,x,b.ty)); x-=b.sfs*1.3; }
  // the seal: vermilion, the first character of the name
  if(b.c.by){
    const s=G*0.85, sx=x+b.sfs*1.3-s/2, sy=Math.min(yEnd+G*0.3, b.y+b.h-s-G*0.3);
    sctx.fillStyle='#b2412b'; sctx.fillRect(sx,sy,s,s);
    sctx.fillStyle='#f3e6c2'; sctx.font=(s*0.62)+'px '+FONT; sctx.textAlign='center'; sctx.textBaseline='middle';
    sctx.fillText(Array.from(b.c.by)[0],sx+s/2,sy+s/2+s*0.03);
  }
}
function drawTiba(sE){
  if(mode==='fold'){ silk.style.display='none'; return; }
  silk.style.display='block';
  const dpr=sizeCanvas(silk);
  sctx.setTransform(1,0,0,1,0,0); sctx.clearRect(0,0,silk.width,silk.height);
  const left=x0, right=x0+visW(), top=y0, bot=y0+visH();
  if(VERT ? bot>PH : left<0){
    sctx.setTransform(dpr*sE,0,0,dpr*sE,dpr*TX,dpr*TY);
    sctx.fillStyle='#cbbd9d';
    if(VERT) sctx.fillRect(0,PH,L,tailLen); else sctx.fillRect(-tailLen,0,tailLen,PH);
    sctx.fillStyle='rgba(60,40,20,.35)';                         // the seam
    if(VERT) sctx.fillRect(0,PH,L,G*0.08); else sctx.fillRect(-G*0.08,0,G*0.08,PH);
    for(const b of TAIL.blocks){
      if(b.x>right||b.x+b.w<left||b.y>bot||b.y+b.h<top) continue;
      drawBlock(b);
    }
    if(!TAIL.blocks.length){
      sctx.fillStyle='rgba(60,40,20,.5)';
      const hint=columnsOf(lang==='en'?'blank silk after the painting. Tap to write.':'卷末素绢　可题',G*0.8,40);
      drawCol(hint[0],G*0.8, VERT?L-G*2:-G*2.2, VERT?PH+G*1.6:G*1.6);
    }
  }
  if(spotsNow()){
    sctx.setTransform(dpr,0,0,dpr,0,0);
    for(const c of COLOPHONS){
      if(!c.spot) continue;
      const cx=c.spot.x*sE+TX, cy=c.spot.y*sE+TY;
      if(cx<-10||cx>apW+10||cy<-10||cy>apH+10) continue;
      sctx.beginPath(); sctx.arc(cx,cy,6.5,0,Math.PI*2);
      sctx.fillStyle=GROUND[c.status]||GROUND.private; sctx.fill();
      sctx.lineWidth=1.6; sctx.strokeStyle=INK; sctx.stroke();
    }
  }
  sctx.setTransform(1,0,0,1,0,0);
}
function tailAt(sx,sy){
  for(const b of TAIL.blocks) if(sx>=b.x&&sx<=b.x+b.w&&sy>=b.y&&sy<=b.y+b.h) return b.c;
  return null;
}
function inTail(sx,sy){
  return VERT ? (sy>PH&&sy<PH+tailLen&&sx>=0&&sx<=L) : (sx<0&&sx>-tailLen&&sy>=0&&sy<=PH);
}
function spotAt(sx,sy){
  if(!spotsNow()) return null;
  const sE=scale*Z; let best=null, bd=1e9;
  for(const c of COLOPHONS){
    if(!c.spot) continue;
    const d=Math.hypot(c.spot.x-sx,c.spot.y-sy)*sE;
    if(d<bd){ bd=d; best=c; }
  }
  return bd<14 ? best : null;
}
function gotoTail(){
  if(mode==='fold') setMode('pane');
  Z=1;
  if(VERT){ y0=railMaxY()-visH(); } else { x0=railMin(); y0=0; }
  target=null; vel=0; clamp(); buildTrack(); render();
}
function gotoSpot(c){
  Z=Math.max(MINZ,Math.min(nativeZ(),1.8));
  x0=c.spot.x-visW()/2; y0=c.spot.y-visH()/2;
  customUsed=true; mode='custom'; target=null; vel=0; clamp(); buildTrack(); render();
}

// ---- writing ---------------------------------------------------------------
// Writing after the painting is a tap on blank silk. Writing at a spot is a
// tap on the painting after choosing 点题. Neither frames a box, so both work
// at any zoom and on a phone.
let editing=null, placing=false;
function setPlacing(on){
  placing=on; document.body.classList.toggle('placing',on);
  if(on) toast(lang==='en'?'tap the painting where it goes':'点画上一处');
}
function newTiba(spot){
  const c={id:newId(), slug:SLUG, at:new Date().toISOString(), by:HAND.name, text:'', status:'private', mine:true};
  if(spot) c.spot=spot;
  openTiba(c);
}
function whereText(c){
  if(c.status==='mounted') return lang==='en' ? 'mounted after the painting. This cannot be unwritten.' : '已裱于卷後　不可复改';
  if(c.status==='shared')  return lang==='en' ? 'sent. Anyone with the invite can read it. Waiting to be mounted.' : '已呈　持链者皆可见　待裱';
  return lang==='en' ? 'kept in this browser only. Nobody else can see it.' : '仅存于此浏览器　他人不见';
}
function openTiba(c){
  editing=c;
  const box=$('editor');
  const w=box.querySelector('.where'); w.textContent=whereText(c); w.className='where '+c.status;
  box.querySelector('.who').textContent=sigOf(c).replace('　',' · ');
  const ta=box.querySelector('.eb'); ta.value=c.text||'';
  const ro = c.status==='mounted' || !c.mine;
  ta.readOnly=ro;
  box.querySelector('.ok').style.display = ro ? 'none' : '';
  box.querySelector('.send').style.display = (!ro && invited() && c.status==='private') ? '' : 'none';
  const del=box.querySelector('.del');
  del.style.display = ro ? 'none' : '';
  del.textContent = c.status==='shared' ? t('withdraw') : t('del');
  box.classList.add('on'); if(!ro) ta.focus();
}
function closeEditor(){ $('editor').classList.remove('on'); editing=null; }
// Save what is in the editor into your own store. Returns the stored record,
// or null when there was nothing to keep.
function commitEdit(){
  const c=editing; if(!c) return null;
  const text=$('editor').querySelector('.eb').value.trim().slice(0,480);
  if(!text) return null;
  if(!c.by) c.by=askName();
  let m=MINE.find(x=>x.id===c.id);
  if(!m){ m={id:c.id,slug:c.slug,at:c.at,by:c.by,text:text,status:'private'}; if(c.spot) m.spot=c.spot; MINE.push(m); }
  else { m.text=text; m.by=c.by||m.by; }
  saveTiba(); joinTiba(); render();
  return m;
}

// ---- reading the colophons in order ----------------------------------------
// The panel is the text of the scroll: what sits on the painting first, in the
// order the scroll unrolls, then what sits after it, in the order written.
function paintTibaRow(){
  const el=document.querySelector('.persp[data-t="tiba"]'); if(!el) return;
  el.classList.toggle('on', $('script').classList.contains('on'));
  const c=$('scriptCount');
  if(c) c.textContent = COLOPHONS.length ? String(COLOPHONS.length) : '';
}
function buildScript(){
  const host=$('script'); if(!host) return;
  host.innerHTML='';
  const act=document.createElement('div'); act.className='act';
  const mk=(label,fn)=>{ const b=document.createElement('button'); b.textContent=label; b.onclick=fn; act.appendChild(b); };
  mk(t('writeTail'), ()=>{ gotoTail(); newTiba(null); });
  mk(t('markSpot'), ()=>setPlacing(!placing));
  if(invited()) mk(t('invite'), copyInvite);
  mk(t('sign'), ()=>{ askName(); buildScript(); });
  mk(t('saveFile'), exportTiba);
  host.appendChild(act);
  const hand=document.createElement('div'); hand.className='hand';
  hand.textContent = (HAND.name ? (lang==='en'?'signing as ':'署名　')+HAND.name : (lang==='en'?'unsigned':'未署名'))
    + '　·　' + (invited() ? (lang==='en'?'in the circle':'已入共室')
                          : (lang==='en'?'no invite, so your writing stays here':'无邀链　所题仅存于此'));
  host.appendChild(hand);
  const spots=COLOPHONS.filter(c=>c.spot).sort((a,b)=> VERT ? a.spot.y-b.spot.y : b.spot.x-a.spot.x);
  const tails=COLOPHONS.filter(c=>!c.spot);
  if(!COLOPHONS.length){
    const d=document.createElement('div'); d.className='empty';
    d.textContent=lang==='en'?'nothing written yet':'尚无题跋'; host.appendChild(d);
  }
  const TIER={mounted:{zh:'裱',en:'mounted'}, shared:{zh:'呈',en:'shared'}, private:{zh:'私',en:'mine'}};
  const row=c=>{
    const d=document.createElement('div'); d.className='row '+c.status;
    const a=document.createElement('span'); a.className='at';
    a.textContent = c.spot ? (VERT ? Math.round(100*c.spot.y/PH) : Math.round(100*(CR-c.spot.x)/CR))+'%' : (lang==='en'?'after':'跋');
    const tier=document.createElement('span'); tier.className='tier '+c.status; tier.textContent=TIER[c.status][lang==='en'?'en':'zh'];
    const tt=document.createElement('span'); tt.className='tt'; tt.textContent=c.by||(lang==='en'?'(unsigned)':'（未署名）');
    const dt=document.createElement('span'); dt.className='by'; dt.textContent=(c.at||'').slice(0,10);
    const bd=document.createElement('div'); bd.className='bd'; bd.textContent=c.text||'';
    [a,tier,tt,dt,bd].forEach(x=>d.appendChild(x));
    d.addEventListener('click',()=>{ if(c.spot) gotoSpot(c); else gotoTail(); openTiba(c); });
    host.appendChild(d);
  };
  spots.forEach(row); tails.forEach(row);
  paintTibaRow();
}

// --- language --------------------------------------------------------------
function applyLang(){
  ICONS_ON = ui==='ico';
  document.body.classList.toggle('icons', ICONS_ON);
  document.documentElement.lang = lang==='en'?'en':'zh-Hans';
  $('hZoom').textContent=t('zoom'); $('hPersp').textContent=t('persp');
  // the button shows the stop you'd land on next, which is how it read before
  const nxt=UI_NEXT[ui], L=$('lang');
  L.classList.toggle('asIcon', nxt==='ico');
  if(nxt==='ico') L.innerHTML=ico('ui');
  else L.textContent = nxt==='en' ? 'EN' : '中';
  L.title=t(nxt==='zh'?'uiZh':nxt==='en'?'uiEn':'uiIco');
  L.setAttribute('aria-label',L.title);
  // the chevron IS the label; the translated string becomes its tooltip
  $('back').title=t('back'); $('back').setAttribute('aria-label',t('back'));
  // pictograms are wordless, so the one caption left keeps the scroll's own name
  const cap=$('title');
  cap.textContent = ICONS_ON ? I18N.zh.title : t('title');
  // The collection line is always built and hidden by CSS unless the caption is
  // at the foot. Building it only when topbar is on would miss a rotation:
  // measure() sets that class on resize, and applyLang does not run again.
  if(window.PAINTING && PAINTING.museum){
    const m=document.createElement('span'); m.className='mus';
    m.textContent = (lang==='en' ? PAINTING.museum.en : PAINTING.museum.zh)
                    + (PAINTING.acc ? '　'+PAINTING.acc : '');
    cap.appendChild(m);
  }
  // Whose photograph this is stays recorded -- in the register, in the README,
  // and on the title itself -- but it is no longer set beside the painting.
  // PD-Art carries no attribution requirement, and a licence string over a
  // Song landscape was the most legalistic thing on the screen.
  if(window.PAINTING && PAINTING.source){
    $('title').title = PAINTING.source + (PAINTING.licence? ' · '+PAINTING.licence : '');
    const c=$('credit'); if(c) c.remove();
  }
  iconise(document.querySelector('.persp[data-t="loc"] .lb'),'loc',t('loc'));
  iconise(document.querySelector('.persp[data-t="marks"] .lb'),'marks',t('marks'));
  const rp=document.querySelector('.persp[data-t="roads"]');
  iconise(rp.querySelector('.lb'),'roads',t('roads'));
  rp.classList.toggle('off', ROADS.length===0);
  rp.title = ROADS.length? '' : 'no roads traced yet — use trace.html';
  const sp=document.querySelector('.persp[data-t="shots"]');
  paintShotToggle();
  sp.classList.toggle('off', SHOTS.length===0);
  sp.title = SHOTS.length? '' : 'no photographs placed on this scroll yet';
  const tp=document.querySelector('.persp[data-t="tiba"]');
  iconise(tp.querySelector('.lb'),'tiba',t('tiba'));
  const ed=$('editor');
  ed.querySelector('.ok').textContent=t('save');
  ed.querySelector('.send').textContent=t('send');
  ed.querySelector('.del').textContent=t('del');
  ed.querySelector('.no').textContent=t('cancel');
  ed.querySelector('.eb').placeholder=t('placeholder');
  buildScript();
  document.title = window.PAINTING ? (lang==='en'?PAINTING.en:PAINTING.zh)
                  : (lang==='en'?'A Thousand Li of Rivers and Mountains':'千里江山图');
  buildTrack(); if(mode==='fold') layoutFold();
}
$('lang').addEventListener('click',()=>{
  ui=UI_NEXT[ui];
  if(ui!=='ico'){ lang=ui; localStorage.setItem('ccp_lang',lang); }
  localStorage.setItem('ccp_ui',ui);
  applyLang();
});
// A tap on the window, in this order: a photograph in collage mode, the spot
// being placed, a colophon (a dot on the painting or a block on the silk), or
// blank silk, which starts a new one. A drag is not a tap. The marquee path
// ignores taps (it wants a drag), so this does not fight it.
win.addEventListener('click',e=>{
  if(shotOn!==null) return;
  if(tapAt && Math.hypot(e.clientX-tapAt.x,e.clientY-tapAt.y)>6) return;
  const r=win.getBoundingClientRect(), px=e.clientX-r.left, py=e.clientY-r.top;
  if(shotMode===2){ const i=shotAt(px,py); if(i>=0){ e.stopPropagation(); openShot(i); return; } }
  const sE=scale*Z, sx=(px-TX)/sE, sy=(py-TY)/sE;
  if(placing){
    setPlacing(false);
    if(sx>=0&&sx<=L&&sy>=0&&sy<=PH) newTiba({x:Math.round(sx),y:Math.round(sy)});
    return;
  }
  const c=spotAt(sx,sy)||tailAt(sx,sy);
  if(c){ openTiba(c); return; }
  if(inTail(sx,sy)) newTiba(null);
});
(function(){
  const b=$('shotbar');
  b.addEventListener('pointerdown',e=>e.stopPropagation());
  b.querySelector('input').addEventListener('input',e=>{
    if(shotOn!==null) shotEls[shotOn].querySelector('img').style.opacity=(+e.target.value/100);
  });
  b.querySelector('.pv').onclick=()=>stepShot(-1);
  b.querySelector('.nx').onclick=()=>stepShot(1);
  b.querySelector('.cl').onclick=closeShot;
  buildShots();
})();
(function(){
  const ed=$('editor');
  ed.querySelector('.ok').onclick=()=>{
    const m=commitEdit(); closeEditor();
    if(m && m.status==='shared') sendTiba(m);      // an edit to a sent colophon is re-sent
  };
  ed.querySelector('.send').onclick=()=>{ const m=commitEdit(); closeEditor(); if(m) sendTiba(m); };
  ed.querySelector('.del').onclick=()=>{
    if(!editing) return;
    const m=MINE.find(x=>x.id===editing.id); closeEditor();
    if(m) withdrawTiba(m);
  };
  ed.querySelector('.no').onclick=closeEditor;
  $('script').addEventListener('pointerdown',e=>e.stopPropagation());
  ed.addEventListener('pointerdown',e=>e.stopPropagation());
})();
addEventListener('keydown',e=>{
  if(e.key==='p'||e.key==='P'){ const el=document.querySelector('.persp[data-t="shots"]'); if(el) el.click(); }
  if(e.key==='['){ stepShot(-1); } else if(e.key===']'){ stepShot(1); }
  if(shotOn!==null && (e.key==='ArrowRight'||e.key==='ArrowLeft')){
    e.preventDefault(); stepShot(e.key==='ArrowRight'?1:-1);
  }
  if(e.key==='Escape'){ if(shotOn!==null) closeShot();
                        else if($('editor').classList.contains('on')) closeEditor();
                        else if(placing) setPlacing(false); }
  if(e.key==='1') setMode('fold'); else if(e.key==='2') setMode('wide');
  else if(e.key==='3') setMode('pane'); else if(e.key==='4'&&customUsed) setMode('custom');
});
addEventListener('resize',measure);

if(VERT){ mode='pane'; }
if(window.NOT_READY){
  const b=document.createElement('div'); b.id='notready';
  const it=window.NOT_READY;
  b.innerHTML = it.zh ? ('<b>'+it.zh+'</b> '+(it.en||'')+' — 尚无扫描本，暂以千里江山图代之'
                        +'<br><span>no scan of this one yet; showing the Wang Ximeng scroll instead</span>')
                      : ('unknown painting “'+it.slug+'” — showing the default');
  document.body.appendChild(b);
  setTimeout(()=>b.classList.add('go'), 9000);
}
measure(); applyLang();
joinTiba();
// The circle is other people writing while you read. Polling is the honest
// simple answer at this size: a few friends, a few colophons an hour. Only
// while the tab is in front, so a forgotten tab is not a standing request.
fetchTiba();
setInterval(()=>{ if(!document.hidden) fetchTiba(); }, 30000);
x0 = VERT ? 0 : Math.max(0,CR-visW());
const bleed=$('bleed'), lastImg=imgs[imgs.length-1];
const reveal=()=>{ bleed.style.opacity='0'; };
if(lastImg){ lastImg.complete?setTimeout(reveal,100):lastImg.addEventListener('load',()=>setTimeout(reveal,100)); }
setTimeout(reveal,4000);
setMode('pane');
requestAnimationFrame(loop);
})();
</script>
<script>
// ?bg=paper|silk|blush|dawn puts the scroll on a light ground instead of in a
// dark room. Same switcher pattern as ?rolls= and ?font=.
(function(){
  var m=/[?&]bg=(paper|silk|blush|dawn)/.exec(location.search); if(!m) return;
  document.body.classList.add('bg-'+m[1],'bgtag');
  var d=document.createElement('div'); d.id='bgTag';
  d.textContent='ground \u00b7 '+m[1];
  document.body.appendChild(d);
})();
// ?font=b|c|d|e swaps the type stack so the options can be judged in place.
(function(){
  var m=/[?&]font=([a-e])/.exec(location.search); if(!m||m[1]==='b') return;
  document.body.classList.add('font-'+m[1],'fonttag');
  var N={a:'EB Garamond (was default)',c:'Helvetica Neue',d:'Avenir Next',e:'Futura'};
  var d=document.createElement('div'); d.id='fontTag';
  d.textContent='type \u00b7 '+m[1].toUpperCase()+' '+N[m[1]];
  document.body.appendChild(d);
})();
</script>
