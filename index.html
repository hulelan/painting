<!DOCTYPE html>
<html lang="zh-Hans">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
<title>A Thousand Li of Rivers and Mountains</title>
<meta name="description" content="Wang Ximeng's handscroll — unroll it, fold it, or select a detail.">
<link rel="stylesheet" href="css/type.css?v=3">
<style>
:root{
  --room:#0c0a08; --warm:#d9b45a; --line:rgba(217,180,90,.20);
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--room);overflow:hidden;
  font-family:var(--type);-webkit-font-smoothing:antialiased;
  -webkit-user-select:none;user-select:none;touch-action:none}

#room{position:fixed;inset:0;
  background:radial-gradient(88% 68% at 28% 6%, rgba(224,186,120,.11), transparent 62%), var(--room)}
#room::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:1;
  background:radial-gradient(132% 100% at 50% 50%, transparent 46%, rgba(0,0,0,.7) 100%)}

/* ---------------- the scroll ---------------- */
#desk{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:2}
#window{position:absolute;overflow:hidden;background:#0e0c0a;cursor:crosshair;
  box-shadow:0 30px 80px rgba(0,0,0,.75), 0 0 0 1px rgba(217,180,90,.10)}
#window.panning{cursor:grabbing}
#window.zoomed{cursor:grab}
#rail{position:absolute;top:0;left:0;height:100%;transform-origin:0 0;will-change:transform}
#rail img{position:absolute;top:0;height:100%;display:block;border:0;
  -webkit-user-drag:none;pointer-events:none}
#window::before,#window::after{content:"";position:absolute;top:0;bottom:0;width:5%;
  pointer-events:none;z-index:4}
#window::before{left:0;background:linear-gradient(90deg,rgba(0,0,0,.55),transparent)}
#window::after{right:0;background:linear-gradient(270deg,rgba(0,0,0,.55),transparent)}
#sheen{position:absolute;inset:0;pointer-events:none;z-index:3;mix-blend-mode:soft-light;opacity:.45;
  background:
    repeating-linear-gradient(0deg, rgba(255,255,255,.05) 0 1px, transparent 1px 3px),
    linear-gradient(100deg, transparent 34%, rgba(255,244,214,.62) 50%, transparent 66%);
  background-size:auto, 260% 100%;
  background-position:0 0, var(--sheenX,0%) 0}

/* rolls: geometric, and the thing you drag to unroll */
.roll{position:absolute;top:0;height:100%;z-index:6;cursor:grab;transition:opacity .25s}
.roll.pulling{cursor:grabbing}
.roll .body{position:absolute;inset:0;
  background:#1a160f}                       /* D "blade": flat, no modelling */
#rollL .body{border-right:2px solid rgba(217,180,90,.5)}
#rollR .body{border-left:2px solid rgba(217,180,90,.5)}

/* ---- roll treatments, switched with ?rolls=b|c|d|e ----
   The default is a smooth three-stop gradient, i.e. a lit cylinder. These are
   angular alternatives: the roll stated as flat planes rather than modelled. */
body.rolls-b .roll .body{box-shadow:none;background:linear-gradient(90deg,
  #14110a 0 12%,#241f16 12% 26%,#3a3327 26% 42%,#4a4132 42% 58%,
  #3a3327 58% 74%,#241f16 74% 88%,#14110a 88% 100%)}
body.rolls-c .roll .body{box-shadow:none}
body.rolls-c #rollL .body{background:linear-gradient(90deg,
  #0d0b07 0 18%,#1b1710 18% 36%,#282218 36% 54%,#352d20 54% 72%,#43392a 72% 88%,#524634 88% 100%)}
body.rolls-c #rollR .body{background:linear-gradient(270deg,
  #0d0b07 0 18%,#1b1710 18% 36%,#282218 36% 54%,#352d20 54% 72%,#43392a 72% 88%,#524634 88% 100%)}
/* D is now the default; ?rolls=a restores the original lit cylinder. */
body.rolls-a .roll .body{box-shadow:0 18px 44px rgba(0,0,0,.55);
  background:linear-gradient(90deg, rgba(14,11,8,.96), rgba(52,45,34,.92) 46%, rgba(14,11,8,.96))}
body.rolls-a #rollL .body{border-right:1px solid rgba(217,180,90,.34)}
body.rolls-a #rollR .body{border-left:1px solid rgba(217,180,90,.34)}
body.rolls-e .roll .body{box-shadow:none;background:
  repeating-linear-gradient(90deg,#2a241a 0 11px,#100e09 11px 12px)}
#rollTag{position:fixed;left:12px;top:10px;z-index:40;font:11px/1 ui-monospace,Menlo,monospace;
  letter-spacing:2px;color:#7a6f5a;display:none}
body.rolltag #rollTag{display:block}

/* ---- grounds, switched with ?bg=paper|silk|blush|dawn ---------------------
   The default is a dark room: the painting glows, like a lit object in a vitrine.
   These invert that — the scroll lies on paper, as an album leaf does, and the
   chrome recedes to low-contrast ink. Everything below is expressed through
   variables so a theme is a palette, not a fork of the stylesheet. */
body[class*="bg-"]{ --line:var(--th-line); --warm:var(--th-accent); }
body[class*="bg-"] #room{background:linear-gradient(180deg,var(--th-bg),var(--th-bg2))}
body[class*="bg-"] #room::after{background:radial-gradient(130% 100% at 50% 46%,
  transparent 55%, rgba(120,104,78,.13) 100%)}
body[class*="bg-"] #window{background:var(--th-bg2);
  box-shadow:0 18px 46px var(--th-shadow), 0 0 0 1px var(--th-line)}
body[class*="bg-"] .roll .body{background:var(--th-roll)}
body[class*="bg-"] #rollL .body{border-right:2px solid var(--th-accent)}
body[class*="bg-"] #rollR .body{border-left:2px solid var(--th-accent)}
body[class*="bg-"] #sheen{opacity:.22}
body[class*="bg-"] .sect h2,
body[class*="bg-"] .stop .lb,
body[class*="bg-"] .persp,
body[class*="bg-"] #title,
body[class*="bg-"] #lang,
body[class*="bg-"] #back{color:var(--th-muted)}
body[class*="bg-"] .stop:hover .lb,
body[class*="bg-"] .stop.on .lb,
body[class*="bg-"] .persp:hover,
body[class*="bg-"] #lang:hover,
body[class*="bg-"] #back:hover{color:var(--th-ink)}
body[class*="bg-"] .stop .dot{background:var(--th-bg2);border-color:var(--th-accent)}
body[class*="bg-"] .stop.on .dot{background:var(--th-accent);box-shadow:none}
body[class*="bg-"] #card{background:var(--th-bg2);border-color:var(--th-line);
  box-shadow:0 8px 26px var(--th-shadow)}
body[class*="bg-"] #card .k{color:var(--th-ink)}
body[class*="bg-"] #card .n{color:var(--th-muted)}
body[class*="bg-"] #card .c{color:var(--th-muted)}
body[class*="bg-"] #loc{background:var(--th-bg2);border-color:var(--th-line)}
body[class*="bg-"] #locBox{border-color:var(--th-accent);
  box-shadow:0 0 0 9999px rgba(120,104,78,.22)}
body[class*="bg-"] #bleed{background:var(--th-bg)}
body[class*="bg-"] #dlabel{color:var(--th-ink);text-shadow:0 0 12px var(--th-bg)}
body[class*="bg-"] .mk{border-color:var(--th-accent);box-shadow:none}
body[class*="bg-"] #roads .case{stroke:rgba(255,255,255,.65)}
body[class*="bg-"] #roads .line{stroke:#3b3428}
body[class*="bg-"] #fold .row{border-color:var(--th-line);
  box-shadow:0 5px 16px var(--th-shadow)}
body[class*="bg-"] #marquee,body[class*="bg-"] #kept{border-color:var(--th-ink)}
body[class*="bg-"] body.topbar #panel{background:var(--th-bg)}

body.bg-paper{ --th-bg:#efe9dc; --th-bg2:#f6f1e7; --th-ink:#4a463c; --th-muted:#8a8375;
  --th-accent:#b6412e; --th-line:rgba(90,80,60,.20); --th-roll:#d6cbb4;
  --th-shadow:rgba(90,78,56,.22) }
body.bg-silk{ --th-bg:#ded2bb; --th-bg2:#e7ddc7; --th-ink:#4a4234; --th-muted:#8b8069;
  --th-accent:#a8402f; --th-line:rgba(80,68,46,.22); --th-roll:#c9bb9c;
  --th-shadow:rgba(80,66,42,.24) }
body.bg-blush{ --th-bg:#f6eff0; --th-bg2:#fbf6f6; --th-ink:#6a5b60; --th-muted:#9b8d92;
  --th-accent:#c98a9e; --th-line:rgba(120,95,105,.18); --th-roll:#e2d6da;
  --th-shadow:rgba(120,95,105,.18) }
body.bg-dawn{ --th-bg:#fdf6ef; --th-bg2:#f7f0f3; --th-ink:#6b6069; --th-muted:#968a94;
  --th-accent:#e0a08c; --th-line:rgba(120,105,105,.16); --th-roll:#ece0da;
  --th-shadow:rgba(120,105,100,.16) }
#bgTag{position:fixed;left:12px;top:42px;z-index:40;
  font:11px/1 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:2px;
  color:var(--th-muted,#7a6f5a);display:none}
body.bgtag #bgTag{display:block}

/* ---- pictograms, switched with ?icons=1 --------------------------------
   Each zoom icon is the SHAPE OF THE WINDOW that mode gives you: four stacked
   bars for the four-row fold, one wide bar for full breadth, a near-square for
   the pane, a marquee around a crop for a detail. The perspectives are the
   thing itself — a frame with a block sliding in it, rings, a winding line.
   With icons the headings are redundant, so they go. */
body.icons .sect h2{display:none}
body.icons .sect{margin-bottom:22px}
body.icons #track{margin-top:2px}
body.icons .stop .lb{margin-top:6px;line-height:0}
body.icons .persp .lb{line-height:0;display:inline-flex;align-items:center}
body.icons .ico{display:block;width:26px;height:26px}
body.icons .stop .ico{margin:0 auto}
body.icons .persp .ico{width:30px;height:22px}
.ico{fill:none;stroke:currentColor;stroke-width:1.6;
  stroke-linecap:square;stroke-linejoin:miter;vector-effect:non-scaling-stroke}
.ico .f{fill:currentColor;stroke:none}
body.topbar.icons .stop .lb{margin-top:3px}
body.topbar.icons .ico{width:22px;height:22px}
#marks{position:absolute;inset:0;z-index:7;pointer-events:none;display:none}
.mk{position:absolute;width:26px;height:26px;margin:-13px 0 0 -13px;border-radius:50%;
  border:1px solid rgba(233,209,150,.5);pointer-events:auto;cursor:pointer;
  box-shadow:0 0 12px rgba(217,180,90,.25), inset 0 0 10px rgba(217,180,90,.13);
  transition:transform .3s ease, border-color .3s ease}
.mk:hover{transform:scale(1.35);border-color:rgba(247,231,190,.95)}

#card{position:absolute;z-index:12;max-width:210px;padding:9px 12px;
  background:rgba(18,15,11,.94);border:1px solid rgba(217,180,90,.45);
  box-shadow:0 8px 30px rgba(0,0,0,.7);opacity:0;pointer-events:none;
  transition:opacity .45s ease, transform .45s ease;transform:translateY(5px)}
#card.on{opacity:1;transform:translateY(0)}
#card .k{font-size:13px;letter-spacing:3px;color:#f0e6cd;margin-bottom:3px}
#card .n{font-size:12px;line-height:1.45;color:#9d917a}
#card .c{font-size:10px;letter-spacing:2px;color:#6b6151;margin-top:5px;text-transform:uppercase}

/* roads: white over a dark casing so the line survives both silk and shadow.
   non-scaling-stroke keeps it a constant screen width at every zoom. */
#roads{position:absolute;left:0;top:0;z-index:5;pointer-events:none;overflow:visible;
  transform-origin:0 0;display:none}
#roads path{fill:none;vector-effect:non-scaling-stroke;stroke-linecap:round;stroke-linejoin:round}
#roads .case{stroke:rgba(0,0,0,.5);stroke-width:3.4}
#roads .line{stroke:#fff;stroke-width:1.4}
/* stretches the tracer had to leap across — road inferred, not seen */
#roads .gap{stroke-dasharray:0.5 5}
#roads .gap.line{opacity:.8}
.persp.off{opacity:.35;cursor:default}

/* the dashed selection, and the outline kept afterwards for context */
#marquee,#kept{position:absolute;z-index:9;display:none;pointer-events:none;
  border:1px dashed rgba(245,230,192,.95)}
#marquee{background:rgba(217,180,90,.07)}
#kept{transition:opacity 1.1s ease;box-shadow:0 0 0 1px rgba(0,0,0,.5), 0 0 18px rgba(217,180,90,.26)}
#bleed{position:absolute;inset:0;z-index:10;pointer-events:none;background:#0d0b09;
  transition:opacity 1.4s ease}
#dlabel{position:absolute;left:50%;bottom:9%;transform:translateX(-50%);z-index:11;
  font-size:15px;letter-spacing:5px;color:#f4e8c8;opacity:0;pointer-events:none;
  transition:opacity .8s ease;text-shadow:0 0 14px rgba(0,0,0,.95)}

/* ---------------- fold ---------------- */
#fold{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:2;
  display:none;flex-direction:column;align-items:center}
#fold .row{background-image:url('assets/fold/strip.jpg');background-repeat:no-repeat;
  border:1px solid rgba(176,141,87,.26);box-shadow:0 6px 20px rgba(0,0,0,.5);
  cursor:pointer;position:relative}
#fold .row .seg{position:absolute;top:5px;right:8px;font-size:10px;letter-spacing:2px;
  color:rgba(231,221,201,.7);text-shadow:0 1px 4px rgba(0,0,0,.9);pointer-events:none}

/* ---------------- locator ---------------- */
#loc{position:fixed;left:50%;transform:translateX(-50%);bottom:34px;z-index:14;
  display:none;line-height:0;border:1px solid rgba(217,180,90,.24);cursor:pointer;
  background:#0e0c0a;touch-action:none;overflow:hidden}   /* clips locBox's scrim */
#loc img{display:block;width:100%;height:auto;pointer-events:none}
#locBox{position:absolute;top:0;bottom:0;border:2px solid var(--warm);
  box-shadow:0 0 0 9999px rgba(10,8,6,.5), 0 0 12px rgba(217,180,90,.45);pointer-events:none}

/* ---------------- right-hand panel ---------------- */
#panel{position:fixed;right:22px;top:50%;transform:translateY(-50%);z-index:16;
  width:158px;opacity:.74;transition:opacity .35s ease}
#panel:hover{opacity:1}
.sect{margin-bottom:28px}
.sect h2{margin:0 0 10px;font-size:11px;font-weight:500;letter-spacing:4px;
  text-transform:uppercase;color:#6e6552}

#track{position:relative;height:38px;margin:0 22px 0 8px}
#track .line{position:absolute;left:0;right:0;top:9px;height:1px;background:rgba(217,180,90,.26)}
.stop{position:absolute;top:0;transform:translateX(-50%);cursor:pointer;text-align:center}
.stop .dot{width:9px;height:9px;margin:5px auto 0;border-radius:50%;
  border:1px solid rgba(217,180,90,.55);background:#0c0a08;
  transition:background .3s, box-shadow .3s, transform .3s}
.stop .lb{margin-top:7px;font-size:11px;letter-spacing:1px;color:#6e6552;white-space:nowrap;
  transition:color .3s}
.stop:hover .dot{background:rgba(217,180,90,.45)}
.stop:hover .lb{color:#cbbd9c}
.stop.on .dot{background:var(--warm);box-shadow:0 0 10px rgba(217,180,90,.75);transform:scale(1.18)}
.stop.on .lb{color:#f0e6cd}

.persp{display:flex;align-items:center;gap:9px;padding:5px 0;cursor:pointer;
  font-size:12px;letter-spacing:2px;color:#7d735f;transition:color .3s}
.persp:hover{color:#e6dabb}
.persp .box{width:12px;height:12px;border:1px solid rgba(217,180,90,.5);
  display:flex;align-items:center;justify-content:center;flex:0 0 auto;
  transition:border-color .25s}
.persp .box::after{content:"";width:6px;height:6px;background:var(--warm);
  transform:scale(0);transition:transform .25s cubic-bezier(.3,1.4,.5,1)}
.persp.on{color:#f0e6cd}
.persp.on .box{border-color:rgba(217,180,90,.95)}
.persp.on .box::after{transform:scale(1)}

/* corner: the two controls in a row, the title beneath them and aligned to
   their right edge, so the whole block reads as one piece of chrome. */
#corner{position:fixed;right:22px;top:18px;z-index:17;display:flex;
  flex-direction:column;align-items:flex-end;gap:9px}
#corner .btns{display:flex;align-items:center;gap:8px}
#lang,#back{font-size:11px;letter-spacing:3px;color:#6b6151;cursor:pointer;
  border:1px solid var(--line);padding:5px 9px;text-decoration:none;
  display:inline-flex;align-items:center;justify-content:center;
  transition:color .3s, border-color .3s}
#lang:hover,#back:hover{color:#efe3c6;border-color:rgba(217,180,90,.5)}
/* a bare chevron: unmistakable, and it stops competing with the painting */
#back{font-size:15px;letter-spacing:0;line-height:1;width:30px;height:26px;padding:0}
#title{font-size:12px;letter-spacing:3px;color:#5f5748;pointer-events:none;
  max-width:34vw;text-align:right}

/* top-bar chrome: used on narrow screens, and in Wide mode at any width,
   so the painting can have the full breadth of the display */
body.topbar #panel{position:fixed;left:0;right:0;top:0;bottom:auto;width:auto;transform:none;
  display:flex;align-items:center;gap:12px;padding:7px 10px;opacity:1;z-index:18;
  background:linear-gradient(180deg,rgba(10,8,6,.97),rgba(10,8,6,.88));
  border-bottom:1px solid var(--line);
  overflow-x:auto;scrollbar-width:none;white-space:nowrap}
body.topbar #panel::-webkit-scrollbar{display:none}
body.topbar .sect{margin:0;display:flex;align-items:center;gap:9px;flex:0 0 auto}
body.topbar .sect h2{margin:0;font-size:9px;letter-spacing:2px}
body.topbar #track{width:150px;height:30px;margin:0 2px}
body.topbar #track .line{top:6px}
body.topbar .stop .dot{margin-top:2px;width:8px;height:8px}
body.topbar .stop .lb{margin-top:4px;font-size:9px;letter-spacing:0}
body.topbar .persp{padding:0;font-size:11px;letter-spacing:1px;gap:6px}
body.topbar .persp .box{width:11px;height:11px}
body.topbar #corner{right:10px;top:auto;bottom:9px;flex-direction:row;
  align-items:center;gap:10px}
body.topbar #title{display:none}
body.topbar #loc{top:60px;bottom:auto}
@media(max-width:760px){
  #corner{right:10px;top:10px;gap:6px}
  #title{display:none}
}
</style>
</head>
<body>
<div id="room">
  <div id="desk">
    <div class="roll" id="rollL"><div class="body"></div></div>
    <div id="window">
      <div id="rail"></div>
      <svg id="roads"></svg>
      <div id="sheen"></div>
      <div id="marks"></div>
      <div id="marquee"></div>
      <div id="kept"></div>
      <div id="dlabel"></div>
      <div id="bleed"></div>
    </div>
    <div class="roll" id="rollR"><div class="body"></div></div>
  </div>
  <div id="fold"></div>
</div>

<div id="loc"><img src="assets/nav/strip.jpg" alt=""><div id="locBox"></div></div>

<div id="panel">
  <div class="sect">
    <h2 id="hZoom">Zoom</h2>
    <div id="track"><div class="line"></div></div>
  </div>
  <div class="sect">
    <h2 id="hPersp">Perspectives</h2>
    <div class="persp" data-t="loc"><span class="box"></span><span class="lb"></span></div>
    <div class="persp" data-t="marks"><span class="box"></span><span class="lb"></span></div>
  <div class="persp" data-t="roads"><span class="box"></span><span class="lb"></span></div>
  </div>
</div>

<div id="corner">
  <div class="btns">
    <a id="back" href="cabinet.html" title="Return to Cabinet" aria-label="Return to Cabinet">&lsaquo;</a>
    <div id="lang">中</div>
  </div>
  <div id="title"></div>
</div>

<div id="rollTag"></div>
<script src="assets/scroll/manifest.js"></script>
<script src="assets/data/episodes.js"></script>
<script src="assets/data/details.js"></script>
<script src="assets/data/roads.js" onerror="void 0"></script>
<script src="assets/data/things.js" onerror="void 0"></script>
<script>
(function(){
const S=window.SCROLL, EP=(window.EPISODES&&window.EPISODES.episodes)||[],
      DET=(window.DETAILS&&window.DETAILS.items)||[];
const L=S.w, PH=S.h, CR=S.contentRight||S.w;
const $=id=>document.getElementById(id);
// ?rolls=b|c|d|e swaps how the rolls are drawn, so the variants can be judged on
// the real thing at real size instead of in a mock-up.
(function(){
  const m=/[?&]rolls=([a-e])/.exec(location.search);
  if(!m||m[1]==='d') return;               // d is the default now
  document.body.classList.add('rolls-'+m[1],'rolltag');
  const NAME={a:'cylinder (was default)',b:'facets',c:'ply',e:'ribs'};
  const t=document.getElementById('rollTag');
  if(t) t.textContent='rolls · '+m[1].toUpperCase()+' '+NAME[m[1]];
})();
const desk=$('desk'), win=$('window'), rail=$('rail'), rollL=$('rollL'), rollR=$('rollR'),
      sheen=$('sheen'), foldEl=$('fold'), marksEl=$('marks'), marqEl=$('marquee'),
      keptEl=$('kept'), loc=$('loc'), locBox=$('locBox'), track=$('track'), dlabel=$('dlabel');

const I18N={
  en:{zoom:'Zoom', persp:'Perspectives', whole:'Whole', pane:'Pane', detail:'Detail',
      wide:'Wide', loc:'Locator', marks:'Things', roads:'Roads', lang:'中', back:'Return to Cabinet',
      hidden:'hidden — click the painting to find them', found:'you found',
      title:'A Thousand Li of Rivers and Mountains · Wang Ximeng · Northern Song',
      seg:(i,n)=> i===0?'1 · opening' : i===n-1? n+' · end' : String(i+1)},
  zh:{zoom:'縮放', persp:'視角', whole:'全卷', pane:'展卷', detail:'細看',
      wide:'通幅', loc:'卷影', marks:'物', roads:'道路', lang:'EN', back:'返回畫匣',
      hidden:'已隱藏 —— 點畫面自己找', found:'你找到了',
      title:'千里江山圖　王希孟　北宋',
      seg:(i,n)=> i===0?'一（起首）' : i===n-1? String(n)+'（卷末）' : String(i+1)}
};
let lang=localStorage.getItem('ccp_lang')||'zh';
const t=k=>I18N[lang][k];

let mode='pane', showLoc=false, showMarks=false, showRoads=false, customUsed=false;
const ROADS=(window.ROADS&&window.ROADS.paths)||[];
const THINGS=(window.THINGS&&window.THINGS.items)||[];
const ITEMS = THINGS.length? THINGS : DET;      // catalogue if we have it, else raw detections
const TYPE={
  en:{building:'Building',pavilion:'Pavilion',temple:'Temple',pagoda:'Pagoda',bridge:'Bridge',
      boat:'Boat',figure:'Figure',watermill:'Watermill',jetty:'Jetty',fence:'Enclosure',
      animal:'Animal',other:'Detail'},

let apH=0, apW=0, scale=1, Z=1, x0=0, y0=0, vel=0, panning=false, target=null;
let core=0, thick=0, TX=0, TY=0, kept=null, lastCustom=null;

const cum=[0]; S.tiles.forEach(tt=>cum.push(cum[cum.length-1]+tt.w));
const imgs=S.tiles.map((tt,i)=>{
  const im=document.createElement('img');
  im.src='assets/scroll/tiles/'+tt.f; im.alt=''; im.decoding='async';

const roadsEl=$('roads');
roadsEl.setAttribute('viewBox','0 0 '+L+' '+PH);
roadsEl.setAttribute('preserveAspectRatio','none');
// Rebuild each road from its points rather than its stored `d`, so a run of
// closely-spaced clicks (the tracer following a visible path) can be drawn
// solid, while a long leap between clicks (bridging trees, a ridge, a roof)
// is drawn dotted. Cutoff is per-path, since tracing density varies.
function roadRuns(pts){
  if(!pts || pts.length<2) return [];
  const seg=[];
  for(let i=0;i<pts.length-1;i++){
    const p1=pts[i], p2=pts[i+1];
    seg.push({a:p1,b:p2,len:Math.hypot(p2[0]-p1[0],p2[1]-p1[1])});
  }
  const sorted=seg.map(t=>t.len).sort((x,y)=>x-y);
  const med=sorted[sorted.length>>1]||1;
  const cut=Math.max(med*4, 18);
  const runs=[]; let cur=null;
  seg.forEach(t=>{
    const gap=t.len>cut;
    if(!cur || cur.gap!==gap){
      cur={gap:gap, d:'M '+t.a[0]+' '+t.a[1]};
      runs.push(cur);
    }
    cur.d+=' L '+t.b[0]+' '+t.b[1];
  });
  return runs;
}
ROADS.forEach(p=>{

    ['case','line'].forEach(cls=>{
      const el=document.createElementNS('http://www.w3.org/2000/svg','path');
      el.setAttribute('d',run.d);
      el.setAttribute('class',cls+(run.gap?' gap':''));

    });
  });
});
const nativeZ=()=>Math.max(1.4, Math.min(3.2, 1/scale));
const MINZ=1.25;                                  // lower reasonable bound
const visW=()=>apW/(scale*Z), visH=()=>apH/(scale*Z);

function measure(){
  const vw=innerWidth, vh=innerHeight;
  const narrow=vw<=760;
  document.body.classList.toggle('topbar', narrow || mode==='wide');
  if(mode==='wide'){                          // full breadth of whatever you're on
    apH=Math.min(vh*0.88, vh-108);
    apW=vw-14;
  } else {
    apH=Math.min(vh*(narrow?0.74:0.80), vh-(narrow?112:96));
    apW=apH;
    const maxW=vw-(narrow?14:250);
    if(apW>maxW) apW=Math.max(160,maxW);
  }
  scale=apH/PH;
  const xs=cum.map(c=>Math.round(c*scale));
  for(let i=0;i<imgs.length;i++){
    imgs[i].style.left=xs[i]+'px'; imgs[i].style.width=(xs[i+1]-xs[i])+'px';
  }
  rail.style.width=xs[xs.length-1]+'px';
  roadsEl.setAttribute('width',xs[xs.length-1]); roadsEl.setAttribute('height',apH);
  desk.style.width=apW+'px'; desk.style.height=apH+'px';
  win.style.width=apW+'px'; win.style.height=apH+'px';
  core=apH*0.030;
  const maxLen=(L-visW())*scale, rmax=apH*0.15;
  thick=Math.PI*(rmax*rmax-core*core)/Math.max(1,maxLen);
  loc.style.width=Math.min(vw*(narrow?0.94:0.60),740)+'px';
  layoutFold(); clamp(); render();
}
const rollRadius=len=>Math.sqrt(core*core+thick*Math.max(0,len)*scale/Math.PI);
function clamp(){
  x0=Math.max(0,Math.min(Math.max(0,L-visW()),x0));
  y0=Math.max(0,Math.min(Math.max(0,PH-visH()),y0));
}

function layoutFold(){
  const narrow=innerWidth<=760;
  const availW=Math.min(innerWidth-(narrow?14:250),1360);
  const availH=innerHeight-(narrow?(showLoc?176:112):(showLoc?130:88));
  const N=Math.max(2,Math.min(9,Math.round(Math.sqrt(availH*CR/(availW*PH)))));
  const gap=8, seg=CR/N;
  let rowW=availW, rowH=rowW*PH/seg;
  const total=N*rowH+(N-1)*gap;
  if(total>availH){ const k=availH/total; rowW*=k; rowH*=k; }
  foldEl.style.gap=gap+'px'; foldEl.innerHTML='';
  for(let i=0;i<N;i++){
    const a=CR-(i+1)*seg;
    const d=document.createElement('div');
    d.className='row';
    d.style.width=rowW+'px'; d.style.height=rowH+'px';
    const bgW=(L/seg)*rowW;
    d.style.backgroundSize=bgW+'px '+(bgW*PH/L)+'px';
    d.style.backgroundPosition=(-(a/seg)*rowW)+'px 0px';
    d.innerHTML='<span class="seg">'+t('seg')(i,N)+'</span>';
    d.addEventListener('click',ev=>{
      const r=d.getBoundingClientRect();
      setMode('pane');
      x0=a+((ev.clientX-r.left)/rowW)*seg-visW()/2; clamp(); render();
    });
    foldEl.appendChild(d);
  }
}

function render(){
  if(mode!=='fold'){
    const sE=scale*Z;
    TX=-x0*sE; TY=-y0*sE;
    const tf='translate3d('+TX.toFixed(2)+'px,'+TY.toFixed(2)+'px,0) scale('+Z.toFixed(4)+')';
    rail.style.transform=tf;
    roadsEl.style.transform=tf;
    roadsEl.style.display=(showRoads&&ROADS.length)?'block':'none';
    const fade=(mode==='wide')?0:(Z<=1.03?1:Math.max(0,1-(Z-1)/0.5));
    rollL.style.opacity=fade; rollR.style.opacity=fade;
    rollL.style.pointerEvents=fade>.4?'auto':'none';
    rollR.style.pointerEvents=fade>.4?'auto':'none';
    if(fade>0){
      const RL=rollRadius(x0), RR=rollRadius(Math.max(0,L-x0-visW()));
      rollL.style.width=(2*RL)+'px'; rollL.style.left=(-2*RL)+'px';
      rollR.style.width=(2*RR)+'px'; rollR.style.left=apW+'px';
    }
    const f=Math.max(0,Math.min(1,x0/Math.max(1,L-visW())));
    sheen.style.setProperty('--sheenX',(12+f*76).toFixed(1)+'%');
    win.classList.toggle('zoomed', Z>1.03);
    renderMarks(sE); renderKept(sE);
  }
  syncLoc(); syncTrack();
}
const markEls=ITEMS.map(d=>{
  const el=document.createElement('div'); el.className='mk';
  el.addEventListener('pointerdown',ev=>ev.stopPropagation());
  el.addEventListener('click',ev=>{ ev.stopPropagation(); revealThing(d,true); });

const card=document.createElement('div'); card.id='card'; win.appendChild(card);
let cardT=null;
function revealThing(d,known){

  card.innerHTML='<div class="k">'+label+'</div>'+
    (d.note?'<div class="n">'+d.note+'</div>':'')+
    (known?'':'<div class="c">'+t('found')+'</div>');
  let cx=d.x*sE+TX+16, cy=d.y*sE+TY-10;
  cx=Math.max(8,Math.min(apW-224,cx)); cy=Math.max(8,Math.min(apH-90,cy));
  card.style.left=cx+'px'; card.style.top=cy+'px';
  card.classList.add('on');
  clearTimeout(cardT); cardT=setTimeout(()=>card.classList.remove('on'), known?4200:5200);
}
function renderMarks(sE){
  if(!showMarks||mode==='fold'){ marksEl.style.display='none'; return; }
  marksEl.style.display='block';
  for(let i=0;i<ITEMS.length;i++){
    const d=ITEMS[i], el=markEls[i];
    const sx=d.x*sE+TX, sy=d.y*sE+TY;
    if(sx<-30||sx>apW+30||sy<-30||sy>apH+30){ el.style.display='none'; continue; }
    el.style.display='block'; el.style.left=sx+'px'; el.style.top=sy+'px';
  }
}
function renderKept(sE){
  if(!kept){ keptEl.style.display='none'; return; }
  keptEl.style.display='block';
  keptEl.style.left=(kept.x*sE+TX)+'px'; keptEl.style.top=(kept.y*sE+TY)+'px';
  keptEl.style.width=(kept.w*sE)+'px';   keptEl.style.height=(kept.h*sE)+'px';
}
function syncLoc(){
  loc.style.display=showLoc?'block':'none';
  if(!showLoc) return;
  const w=loc.clientWidth;
  if(mode==='fold'){ locBox.style.left='0px'; locBox.style.width=w+'px'; return; }
  const a=(x0/L)*w, b=(visW()/L)*w;
  locBox.style.left=Math.max(0,Math.min(w-b,a))+'px';
  locBox.style.width=Math.max(3,b)+'px';
}

// the zoom number line; the third stop exists only once you've made one
function buildTrack(){
  [...track.querySelectorAll('.stop')].forEach(n=>n.remove());
  const stops=[['fold',t('whole')],['wide',t('wide')],['pane',t('pane')]];
  if(customUsed) stops.push(['custom',t('detail')]);
  stops.forEach(([k,label],i)=>{
    const el=document.createElement('div');
    el.className='stop'; el.dataset.k=k;
    el.style.left=(i/(stops.length-1))*100+'%';
    el.innerHTML='<div class="dot"></div><div class="lb"></div>';
    iconise(el.querySelector('.lb'),k,label);
    el.addEventListener('click',()=>setMode(k));
    track.appendChild(el);
  });
  syncTrack();
}
function syncTrack(){
  [...track.querySelectorAll('.stop')].forEach(el=>
    el.classList.toggle('on', el.dataset.k===mode));
}

function setMode(m){
  if(m==='custom'&&!customUsed) m='pane';
  mode=m;
  if(m==='fold'){ desk.style.display='none'; foldEl.style.display='flex'; layoutFold(); }
  else{
    desk.style.display='block'; foldEl.style.display='none';
    if(m==='pane'||m==='wide'){ Z=1; y0=0; kept=null; }
    else if(m==='custom'&&lastCustom){
      Z=lastCustom.Z; x0=lastCustom.x0; y0=lastCustom.y0; kept=lastCustom.kept;
      keptEl.style.opacity='1'; setTimeout(()=>{keptEl.style.opacity='0';},2600);
    }
  }
  measure();                                  // aperture geometry depends on the mode
  clamp(); render();
}

let last=performance.now();
function loop(now){
  const dt=Math.min(.05,(now-last)/1000); last=now;
  if(mode!=='fold'&&!panning){
    if(target!==null){
      const d=target-x0;
      if(Math.abs(d)<.6){ x0=target; target=null; vel=0; } else x0+=d*Math.min(1,dt*7);
    } else if(vel!==0){
      vel*=Math.pow(.94,dt*60); x0+=vel*dt;
      if(Math.abs(vel)<8){ vel=0; snap(); }
      const mx=Math.max(0,L-visW()); if(x0<0||x0>mx) vel=0;
    }
  }
  clamp(); render(); requestAnimationFrame(loop);
}
function snap(){
  if(Z>1.03||!EP.length) return;
  let best=null,bd=1e9;
  for(const e of EP){ const d=Math.abs(e.x0-x0); if(d<bd){bd=d;best=e.x0;} }
  if(best!==null&&bd<visW()*0.32) target=best;
}

// --- drag a ROLL to unroll -------------------------------------------------
let px=0,sx=0,eng=false,dv=0,lt=0,lx=0;
function rollDown(e){
  panning=true; eng=false; target=null; vel=0;
  px=e.clientX; sx=x0; lx=e.clientX; lt=performance.now();
  e.currentTarget.setPointerCapture(e.pointerId);
  e.currentTarget.classList.add('pulling'); e.stopPropagation();
}
function rollMove(e){
  if(!panning) return;
  const dx=e.clientX-px;
  if(!eng){ if(Math.abs(dx)<5) return; eng=true; px=e.clientX; sx=x0; }
  const sE=scale*Z;
  x0=sx-(e.clientX-px)/sE;
  const now=performance.now(), dt=(now-lt)/1000;
  if(dt>.004){ dv=-((e.clientX-lx)/sE)/dt; lx=e.clientX; lt=now; }
}
function rollUp(){
  if(!panning) return;
  panning=false; vel=eng?dv:0; dv=0;
  [rollL,rollR].forEach(r=>r.classList.remove('pulling'));
}
[rollL,rollR].forEach(r=>{
  r.addEventListener('pointerdown',rollDown);
  r.addEventListener('pointermove',rollMove);
  r.addEventListener('pointerup',rollUp);
  r.addEventListener('pointercancel',rollUp);

// --- drag the SILK to select; when already zoomed, to pan ------------------
let marq=null, panZ=null;
win.addEventListener('pointerdown',e=>{
  if(pts.size>1) return;
  const r=win.getBoundingClientRect();
  // touch: a finger drag means "move the scroll", always. Zoom is pinch.
  if(e.pointerType==='touch' || Z>1.03){
    panZ={x:e.clientX,y:e.clientY,x0:x0,y0:y0,lx:e.clientX,lt:performance.now(),v:0};
    target=null; vel=0;
    win.classList.add('panning'); win.setPointerCapture(e.pointerId); return;
  }
  marq={x:e.clientX-r.left,y:e.clientY-r.top};
  marqEl.style.display='block';
  marqEl.style.left=marq.x+'px'; marqEl.style.top=marq.y+'px';
  marqEl.style.width='0px'; marqEl.style.height='0px';
  win.setPointerCapture(e.pointerId);
});
win.addEventListener('pointermove',e=>{
  if(panZ){
    const sE=scale*Z;
    x0=panZ.x0-(e.clientX-panZ.x)/sE; y0=panZ.y0-(e.clientY-panZ.y)/sE;
    const now=performance.now(), dt=(now-panZ.lt)/1000;
    if(dt>.004){ panZ.v=-((e.clientX-panZ.lx)/sE)/dt; panZ.lx=e.clientX; panZ.lt=now; }
    clamp(); return;
  }
  if(!marq) return;
  const r=win.getBoundingClientRect(), cx=e.clientX-r.left, cy=e.clientY-r.top;
  marqEl.style.left=Math.min(marq.x,cx)+'px'; marqEl.style.top=Math.min(marq.y,cy)+'px';
  marqEl.style.width=Math.abs(cx-marq.x)+'px'; marqEl.style.height=Math.abs(cy-marq.y)+'px';
});
function winUp(){
  if(panZ){ vel=panZ.v||0; panZ=null; win.classList.remove('panning'); return; }  // flick glides
  if(!marq) return;
  const w=parseFloat(marqEl.style.width)||0, h=parseFloat(marqEl.style.height)||0;
  const lf=parseFloat(marqEl.style.left)||0, tp=parseFloat(marqEl.style.top)||0;
  marqEl.style.display='none'; marq=null;
  if(w<26||h<26){
    if(!showMarks && ITEMS.length && w<6 && h<6){      // a tap, not a scrub: go hunting
      const sE0=scale*Z, cx=(lf-TX)/sE0, cy=(tp-TY)/sE0;
      let best=null,bd=1e9;
      for(const d of ITEMS){ const q=Math.hypot(d.x-cx,d.y-cy); if(q<bd){bd=q;best=d;} }
      if(best && bd < 46/(scale*Z)) revealThing(best,false);
    }
    return;
  }
  const sE=scale*Z;
  const sel={x:x0+lf/sE, y:y0+tp/sE, w:w/sE, h:h/sE};
  const PAD=1.38;                                   // keep context around the selection
  const want=Math.min(apW/(sel.w*PAD*scale), apH/(sel.h*PAD*scale));
  Z=Math.max(MINZ, Math.min(nativeZ(), want));
  x0=sel.x+sel.w/2-visW()/2; y0=sel.y+sel.h/2-visH()/2;
  kept=sel; customUsed=true; clamp();
  lastCustom={Z:Z,x0:x0,y0:y0,kept:sel};
  mode='custom'; buildTrack(); render();
  keptEl.style.opacity='1';
  setTimeout(()=>{ keptEl.style.opacity='0'; },2600);
}
win.addEventListener('pointerup',winUp);

// --- wheel travels; pinch changes zoom ------------------------------------
addEventListener('wheel',e=>{
  if(mode==='fold') return;

    e.preventDefault();
    const before=Z;
    Z=Math.max(1, Math.min(nativeZ(), Z*(1-e.deltaY*0.01)));
    if(Z<=1.02&&before>1.02){ setMode('pane'); return; }
    if(Z>1.02){ customUsed=true; mode='custom'; lastCustom={Z:Z,x0:x0,y0:y0,kept:kept}; buildTrack(); }
    clamp(); render(); return;
  }
  const d=Math.abs(e.deltaX)>Math.abs(e.deltaY)?e.deltaX:e.deltaY;
  target=null; x0+=d/(scale*Z)*1.1; vel=0; clamp(); render();

const pts=new Map(); let pinch0=null;

  if(e.pointerType!=='touch') return;
  pts.set(e.pointerId,e);

    const d=Math.hypot(a.clientX-b.clientX,a.clientY-b.clientY);
    if(pinch0===null){ pinch0={d:d,Z:Z}; return; }
    const before=Z;
    Z=Math.max(1,Math.min(nativeZ(), pinch0.Z*(d/pinch0.d)));
    if(Z<=1.02&&before>1.02) setMode('pane');
    else if(Z>1.02){ customUsed=true; mode='custom'; lastCustom={Z:Z,x0:x0,y0:y0,kept:kept}; buildTrack(); }
    clamp(); render();
  }
},true);

setMode('pane');

})();
</script>
<script>
// ?bg=paper|silk|blush|dawn puts the scroll on a light ground instead of in a
// dark room. Same switcher pattern as ?rolls= and ?font=.
(function(){
  var m=/[?&]bg=(paper|silk|blush|dawn)/.exec(location.search); if(!m) return;
  document.body.classList.add('bg-'+m[1],'bgtag');
  var d=document.createElement('div'); d.id='bgTag';
  d.textContent='ground \u00b7 '+m[1];
  document.body.appendChild(d);
})();
// ?font=b|c|d|e swaps the type stack so the options can be judged in place.
(function(){
  var m=/[?&]font=([a-e])/.exec(location.search); if(!m||m[1]==='b') return;
  document.body.classList.add('font-'+m[1],'fonttag');
  var N={a:'EB Garamond (was default)',c:'Helvetica Neue',d:'Avenir Next',e:'Futura'};
  var d=document.createElement('div'); d.id='fontTag';
  d.textContent='type \u00b7 '+m[1].toUpperCase()+' '+N[m[1]];
  document.body.appendChild(d);
})();
</script>
</body>
