<!DOCTYPE html>
<html lang="zh-Hans">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
<title>A Thousand Li of Rivers and Mountains</title>
<meta name="description" content="Wang Ximeng's handscroll — unroll it, fold it, or select a detail.">
<link rel="stylesheet" href="css/type.css?v=3">
<style>
:root{
  --room:#0c0a08; --warm:#d9b45a; --line:rgba(217,180,90,.20);
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--room);overflow:hidden;
  font-family:var(--type);-webkit-font-smoothing:antialiased;
  -webkit-user-select:none;user-select:none;touch-action:none}

#room{position:fixed;inset:0;
  background:radial-gradient(88% 68% at 28% 6%, rgba(224,186,120,.11), transparent 62%), var(--room)}
#room::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:1;
  background:radial-gradient(132% 100% at 50% 50%, transparent 46%, rgba(0,0,0,.7) 100%)}

/* ---------------- the scroll ---------------- */
/* The eight scrolls range from 25:1 to 1:2, so a centred window put its top
   edge somewhere different on every painting and the chrome appeared to drift
   as you moved between them. Anchored to the top, the title and the panel sit
   in the same place on all of them, and the empty desk falls below -- which is
   where the empty part of a table is anyway. measure() sets the offset. */
#desk{position:absolute;left:50%;transform:translateX(-50%);z-index:2}
#window{position:absolute;overflow:hidden;background:#0e0c0a;cursor:crosshair;
  box-shadow:0 30px 80px rgba(0,0,0,.75), 0 0 0 1px rgba(217,180,90,.10)}
#window.panning{cursor:grabbing}
#window.zoomed{cursor:grab}
#rail{position:absolute;top:0;left:0;height:100%;transform-origin:0 0;will-change:transform}
#rail img{position:absolute;top:0;height:100%;display:block;border:0;
  -webkit-user-drag:none;pointer-events:none}
#window::before,#window::after{content:"";position:absolute;top:0;bottom:0;width:5%;
  pointer-events:none;z-index:4}
#window::before{left:0;background:linear-gradient(90deg,rgba(0,0,0,.55),transparent)}
#window::after{right:0;background:linear-gradient(270deg,rgba(0,0,0,.55),transparent)}
#sheen{position:absolute;inset:0;pointer-events:none;z-index:3;mix-blend-mode:soft-light;opacity:.45;
  background:
    repeating-linear-gradient(0deg, rgba(255,255,255,.05) 0 1px, transparent 1px 3px),
    linear-gradient(100deg, transparent 34%, rgba(255,244,214,.62) 50%, transparent 66%);
  background-size:auto, 260% 100%;
  background-position:0 0, var(--sheenX,0%) 0}

/* rolls: geometric, and the thing you drag to unroll */
.roll{position:absolute;top:0;height:100%;z-index:6;cursor:grab;transition:opacity .25s}
.roll.pulling{cursor:grabbing}
.roll .body{position:absolute;inset:0;
  background:#1a160f}                       /* D "blade": flat, no modelling */
#rollL .body{border-right:2px solid rgba(217,180,90,.5)}
#rollR .body{border-left:2px solid rgba(217,180,90,.5)}

/* ---- roll treatments, switched with ?rolls=b|c|d|e ----
   The default is a smooth three-stop gradient, i.e. a lit cylinder. These are
   angular alternatives: the roll stated as flat planes rather than modelled. */
body.rolls-b .roll .body{box-shadow:none;background:linear-gradient(90deg,
  #14110a 0 12%,#241f16 12% 26%,#3a3327 26% 42%,#4a4132 42% 58%,
  #3a3327 58% 74%,#241f16 74% 88%,#14110a 88% 100%)}
body.rolls-c .roll .body{box-shadow:none}
body.rolls-c #rollL .body{background:linear-gradient(90deg,
  #0d0b07 0 18%,#1b1710 18% 36%,#282218 36% 54%,#352d20 54% 72%,#43392a 72% 88%,#524634 88% 100%)}
body.rolls-c #rollR .body{background:linear-gradient(270deg,
  #0d0b07 0 18%,#1b1710 18% 36%,#282218 36% 54%,#352d20 54% 72%,#43392a 72% 88%,#524634 88% 100%)}
/* D is now the default; ?rolls=a restores the original lit cylinder. */
body.rolls-a .roll .body{box-shadow:0 18px 44px rgba(0,0,0,.55);
  background:linear-gradient(90deg, rgba(14,11,8,.96), rgba(52,45,34,.92) 46%, rgba(14,11,8,.96))}
body.rolls-a #rollL .body{border-right:1px solid rgba(217,180,90,.34)}
body.rolls-a #rollR .body{border-left:1px solid rgba(217,180,90,.34)}
body.rolls-e .roll .body{box-shadow:none;background:
  repeating-linear-gradient(90deg,#2a241a 0 11px,#100e09 11px 12px)}
#rollTag{position:fixed;left:12px;top:10px;z-index:40;font:11px/1 ui-monospace,Menlo,monospace;
  letter-spacing:2px;color:#7a6f5a;display:none}
body.rolltag #rollTag{display:block}

/* ---- grounds, switched with ?bg=paper|silk|blush|dawn ---------------------
   The default is a dark room: the painting glows, like a lit object in a vitrine.
   These invert that — the scroll lies on paper, as an album leaf does, and the
   chrome recedes to low-contrast ink. Everything below is expressed through
   variables so a theme is a palette, not a fork of the stylesheet. */
body[class*="bg-"]{ --line:var(--th-line); --warm:var(--th-accent); }
body[class*="bg-"] #room{background:linear-gradient(180deg,var(--th-bg),var(--th-bg2))}
body[class*="bg-"] #room::after{background:radial-gradient(130% 100% at 50% 46%,
  transparent 55%, rgba(120,104,78,.13) 100%)}
body[class*="bg-"] #window{background:var(--th-bg2);
  box-shadow:0 18px 46px var(--th-shadow), 0 0 0 1px var(--th-line)}
body[class*="bg-"] .roll .body{background:var(--th-roll)}
body[class*="bg-"] #rollL .body{border-right:2px solid var(--th-accent)}
body[class*="bg-"] #rollR .body{border-left:2px solid var(--th-accent)}
body[class*="bg-"] #sheen{opacity:.22}
body[class*="bg-"] .sect h2,
body[class*="bg-"] .stop .lb,
body[class*="bg-"] .persp,
body[class*="bg-"] #title,
body[class*="bg-"] #lang,
body[class*="bg-"] #back{color:var(--th-muted)}
body[class*="bg-"] .stop:hover .lb,
body[class*="bg-"] .stop.on .lb,
body[class*="bg-"] .persp:hover,
body[class*="bg-"] #lang:hover,
body[class*="bg-"] #back:hover{color:var(--th-ink)}
body[class*="bg-"] .stop .dot{background:var(--th-bg2);border-color:var(--th-accent)}
body[class*="bg-"] .stop.on .dot{background:var(--th-accent);box-shadow:none}
body[class*="bg-"] #card{background:var(--th-bg2);border-color:var(--th-line);
  box-shadow:0 8px 26px var(--th-shadow)}
body[class*="bg-"] #card .k{color:var(--th-ink)}
body[class*="bg-"] #card .n{color:var(--th-muted)}
body[class*="bg-"] #card .c{color:var(--th-muted)}
body[class*="bg-"] #loc{background:var(--th-bg2);border-color:var(--th-line)}
body[class*="bg-"] #locBox{border-color:var(--th-accent);
  box-shadow:0 0 0 9999px rgba(120,104,78,.22)}
body[class*="bg-"] #bleed{background:var(--th-bg)}
body[class*="bg-"] #dlabel{color:var(--th-ink);text-shadow:0 0 12px var(--th-bg)}
body[class*="bg-"] .mk{border-color:var(--th-accent);box-shadow:none}
body[class*="bg-"] #roads .case{stroke:rgba(255,255,255,.65)}
body[class*="bg-"] #roads .line{stroke:#3b3428}
body[class*="bg-"] #fold .row{border-color:var(--th-line);
  box-shadow:0 5px 16px var(--th-shadow)}
body[class*="bg-"] #marquee,body[class*="bg-"] #kept{border-color:var(--th-ink)}
body[class*="bg-"] body.topbar #panel{background:var(--th-bg)}

body.bg-paper{ --th-bg:#efe9dc; --th-bg2:#f6f1e7; --th-ink:#4a463c; --th-muted:#8a8375;
  --th-accent:#b6412e; --th-line:rgba(90,80,60,.20); --th-roll:#d6cbb4;
  --th-shadow:rgba(90,78,56,.22) }
body.bg-silk{ --th-bg:#ded2bb; --th-bg2:#e7ddc7; --th-ink:#4a4234; --th-muted:#8b8069;
  --th-accent:#a8402f; --th-line:rgba(80,68,46,.22); --th-roll:#c9bb9c;
  --th-shadow:rgba(80,66,42,.24) }
body.bg-blush{ --th-bg:#f6eff0; --th-bg2:#fbf6f6; --th-ink:#6a5b60; --th-muted:#9b8d92;
  --th-accent:#c98a9e; --th-line:rgba(120,95,105,.18); --th-roll:#e2d6da;
  --th-shadow:rgba(120,95,105,.18) }
body.bg-dawn{ --th-bg:#fdf6ef; --th-bg2:#f7f0f3; --th-ink:#6b6069; --th-muted:#968a94;
  --th-accent:#e0a08c; --th-line:rgba(120,105,105,.16); --th-roll:#ece0da;
  --th-shadow:rgba(120,105,100,.16) }
#bgTag{position:fixed;left:12px;top:42px;z-index:40;
  font:11px/1 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:2px;
  color:var(--th-muted,#7a6f5a);display:none}
body.bgtag #bgTag{display:block}

/* ---- pictograms, switched with ?icons=1 --------------------------------
   Each zoom icon is the SHAPE OF THE WINDOW that mode gives you: four stacked
   bars for the four-row fold, one wide bar for full breadth, a near-square for
   the pane, a marquee around a crop for a detail. The perspectives are the
   thing itself — a frame with a block sliding in it, rings, a winding line.
   With icons the headings are redundant, so they go. */
body.icons .sect h2{display:none}
body.icons .sect{margin-bottom:22px}
body.icons #track{margin-top:2px}
body.icons .stop .lb{margin-top:6px;line-height:0}
body.icons .persp .lb{line-height:0;display:inline-flex;align-items:center}
body.icons .ico{display:block;width:26px;height:26px}
body.icons .stop .ico{margin:0 auto}
body.icons .persp .ico{width:30px;height:22px}
.ico{fill:none;stroke:currentColor;stroke-width:1.6;
  stroke-linecap:square;stroke-linejoin:miter;vector-effect:non-scaling-stroke}
.ico .f{fill:currentColor;stroke:none}
body.topbar.icons .stop .lb{margin-top:3px}
body.topbar.icons .ico{width:22px;height:22px}
#marks{position:absolute;inset:0;z-index:7;pointer-events:none;display:none}
/* roads draw themselves as you arrive — see drawIn() */
/* writing on the painting: the cursor says the drag will frame, not zoom */
body.writing #window{cursor:crosshair}
body.writing #marquee{border-color:rgba(233,209,150,.9)}
.nt.mine{border-style:dashed;border-color:rgba(150,205,180,.72);cursor:pointer}
.nt.mine .lbl{color:#bfe6d2}
#editor{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);z-index:70;
  width:min(420px,90vw);display:none;background:rgba(20,17,12,.96);
  border:1px solid #4a4030;border-radius:4px;padding:12px}
#editor.on{display:block}
#editor .where{font-size:11px;letter-spacing:.5px;margin-bottom:8px;padding-bottom:6px;
  border-bottom:1px solid rgba(90,80,60,.25)}
#editor .where.private{color:#7f9a88}
#editor .where.shared{color:#c2ae7f}
#editor input,#editor textarea{width:100%;background:#0f0c09;color:#e4d8b8;
  border:1px solid #3b342a;border-radius:2px;padding:7px 8px;margin-bottom:7px;
  font:inherit;font-size:13px;resize:vertical}
#editor .row{display:flex;gap:8px;justify-content:flex-end}
#editor button{background:#241f18;color:#cbbd9c;border:1px solid #3b342a;
  border-radius:2px;padding:5px 12px;font-size:12px;cursor:pointer}
#editor button.ok{background:#4a3f1e;border-color:#7a6530;color:#f3e6c2}
#editor button.del:hover{background:#4a221c;border-color:#7d3a2e;color:#f3d0c6}
/* the colophons, read in the order the scroll unrolls */
#script{position:fixed;right:22px;top:96px;bottom:26px;width:min(320px,42vw);z-index:60;
  display:none;overflow-y:auto;background:rgba(18,15,11,.95);border:1px solid #3a3327;
  border-radius:3px;padding:8px}
#script.on{display:block}
#script .row{padding:9px 10px;border-bottom:1px solid rgba(90,80,60,.18);cursor:pointer}
#script .row:hover{background:rgba(217,180,90,.07)}
#script .at{font-size:10px;color:#6f6552;letter-spacing:1px;margin-right:8px}
#script .tt{font-size:13px;color:#d9caa4}
#script .row.mine .tt{color:#bfe6d2}
#script .bd{margin-top:4px;font-size:12px;line-height:1.5;color:#8d8270;text-wrap:pretty}
#script .empty{padding:14px;font-size:12px;color:#6f6552;text-align:center}
#scriptCount{margin-left:6px;font-size:10px;color:#6f6552}
body.icons #scriptCount{display:none}
#log{position:fixed;right:22px;top:96px;bottom:26px;width:min(340px,46vw);z-index:60;
  display:none;overflow-y:auto;background:rgba(18,15,11,.95);border:1px solid #3a3327;
  border-radius:3px;padding:8px}
#log.on{display:block}
#log .lhead{font-size:12px;letter-spacing:2px;color:#c2ae7f;padding:6px 8px 8px}
#log .who{font-size:11px;color:#8d8270;padding:0 8px 10px;border-bottom:1px solid rgba(90,80,60,.2)}
#log .lrow{display:flex;gap:7px;align-items:baseline;flex-wrap:wrap;
  padding:7px 8px;border-bottom:1px solid rgba(90,80,60,.12);font-size:12px}
#log .lt{color:#635a49;font-size:10px;min-width:82px}
#log .lb2{color:#bfe6d2}
#log .lv{color:#8d8270}
#log .lw{color:#6f6552;font-size:11px}
#log .lq{color:#d9caa4}
#log .empty{padding:14px;font-size:12px;color:#6f6552;text-align:center}
#log .act{display:flex;gap:8px;padding:10px 8px 4px}
#log .act button{flex:1;background:#241f18;color:#cbbd9c;border:1px solid #3b342a;
  border-radius:2px;padding:6px 8px;font-size:11px;cursor:pointer}
#log .act button:hover{background:#2e2820;color:#f0e6cd}
#toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:80;
  background:rgba(20,17,12,.95);border:1px solid #4a4030;border-radius:3px;
  padding:8px 14px;font-size:12px;color:#d8c9a4;opacity:0;transition:opacity .3s;
  pointer-events:none;max-width:86vw;text-align:center}
#toast.on{opacity:1}
.nt.room{border-color:rgba(190,170,235,.66)}
.nt.room .lbl{color:#cfc2ee}
#script .row.room .tt{color:#cfc2ee}
#script .by{font-size:10px;color:#8d8270;margin-left:7px}
/* a hanging scroll: no roll ends, no unrolling stops, no horizontal locator.
   Everything else -- zoom, notes, the panel, the language toggle -- stands. */
body.vert #rollL, body.vert #rollR, body.vert #sheen{display:none !important}
body.vert .sect.zoomsect, body.vert .persp[data-t="loc"]{display:none}
body.vert #rail img{display:block}
/* ---- English sets differently from Chinese ------------------------------
   A Chinese title is 5 characters in a fixed square grid; its English
   equivalent is "Illustration to the Second Prose Poem on the Red Cliff" --
   eight times the length, in glyphs of varying width. Layouts measured
   against the Chinese therefore break under the English, and the damage
   shows up as bad rag: one long line, then a word alone underneath.

   Three things, all cheap:

   1. letter-spacing goes. 2-3px is right for 方块字, which need the air; on
      Latin it pulls words into loose letters. This is the single biggest
      cause of the wrapping looking wrong.
   2. text-wrap: balance on short text -- titles, labels, captions. It evens
      the line lengths instead of filling greedily and leaving a stub. The
      browser applies it up to six lines (Chromium) or ten (Firefox), which
      is exactly the range these elements live in.
   3. text-wrap: pretty on running text, which prevents the last line being
      a single orphaned word.

   Measure stays out of it: the classic 45-75 characters is for paragraphs,
   and none of this is a paragraph. */
:lang(en) #title, :lang(en) .cell .name, :lang(en) .cell .meta,
:lang(en) .cell .await, :lang(en) #geo .sub, :lang(en) #notready,
:lang(en) #zhint, :lang(en) .lb, :lang(en) .nt .lbl{
  letter-spacing:.2px; text-wrap:balance;
}
:lang(en) #credit{ letter-spacing:0; text-wrap:pretty }
/* the corner title is the worst case: longest string, narrowest column */
:lang(en) #title{ max-width:min(46vw,380px); line-height:1.45 }
/* and the cells were sized for five characters, not fifty */
:lang(en) .cell{ min-height:118px }
:lang(en) .cell .name{ font-size:14.5px; line-height:1.35 }
:lang(en) .cell .meta{ line-height:1.4 }
#credit{font-size:10px;letter-spacing:1px;color:#5f5748;text-align:right;margin-top:2px}
#credit a{color:#6b6151;text-decoration:none;border-bottom:1px solid rgba(107,97,81,.4)}
#credit a:hover{color:#c9b98f}
#notready{position:fixed;left:50%;top:14px;transform:translateX(-50%);z-index:60;
  background:rgba(24,20,14,.92);border:1px solid #4a4030;border-radius:3px;
  padding:9px 14px;font-size:12px;letter-spacing:1px;color:#d8c9a4;
  transition:opacity .6s ease;max-width:88vw;text-align:center}
#notready span{color:#8d8270;font-size:11px}
#notready.go{opacity:0;pointer-events:none}
#zhint{position:absolute;left:50%;bottom:26px;transform:translateX(-50%);z-index:9;
  font-size:12px;letter-spacing:2px;color:#a2947a;pointer-events:none;
  text-shadow:0 1px 6px #000}
/* a noted thing: a box round it, the remark set just above */
.nt{position:absolute;border:1px solid rgba(233,209,150,.62);pointer-events:auto;
  box-shadow:0 0 14px rgba(217,180,90,.16), inset 0 0 18px rgba(217,180,90,.07);
  transition:border-color .3s}
.nt:hover{border-color:rgba(247,231,190,.95)}
.nt .lbl{position:absolute;left:0;bottom:100%;margin-bottom:5px;white-space:nowrap;
  font-size:11px;letter-spacing:1px;color:#f0e2bb;text-shadow:0 1px 4px #000,0 0 10px #000}
.mk{position:absolute;width:26px;height:26px;margin:-13px 0 0 -13px;border-radius:50%;
  border:1px solid rgba(233,209,150,.5);pointer-events:auto;cursor:pointer;
  box-shadow:0 0 12px rgba(217,180,90,.25), inset 0 0 10px rgba(217,180,90,.13);
  transition:transform .3s ease, border-color .3s ease}
.mk:hover{transform:scale(1.35);border-color:rgba(247,231,190,.95)}

#card{position:absolute;z-index:12;max-width:210px;padding:9px 12px;
  background:rgba(18,15,11,.94);border:1px solid rgba(217,180,90,.45);
  box-shadow:0 8px 30px rgba(0,0,0,.7);opacity:0;pointer-events:none;
  transition:opacity .45s ease, transform .45s ease;transform:translateY(5px)}
#card.on{opacity:1;transform:translateY(0)}
#card .k{font-size:13px;letter-spacing:3px;color:#f0e6cd;margin-bottom:3px}
#card .n{font-size:12px;line-height:1.45;color:#9d917a}
#card .c{font-size:10px;letter-spacing:2px;color:#6b6151;margin-top:5px;text-transform:uppercase}

/* roads: white over a dark casing so the line survives both silk and shadow.
   non-scaling-stroke keeps it a constant screen width at every zoom. */
#roads{position:absolute;left:0;top:0;z-index:5;pointer-events:none;overflow:visible;
  transform-origin:0 0;display:none}
#roads path{fill:none;vector-effect:non-scaling-stroke;stroke-linecap:round;stroke-linejoin:round}
#roads .case{stroke:rgba(0,0,0,.5);stroke-width:3.4}
#roads .line{stroke:#fff;stroke-width:1.4}
/* stretches the tracer had to leap across — road inferred, not seen */
#roads .gap{stroke-dasharray:0.5 5}
#roads .gap.line{opacity:.8}
.persp.off{opacity:.35;cursor:default}

/* the dashed selection, and the outline kept afterwards for context */
#marquee,#kept{position:absolute;z-index:9;display:none;pointer-events:none;
  border:1px dashed rgba(245,230,192,.95)}
#marquee{background:rgba(217,180,90,.07)}
#kept{transition:opacity 1.1s ease;box-shadow:0 0 0 1px rgba(0,0,0,.5), 0 0 18px rgba(217,180,90,.26)}
#bleed{position:absolute;inset:0;z-index:10;pointer-events:none;background:#0d0b09;
  transition:opacity 1.4s ease}
#dlabel{position:absolute;left:50%;bottom:9%;transform:translateX(-50%);z-index:11;
  font-size:15px;letter-spacing:5px;color:#f4e8c8;opacity:0;pointer-events:none;
  transition:opacity .8s ease;text-shadow:0 0 14px rgba(0,0,0,.95)}

/* ---------------- fold ---------------- */
#fold{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:2;
  display:none;flex-direction:column;align-items:center}
/* the strip is per painting -- layoutFold() sets it; this is only the fallback */
#fold .row{background-image:url('assets/fold/strip.jpg');background-repeat:no-repeat;
  border:1px solid rgba(176,141,87,.26);box-shadow:0 6px 20px rgba(0,0,0,.5);
  cursor:pointer;position:relative}
#fold .row .seg{position:absolute;top:5px;right:8px;font-size:10px;letter-spacing:2px;
  color:rgba(231,221,201,.7);text-shadow:0 1px 4px rgba(0,0,0,.9);pointer-events:none}

/* ---------------- locator ---------------- */
#loc{position:fixed;left:50%;transform:translateX(-50%);bottom:34px;z-index:14;
  display:none;line-height:0;border:1px solid rgba(217,180,90,.24);cursor:pointer;
  background:#0e0c0a;touch-action:none;overflow:hidden}   /* clips locBox's scrim */
#loc img{display:block;width:100%;height:auto;pointer-events:none}
#locBox{position:absolute;top:0;bottom:0;border:2px solid var(--warm);
  box-shadow:0 0 0 9999px rgba(10,8,6,.5), 0 0 12px rgba(217,180,90,.45);pointer-events:none}

/* ---------------- right-hand panel ---------------- */
#panel{position:fixed;right:22px;top:50%;transform:translateY(-50%);z-index:16;
  width:158px;opacity:.74;transition:opacity .35s ease}
#panel:hover{opacity:1}
.sect{margin-bottom:28px}
.sect h2{margin:0 0 10px;font-size:11px;font-weight:500;letter-spacing:4px;
  text-transform:uppercase;color:#6e6552}

#track{position:relative;height:38px;margin:0 22px 0 8px}
#track .line{position:absolute;left:0;right:0;top:9px;height:1px;background:rgba(217,180,90,.26)}
.stop{position:absolute;top:0;transform:translateX(-50%);cursor:pointer;text-align:center}
.stop .dot{width:9px;height:9px;margin:5px auto 0;border-radius:50%;
  border:1px solid rgba(217,180,90,.55);background:#0c0a08;
  transition:background .3s, box-shadow .3s, transform .3s}
.stop .lb{margin-top:7px;font-size:11px;letter-spacing:1px;color:#6e6552;white-space:nowrap;
  transition:color .3s}
.stop:hover .dot{background:rgba(217,180,90,.45)}
.stop:hover .lb{color:#cbbd9c}
.stop.on .dot{background:var(--warm);box-shadow:0 0 10px rgba(217,180,90,.75);transform:scale(1.18)}
.stop.on .lb{color:#f0e6cd}

.persp{display:flex;align-items:center;gap:9px;padding:5px 0;cursor:pointer;
  font-size:12px;letter-spacing:2px;color:#7d735f;transition:color .3s}
.persp:hover{color:#e6dabb}
.persp .box{width:12px;height:12px;border:1px solid rgba(217,180,90,.5);
  display:flex;align-items:center;justify-content:center;flex:0 0 auto;
  transition:border-color .25s}
.persp .box::after{content:"";width:6px;height:6px;background:var(--warm);
  transform:scale(0);transition:transform .25s cubic-bezier(.3,1.4,.5,1)}
.persp.on{color:#f0e6cd}
.persp.on .box{border-color:rgba(217,180,90,.95)}
.persp.on .box::after{transform:scale(1)}

/* corner: the two controls in a row, the title beneath them and aligned to
   their right edge, so the whole block reads as one piece of chrome. */
#corner{position:fixed;right:22px;top:18px;z-index:17;display:flex;
  flex-direction:column;align-items:flex-end;gap:9px}
#corner .btns{display:flex;align-items:center;gap:8px}
#lang,#back{font-size:11px;letter-spacing:3px;color:#6b6151;cursor:pointer;
  border:1px solid var(--line);padding:5px 9px;text-decoration:none;
  display:inline-flex;align-items:center;justify-content:center;
  transition:color .3s, border-color .3s}
#lang:hover,#back:hover{color:#efe3c6;border-color:rgba(217,180,90,.5)}
/* third stop on the toggle: the button becomes a picture of pictures */
#lang.asIcon{width:30px;height:26px;padding:0;letter-spacing:0}
#lang.asIcon .ico{display:block;width:14px;height:14px}
/* a bare chevron: unmistakable, and it stops competing with the painting */
#back{font-size:15px;letter-spacing:0;line-height:1;width:30px;height:26px;padding:0}
#title{font-size:12px;letter-spacing:3px;color:#5f5748;pointer-events:none;
  max-width:34vw;text-align:right}

/* top-bar chrome: used on narrow screens, and in Wide mode at any width,
   so the painting can have the full breadth of the display */
body.topbar #panel{position:fixed;left:0;right:0;top:0;bottom:auto;width:auto;transform:none;
  display:flex;align-items:center;gap:12px;padding:7px 10px;opacity:1;z-index:18;
  background:linear-gradient(180deg,rgba(10,8,6,.97),rgba(10,8,6,.88));
  border-bottom:1px solid var(--line);
  overflow-x:auto;scrollbar-width:none;white-space:nowrap}
body.topbar #panel::-webkit-scrollbar{display:none}
body.topbar .sect{margin:0;display:flex;align-items:center;gap:9px;flex:0 0 auto}
body.topbar .sect h2{margin:0;font-size:9px;letter-spacing:2px}
body.topbar #track{width:150px;height:30px;margin:0 2px}
body.topbar #track .line{top:6px}
body.topbar .stop .dot{margin-top:2px;width:8px;height:8px}
body.topbar .stop .lb{margin-top:4px;font-size:9px;letter-spacing:0}
body.topbar .persp{padding:0;font-size:11px;letter-spacing:1px;gap:6px}
body.topbar .persp .box{width:11px;height:11px}
body.topbar #corner{right:10px;top:auto;bottom:9px;flex-direction:row;
  align-items:center;gap:10px}
body.topbar #title{display:none}
body.topbar #loc{top:60px;bottom:auto}
@media(max-width:760px){
  #corner{right:10px;top:10px;gap:6px}
  #title{display:none}
}

<!-- The register has to be read before we know which manifest to fetch, which
     puts a round trip between the HTML arriving and the first tile being asked
     for -- the preload scanner cannot see a script that document.write injects.
     These hints let it fetch them anyway, in parallel, so the write finds them
     already in cache. Listed for the default scroll, which is most arrivals; a
     ?p= visit simply does not use two of them. -->
<!-- Assets are served with max-age=600, so a new index.html can arrive while
     its data files are still ten minutes stale -- which is how the Whole view
     kept painting the wrong scroll after the fix had shipped. The build stamp
     makes each deploy a new URL. tools/stamp_build.py rewrites it. -->
<script>window.BUILD='8e92afc';</script>
<link rel="preload" as="script" href="assets/data/paintings.js?b=8e92afc">
<link rel="preload" as="script" href="assets/scroll/manifest.js?b=8e92afc">

<script>
/* Which scroll. ?p=<slug> picks one from the register; the annotation files
   are per-painting, so they are written in here rather than fixed in the page.
   document.write is the honest tool for this: these scripts must be in place
   before the viewer below runs, and the alternative is rewriting the whole
   viewer as async for the sake of one lookup. */
(function(){
  var R=window.PAINTINGS, m=/[?&]p=([a-z0-9_-]+)/i.exec(location.search);
  var slug=(m&&m[1])||R.default;
  var it=R.items.filter(function(x){return x.slug===slug;})[0];
  if(!it || !it.dir){                       // known but not digitised, or unknown
    window.NOT_READY = it || {slug:slug};
    it=R.items.filter(function(x){return x.slug===R.default;})[0];
  }
  window.PAINTING=it;
  var B='?b='+(window.BUILD||'0');
  document.write('<scr'+'ipt src="'+it.dir+'/manifest.js'+B+'"></scr'+'ipt>');
  (it.data||[]).forEach(function(d){
    document.write('<scr'+'ipt src="assets/data/'+d+'.js'+B+'" onerror="void 0"></scr'+'ipt>');
  });
  // every other scroll's notes live in their own file; a 404 is the normal
  // case for a painting nobody has written on yet, hence the silent onerror
  if(slug!==R.default)
    document.write('<scr'+'ipt src="assets/data/notes-'+slug+'.js'+B+'" onerror="void 0"></scr'+'ipt>');
})();
</script>
<script>
(function(){
const S=window.SCROLL, EP=(window.EPISODES&&window.EPISODES.episodes)||[],
      DET=(window.DETAILS&&window.DETAILS.items)||[];
const L=S.w, PH=S.h, CR=S.contentRight||S.w;
// A hanging scroll is read down a wall, not unrolled along a table, so it gets
// a different geometry: fit the width, travel vertically, no roll ends. This is
// switched by the manifest's own axis, so it applies to 晴巒蕭寺圖 and to
// nothing else -- the other seven are handscrolls and must not change.
const VERT = S.axis==='v';
if(VERT) document.body.classList.add('vert');
const $=id=>document.getElementById(id);
// ?rolls=b|c|d|e swaps how the rolls are drawn, so the variants can be judged on
// the real thing at real size instead of in a mock-up.
(function(){
  const m=/[?&]rolls=([a-e])/.exec(location.search);
  if(!m||m[1]==='d') return;               // d is the default now
  document.body.classList.add('rolls-'+m[1],'rolltag');
  const NAME={a:'cylinder (was default)',b:'facets',c:'ply',e:'ribs'};
  const t=document.getElementById('rollTag');
  if(t) t.textContent='rolls · '+m[1].toUpperCase()+' '+NAME[m[1]];
})();
const desk=$('desk'), win=$('window'), rail=$('rail'), rollL=$('rollL'), rollR=$('rollR'),
      sheen=$('sheen'), foldEl=$('fold'), marksEl=$('marks'), marqEl=$('marquee'),
      keptEl=$('kept'), loc=$('loc'), locBox=$('locBox'), track=$('track'), dlabel=$('dlabel');

const I18N={
  en:{zoom:'Zoom', persp:'Perspectives', whole:'Whole', pane:'Pane', detail:'Detail',
      wide:'Wide', loc:'Locator', marks:'Things', roads:'Roads', notes:'Noticed', write:'Write', read:'Colophons', log:'Room', lang:'中',
      save:'save', del:'delete', cancel:'cancel', back:'Return to Cabinet',
      uiZh:'中文', uiEn:'English', uiIco:'pictograms — no words',
      hidden:'hidden — click the painting to find them', found:'you found',
      title:(window.PAINTING? PAINTING.en+' · '+PAINTING.artist.en+' · '+PAINTING.dynasty.en
                             : 'A Thousand Li of Rivers and Mountains · Wang Ximeng · Northern Song'),
      seg:(i,n)=> i===0?'1 · opening' : i===n-1? n+' · end' : String(i+1)},
  zh:{zoom:'縮放', persp:'視角', whole:'全卷', pane:'展卷', detail:'細看',
      wide:'通幅', loc:'卷影', marks:'物', roads:'道路', notes:'所見', write:'題', read:'題識', log:'共室', lang:'EN',
      save:'存', del:'刪', cancel:'罷', back:'返回畫匣',
      uiZh:'中文', uiEn:'English', uiIco:'圖示 —— 不用文字',
      hidden:'已隱藏 —— 點畫面自己找', found:'你找到了',
      title:(window.PAINTING? PAINTING.zh+'　'+PAINTING.artist.zh+'　'+PAINTING.dynasty.zh
                             : '千里江山圖　王希孟　北宋'),
      seg:(i,n)=> i===0?'一（起首）' : i===n-1? String(n)+'（卷末）' : String(i+1)}
};
// The toggle has three stops, not two: 中 → EN → pictograms → 中.
// `ui` is the stop; `lang` is the language the words are in. Pictograms keep
// whichever language you last read, so the tooltips still make sense, and the
// few words the mode can't replace (the scroll's own name) stay in Chinese.
const UI_NEXT={zh:'en', en:'ico', ico:'zh'};
// Pictograms are the default arrival: the panel says what it does in shapes,
// which needs no language at all. The words are one tap away and remembered.
// Only an explicit choice on this toggle is honoured -- ccp_lang is written by
// the cabinet too, so falling back to it would hand most visitors words they
// never asked for.
let ui=/[?&]icons=1/.test(location.search) ? 'ico'
      : (localStorage.getItem('ccp_ui')||'ico');
if(!UI_NEXT[ui]) ui='zh';
let lang = ui==='ico' ? (localStorage.getItem('ccp_lang')||'zh') : ui;
const t=k=>I18N[lang][k];

let mode='pane', showLoc=false, showMarks=false, showRoads=false, showNotes=false, customUsed=false;
const ROADS=(window.ROADS&&window.ROADS.paths)||[];
// things.js -- 207 objects catalogued by a model -- is no longer loaded. Two
// independent annotation passes agreed with it on barely half the contested
// items, because a bare coordinate does not identify a subject at 5-30px. The
// file is still in the repo and in history; it is simply not something to show
// a visitor as if it were known. What is shown is what a person looked at and
// wrote down.
const THINGS=[];
const PUB_NOTES=(window.NOTES&&window.NOTES.items)||[];
// Your own notes live in this browser under the key the tracer uses, so a note
// written here is the same object the tracer would have written -- one store,
// two ways in. `mine` marks them apart on screen: mounted colophons in one
// hand, yours in another, the way an unmounted sheet sits beside the scroll.
const SLUG=(window.PAINTING&&PAINTING.slug)||'qianli';
const NKEY = SLUG==='qianli' ? 'ccp_notes_v1' : 'ccp_notes_'+SLUG;
let MYNOTES=[], ROOMNOTES=[], ROOMLOG=[];
try{ const o=JSON.parse(localStorage.getItem(NKEY)||'null'); if(o&&o.notes) MYNOTES=o.notes; }catch(e){}
function saveMine(){
  try{ localStorage.setItem(NKEY,JSON.stringify({srcW:L,srcH:PH,notes:MYNOTES})); }catch(e){}
}
// three hands on one scroll: mounted, the room's, and yours
const allNotes=()=>PUB_NOTES
  .concat(ROOMNOTES.filter(n=>(n.slug||'qianli')===SLUG).map(n=>Object.assign({room:true},n)))
  .concat(MYNOTES.map(n=>Object.assign({mine:true},n)));
let NOTES=allNotes();
const ITEMS = THINGS;   // empty: the raw detections were the census, and it did not hold up
const TYPE={
  en:{building:'Building',pavilion:'Pavilion',temple:'Temple',pagoda:'Pagoda',bridge:'Bridge',
      boat:'Boat',figure:'Figure',watermill:'Watermill',jetty:'Jetty',fence:'Enclosure',
      animal:'Animal',other:'Detail'},
  zh:{building:'屋舍',pavilion:'樓閣',temple:'寺',pagoda:'塔',bridge:'橋',
      boat:'舟',figure:'人',watermill:'水磨',jetty:'埠',fence:'垣',
      animal:'獸',other:'細節'}
};
let apH=0, apW=0, scale=1, Z=1, x0=0, y0=0, vel=0, panning=false, target=null;
let core=0, thick=0, TX=0, TY=0, kept=null, lastCustom=null;

const cum=[0]; S.tiles.forEach(tt=>cum.push(cum[cum.length-1]+tt.w));
const imgs=S.tiles.map((tt,i)=>{
  const im=document.createElement('img');
  im.src=(PAINTING.tiles||'assets/scroll/tiles/')+tt.f; im.alt=''; im.decoding='async';
  im.loading = i>=S.tiles.length-5 ? 'eager':'lazy';
  rail.appendChild(im); return im;
});
const roadsEl=$('roads');
roadsEl.setAttribute('viewBox','0 0 '+L+' '+PH);
roadsEl.setAttribute('preserveAspectRatio','none');
// Rebuild each road from its points rather than its stored `d`, so a run of
// closely-spaced clicks (the tracer following a visible path) can be drawn
// solid, while a long leap between clicks (bridging trees, a ridge, a roof)
// is drawn dotted. Cutoff is per-path, since tracing density varies.
function roadRuns(pts){
  if(!pts || pts.length<2) return [];
  const seg=[];
  for(let i=0;i<pts.length-1;i++){
    const p1=pts[i], p2=pts[i+1];
    seg.push({a:p1,b:p2,len:Math.hypot(p2[0]-p1[0],p2[1]-p1[1])});
  }
  const sorted=seg.map(t=>t.len).sort((x,y)=>x-y);
  const med=sorted[sorted.length>>1]||1;
  const cut=Math.max(med*4, 18);
  const runs=[]; let cur=null;
  seg.forEach(t=>{
    const gap=t.len>cut;
    if(!cur || cur.gap!==gap){
      cur={gap:gap, d:'M '+t.a[0]+' '+t.a[1]};
      runs.push(cur);
    }
    cur.d+=' L '+t.b[0]+' '+t.b[1];
  });
  return runs;
}
// Each road remembers where it lies along the scroll, so travel can wake it.
// A handscroll is read by unrolling, and a road that lights as you reach it
// belongs to that motion; showing all fifteen at once is a map, not a reading.
const roadEls=[];
ROADS.forEach(p=>{
  const xs=p.pts.map(q=>q[0]);
  const band={x0:Math.min.apply(null,xs), x1:Math.max.apply(null,xs), els:[]};
  roadRuns(p.pts).forEach(run=>{
    ['case','line'].forEach(cls=>{
      const el=document.createElementNS('http://www.w3.org/2000/svg','path');
      el.setAttribute('d',run.d);
      el.setAttribute('class',cls+(run.gap?' gap':''));
      roadsEl.appendChild(el);
      band.els.push(el);
    });
  });
  band.on=false;
  roadEls.push(band);
});
// Dimming the far-off roads was invisible: the window shows about 5% of the
// scroll, so a road that is "off" is off the screen entirely, and fading
// something nobody can see is not an effect. What can be seen is a road
// arriving -- so it draws itself, head to tail, as you unroll onto it.
// The dotted runs are excluded: their dash pattern is what marks them as
// inferred, and a draw-in would have to overwrite it.
const ROADS_ALL=/[?&]roads=all/.test(location.search);
function drawIn(b){
  b.els.forEach(e=>{
    if(e.classList.contains('gap')) return;
    if(e._len==null){
      try{ e._len=e.getTotalLength(); }catch(err){ e._len=0; }
      if(!e._len) return;
      e.style.strokeDasharray=e._len;
    }
    e.style.transition='none';
    e.style.strokeDashoffset=e._len;
    void e.getBoundingClientRect();          // flush, so the transition has a start
    e.style.transition='stroke-dashoffset 1.15s cubic-bezier(.22,.61,.36,1)';
    e.style.strokeDashoffset=0;
  });
}
function resetDraw(b){
  b.els.forEach(e=>{ if(e._len){ e.style.transition='none'; e.style.strokeDashoffset=e._len; } });
}
function litRoads(){
  if(ROADS_ALL){
    roadEls.forEach(b=>b.els.forEach(e=>{ e.style.strokeDasharray=''; e.style.strokeDashoffset=''; }));
    return;
  }
  const left=x0, right=x0+visW(), pad=visW()*0.06;
  roadEls.forEach(b=>{
    const on = b.x1>left-pad && b.x0<right+pad;
    if(on===b.on) return;                     // only act on the crossing
    if(on) drawIn(b); else resetDraw(b);
    b.on=on;
  });
}
const nativeZ=()=>Math.max(1.4, Math.min(3.2, 1/scale));
const MINZ=1.25;                                  // lower reasonable bound
const visW=()=>apW/(scale*Z), visH=()=>apH/(scale*Z);

function measure(){
  const vw=innerWidth, vh=innerHeight;
  const narrow=vw<=760;
  document.body.classList.toggle('topbar', narrow || mode==='wide');
  if(mode==='wide'){                          // full breadth of whatever you're on
    apH=Math.min(vh*0.88, vh-108);
    apW=vw-14;
  } else {
    apH=Math.min(vh*(narrow?0.74:0.80), vh-(narrow?112:96));
    apW = VERT ? Math.round(apH*Math.min(1, (L/PH)*1.9)) : apH;
    const maxW=vw-(narrow?14:250);
    if(apW>maxW) apW=Math.max(160,maxW);
  }
  // The panel is a fixed column on the right, and the desk is centred in the
  // whole viewport -- so reserving width for the panel put half that reserve on
  // the left, where nothing needed it, and the painting ran under the buttons by
  // the other half. Centre the desk in what is left instead of in everything.
  {
    const reserve = (narrow || mode==='wide') ? 0 : 200;   // panel column + gutter
    desk.style.left = 'calc(50% - ' + Math.round(reserve/2) + 'px)';
    // clear of the corner title on a wide screen, clear of the top bar on a
    // narrow one, and the same on every painting
    desk.style.top = (narrow ? 60 : (mode==='wide' ? 62 : 78)) + 'px';
  }
  // horizontal: fit the height and let the scroll run off to the left.
  // vertical: fit the width and let it run off the bottom.
  scale = VERT ? apW/L : apH/PH;
  const xs=cum.map(c=>Math.round(c*scale));
  for(let i=0;i<imgs.length;i++){
    if(VERT){ imgs[i].style.top=xs[i]+'px'; imgs[i].style.left='0px';
              imgs[i].style.height=(xs[i+1]-xs[i])+'px'; imgs[i].style.width=Math.round(L*scale)+'px'; }
    else    { imgs[i].style.left=xs[i]+'px'; imgs[i].style.width=(xs[i+1]-xs[i])+'px'; }
  }
  if(VERT){ rail.style.width=Math.round(L*scale)+'px'; rail.style.height=xs[xs.length-1]+'px'; }
  else rail.style.width=xs[xs.length-1]+'px';
  roadsEl.setAttribute('width', VERT?Math.round(L*scale):xs[xs.length-1]);
  roadsEl.setAttribute('height', VERT?xs[xs.length-1]:apH);
  desk.style.width=apW+'px'; desk.style.height=apH+'px';
  win.style.width=apW+'px'; win.style.height=apH+'px';
  core=apH*0.030;
  const maxLen=(L-visW())*scale, rmax=apH*0.15;
  thick=Math.PI*(rmax*rmax-core*core)/Math.max(1,maxLen);
  loc.style.width=Math.min(vw*(narrow?0.94:0.60),740)+'px';
  layoutFold(); clamp(); render();
}
const rollRadius=len=>Math.sqrt(core*core+thick*Math.max(0,len)*scale/Math.PI);
function clamp(){
  x0=Math.max(0,Math.min(Math.max(0,L-visW()),x0));
  y0=Math.max(0,Math.min(Math.max(0,PH-visH()),y0));
}

function layoutFold(){
  const narrow=innerWidth<=760;
  const availW=Math.min(innerWidth-(narrow?14:250),1360);
  const availH=innerHeight-(narrow?(showLoc?176:112):(showLoc?130:88));
  const N=Math.max(2,Math.min(9,Math.round(Math.sqrt(availH*CR/(availW*PH)))));
  const gap=8, seg=CR/N;
  let rowW=availW, rowH=rowW*PH/seg;
  const total=N*rowH+(N-1)*gap;
  if(total>availH){ const k=availH/total; rowW*=k; rowH*=k; }
  foldEl.style.gap=gap+'px'; foldEl.innerHTML='';
  for(let i=0;i<N;i++){
    const a=CR-(i+1)*seg;
    const d=document.createElement('div');
    d.className='row';
    // Whole view was painting every scroll from the Wang Ximeng strip, because

// Zoom has to hold a point still. Screen = (src - x0) * scale * Z, so keeping the

// the two reciprocals. Without this the top-left corner is what stays put, which

function zoomAbout(nextZ, px, py){

const ROOM=(function(){

  if(!r) return null;

  return api ? {id:r[1], api:api} : {id:r[1], api:''};
})();

function askName(){
  const n=(window.prompt(lang==='en'?'Sign your notes as:':'題識署名：', roomName||'')||'').trim().slice(0,40);
  if(n){ roomName=n; try{ localStorage.setItem('ccp_name',n); }catch(e){} }
  return roomName;
}
function roomFetch(){
  if(!ROOM||!ROOM.api) return Promise.resolve();
  return fetch(ROOM.api+'/r/'+ROOM.id,{cache:'no-store'})
    .then(r=>r.ok?r.json():Promise.reject(new Error('HTTP '+r.status)))
    .then(o=>{ ROOMNOTES=o.notes||[]; ROOMLOG=o.log||[]; roomSeq=o.seq;
               buildNotes(); render(); });
}
function roomPost(op,payload){
  if(!ROOM||!ROOM.api) return Promise.resolve();
  if(!roomName && !askName()) return Promise.resolve();
  return fetch(ROOM.api+'/r/'+ROOM.id,{method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify(Object.assign({by:roomName,op:op},payload))})
    .then(r=>r.ok?r.json():r.json().then(e=>Promise.reject(new Error(e.error||r.status))))
    .then(()=>roomFetch())
    .catch(e=>{ toast((lang==='en'?'could not send: ':'未能送出：')+e.message); });
}
function toast(msg){
  let t=$('toast');
  if(!t){ t=document.createElement('div'); t.id='toast'; document.body.appendChild(t); }
  t.textContent=msg; t.classList.add('on');
  clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove('on'),4000);
}

// ---- writing on the painting ---------------------------------------------
// A colophon is placed: it sits beside what it answers. So writing is framing.
// In write mode a drag draws a box instead of choosing a zoom, and lets go into
// an editor. Everything else -- pan, pinch, the panel -- is untouched, because
// the mode is a flag the drag handler reads, not a separate interface.
let writing=false, editing=null;
function setWriting(on){
  writing=on;
  document.body.classList.toggle('writing',on);
  const el=document.querySelector('.persp[data-t="write"]');
  if(el) el.classList.toggle('on',on);
  if(on && !showNotes){ showNotes=true;
    const n=document.querySelector('.persp[data-t="notes"]'); if(n) n.classList.add('on');
  }
  render();
}
function editNote(n){
  editing=n;
  const box=$('editor');
  // Anyone can write here, and most people writing will assume it goes
  // somewhere. Say plainly which of the two it is, before they type.
  const w=box.querySelector('.where');
  if(ROOM&&ROOM.api){
    w.textContent = lang==='en'
      ? 'everyone in this room will see this' + (roomName? ' · signed '+roomName : '')
      : '此室諸人皆可見' + (roomName? '　署名 '+roomName : '');
    w.className='where shared';
  } else {
    w.textContent = lang==='en' ? 'kept in this browser only — nobody else can see it'
                                : '僅存於此瀏覽器　他人不見';
    w.className='where private';
  }
  box.querySelector('.et').value=n.title||'';
  box.querySelector('.eb').value=n.text||'';
  box.classList.add('on');
  box.querySelector('.et').focus();
}
function closeEditor(){ $('editor').classList.remove('on'); editing=null; }
function newNoteFromBox(x,y,w,h){
  const id=MYNOTES.reduce((m,n)=>Math.max(m,n.id||0),0)+1;
  const n={id:id, x:Math.round(x+w/2), y:Math.round(y+h/2),
           w:Math.round(w), h:Math.round(h), type:'note', title:'', text:''};
  MYNOTES.push(n); saveMine(); buildNotes(); render(); editNote(n);
}

// ---- reading the colophons in order --------------------------------------
// Notes are found by zooming, which makes them discoveries and not a text. A
// handscroll's inscriptions are read in the order the scroll unrolls, so this
// lists them that way: right to left, which for these coordinates is by x.
function buildScript(){
  const host=$('script'); if(!host) return;
  const rows=NOTES.slice().sort((a,b)=> (VERT? a.y-b.y : b.x-a.x));
  host.innerHTML = rows.length ? '' :
    '<div class="empty">'+(lang==='en'?'nothing written yet':'尚無題識')+'</div>';
  rows.forEach(n=>{
    const at = VERT ? Math.round(100*n.y/PH) : Math.round(100*(CR-n.x)/CR);
    const d=document.createElement('div');
    d.className='row'+(n.mine?' mine':'')+(n.room?' room':'');
    const a=document.createElement('span'); a.className='at'; a.textContent=at+'%';
    const tt=document.createElement('span'); tt.className='tt';
    tt.textContent=n.title||(lang==='en'?'(untitled)':'（無題）');
    d.appendChild(a); d.appendChild(tt);
    if(n.by){ const b=document.createElement('span'); b.className='by'; b.textContent=n.by; d.appendChild(b); }
    if(n.text){ const bd=document.createElement('div'); bd.className='bd'; bd.textContent=n.text; d.appendChild(bd); }
    d.addEventListener('click',()=>{ gotoNote(n); });
    host.appendChild(d);
  });
  const c=$('scriptCount');
  if(c) c.textContent = rows.length ? rows.length+(lang==='en'?' notes':' 則') : '';
}
// ---- who wrote what, and when --------------------------------------------
// The log is the room's history, not a surveillance feature: it records that a
// note was written, edited or removed, by the name its writer typed. It is what
// makes a shared notebook legible when six people use it over a week.
function buildLog(){
  const host=$('log'); if(!host) return;
  host.innerHTML='';
  const head=document.createElement('div'); head.className='lhead';
  head.textContent = ROOM ? (lang==='en'?'Room · everyone':'共室　諸人') : (lang==='en'?'not in a room':'未入共室');
  host.appendChild(head);
  if(!ROOM){
    const d=document.createElement('div'); d.className='empty';
    d.textContent = lang==='en' ? 'open a room link to write together'
                                : '開共室之鏈，同題一卷';
    host.appendChild(d);
    const act=document.createElement('div'); act.className='act';
    const b=document.createElement('button');
    b.textContent = lang==='en' ? 'start a room' : '新建共室';
    b.onclick=()=>{
      // 128 bits from the CSPRNG. The id IS the credential, so it must be
      // unguessable and must be made here -- a server that hands out ids has
      // a list of them.
      const a=new Uint8Array(16); crypto.getRandomValues(a);
      const id=btoa(String.fromCharCode.apply(null,a)).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
      let api=''; try{ api=localStorage.getItem('ccp_api')||''; }catch(e){}
      if(!api){
        api=(window.prompt(lang==='en'?'Worker URL (see tools/room-worker.js):':'共室端點（見 tools/room-worker.js）：','')||'').trim().replace(/\/+$/,'');
        if(!api) return;
        try{ localStorage.setItem('ccp_api',api); }catch(e){}
      }
      location.hash='room='+id+'&api='+encodeURIComponent(api);
      location.reload();
    };
    act.appendChild(b);
    const e2=document.createElement('button');
    e2.textContent = lang==='en' ? 'save my notes' : '存我所題';
    e2.onclick=exportRoom; act.appendChild(e2);
    host.appendChild(act);
    return;
  }
  const names={};
  ROOMNOTES.forEach(n=>{ names[n.by||'anon']=(names[n.by||'anon']||0)+1; });
  const who=document.createElement('div'); who.className='who';
  who.textContent=Object.keys(names).map(k=>k+' '+names[k]).join('　·　');
  host.appendChild(who);
  const act=document.createElement('div'); act.className='act';
  const mk2=(label,fn)=>{ const b=document.createElement('button'); b.textContent=label; b.onclick=fn; return b; };
  act.appendChild(mk2(lang==='en'?'copy invite':'複製邀鏈', ()=>{
    const u=location.origin+location.pathname+location.search+
      '#room='+ROOM.id+(ROOM.api?'&api='+encodeURIComponent(ROOM.api):'');
    navigator.clipboard.writeText(u).then(
      ()=>toast(lang==='en'?'invite copied — anyone with it can write':'已複製　持鏈者皆可題'),
      ()=>toast(u));
  }));
  act.appendChild(mk2(lang==='en'?'my name':'署名', ()=>{ askName(); buildLog(); }));
  act.appendChild(mk2(lang==='en'?'save all':'存全部', exportRoom));
  host.appendChild(act);
  const rows=ROOMLOG.slice().reverse().slice(0,120);
  if(!rows.length){
    const d=document.createElement('div'); d.className='empty';
    d.textContent=lang==='en'?'nothing written yet':'尚無題識'; host.appendChild(d); return;
  }
  const VERB={add:{en:'wrote',zh:'題'},edit:{en:'edited',zh:'改'},del:{en:'removed',zh:'刪'}};
  const NAME={};
  ((window.PAINTINGS&&PAINTINGS.items)||[]).forEach(it=>{ NAME[it.slug]={zh:it.zh,en:it.en}; });
  rows.forEach(e=>{
    const d=document.createElement('div'); d.className='lrow';
    const t=document.createElement('span'); t.className='lt';
    t.textContent=new Date(e.at).toLocaleString(lang==='en'?'en-US':'zh-Hans',
      {month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'});
    const b=document.createElement('span'); b.className='lb2'; b.textContent=e.by||'anon';
    const v=document.createElement('span'); v.className='lv';
    v.textContent=(VERB[e.op]||VERB.add)[lang==='en'?'en':'zh'];
    const w=document.createElement('span'); w.className='lw';
    const nm=NAME[e.slug]||{}; w.textContent=(lang==='en'?(nm.en||e.slug):(nm.zh||e.slug));
    const q=document.createElement('span'); q.className='lq'; q.textContent=e.title||'';
    [t,b,v,w,q].forEach(x=>d.appendChild(x));
    host.appendChild(d);
  });
}
// ---- take the whole room away with you -----------------------------------
// Every note on every painting, in one file. A room lives on someone else's
// computer; this is how it stops being the only copy.
function exportRoom(){
  const out={v:1, of:'classicalchinesepainting.com', room:ROOM?ROOM.id:null,
             savedAt:new Date().toISOString(),
             paintings:{}, mine:{slug:SLUG, notes:MYNOTES}, log:ROOMLOG};
  ROOMNOTES.forEach(n=>{
    const k=n.slug||'qianli';
    (out.paintings[k]=out.paintings[k]||[]).push(n);
  });
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([JSON.stringify(out,null,1)],{type:'application/json'}));
  a.download='annotations-'+out.savedAt.slice(0,10)+'.json'; a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),4000);
  const n=ROOMNOTES.length+MYNOTES.length;
  toast((lang==='en'?'saved ':'已存　')+n+(lang==='en'?' notes across all paintings':' 則'));
}
function gotoNote(n){
  const want = Math.min(nativeZ(), Math.max(1.6, (VERT?apW:apH)/((n.w||300)*scale*2.2)));
  Z=Math.max(MINZ,Math.min(nativeZ(),want));
  x0=n.x-visW()/2; y0=n.y-visH()/2;
  customUsed=true; mode='custom'; clamp(); buildTrack(); render();
  $('script').classList.remove('on');
}

// --- language --------------------------------------------------------------
function applyLang(){
  ICONS_ON = ui==='ico';
  document.body.classList.toggle('icons', ICONS_ON);
  document.documentElement.lang = lang==='en'?'en':'zh-Hans';
  $('hZoom').textContent=t('zoom'); $('hPersp').textContent=t('persp');
  // the button shows the stop you'd land on next, which is how it read before
  const nxt=UI_NEXT[ui], L=$('lang');
  L.classList.toggle('asIcon', nxt==='ico');
  if(nxt==='ico') L.innerHTML=ico('ui');
  else L.textContent = nxt==='en' ? 'EN' : '中';
  L.title=t(nxt==='zh'?'uiZh':nxt==='en'?'uiEn':'uiIco');
  L.setAttribute('aria-label',L.title);
  // the chevron IS the label; the translated string becomes its tooltip
  $('back').title=t('back'); $('back').setAttribute('aria-label',t('back'));
  // pictograms are wordless, so the one caption left keeps the scroll's own name
  $('title').textContent = ICONS_ON ? I18N.zh.title : t('title');
  // whose photograph this is. A scan taken from Commons is credited on the
  // page showing it, not only in a file nobody opens.
  if(window.PAINTING && PAINTING.source){
    let c=$('credit');
    if(!c){ c=document.createElement('div'); c.id='credit'; $('corner').appendChild(c); }
    c.innerHTML = PAINTING.file
      ? '<a href="'+PAINTING.file+'" target="_blank" rel="noopener">'+PAINTING.source+'</a> · '+PAINTING.licence
      : PAINTING.source;
  }
  iconise(document.querySelector('.persp[data-t="loc"] .lb'),'loc',t('loc'));
  iconise(document.querySelector('.persp[data-t="marks"] .lb'),'marks',t('marks'));
  const rp=document.querySelector('.persp[data-t="roads"]');
  iconise(rp.querySelector('.lb'),'roads',t('roads'));
  rp.classList.toggle('off', ROADS.length===0);
  rp.title = ROADS.length? '' : 'no roads traced yet — use trace.html';
  const wp=document.querySelector('.persp[data-t="write"]');
  iconise(wp.querySelector('.lb'),'write',t('write'));
  const rp2=document.querySelector('.persp[data-t="read"]');
  iconise(rp2.querySelector('.lb'),'read',t('read'));
  const lp=document.querySelector('.persp[data-t="log"]');
  iconise(lp.querySelector('.lb'),'log',t('log'));
  lp.classList.toggle('off', !ROOM);
  const ed=$('editor');
  ed.querySelector('.ok').textContent=t('save');
  ed.querySelector('.del').textContent=t('del');
  ed.querySelector('.no').textContent=t('cancel');
  buildScript();
  const np=document.querySelector('.persp[data-t="notes"]');
  iconise(np.querySelector('.lb'),'notes',t('notes'));
  np.classList.toggle('off', NOTES.length===0);
  np.title = NOTES.length? '' : 'nothing noted yet — use trace.html';
  document.title = window.PAINTING ? (lang==='en'?PAINTING.en:PAINTING.zh)
                  : (lang==='en'?'A Thousand Li of Rivers and Mountains':'千里江山圖');
  buildTrack(); if(mode==='fold') layoutFold();
}
$('lang').addEventListener('click',()=>{
  ui=UI_NEXT[ui];
  if(ui!=='ico'){ lang=ui; localStorage.setItem('ccp_lang',lang); }
  localStorage.setItem('ccp_ui',ui);
  applyLang();
});
(function(){
  const ed=$('editor');
  ed.querySelector('.ok').onclick=()=>{
    if(!editing) return;
    editing.title=ed.querySelector('.et').value.trim();
    editing.text =ed.querySelector('.eb').value.trim();
    saveMine(); buildNotes(); render(); closeEditor();
  };
  ed.querySelector('.del').onclick=()=>{
    if(!editing) return;
    MYNOTES=MYNOTES.filter(n=>n!==editing);
    saveMine(); buildNotes(); render(); closeEditor();
  };
  ed.querySelector('.no').onclick=closeEditor;
  $('script').addEventListener('pointerdown',e=>e.stopPropagation());
  ed.addEventListener('pointerdown',e=>e.stopPropagation());
})();
addEventListener('keydown',e=>{
  if(e.key==='Escape'){ if($('editor').classList.contains('on')) closeEditor();
                        else if(writing) setWriting(false); }
  if(e.key==='1') setMode('fold'); else if(e.key==='2') setMode('wide');
  else if(e.key==='3') setMode('pane'); else if(e.key==='4'&&customUsed) setMode('custom');
});
addEventListener('resize',measure);

if(VERT){ mode='pane'; }
if(window.NOT_READY){
  const b=document.createElement('div'); b.id='notready';
  const it=window.NOT_READY;
  b.innerHTML = it.zh ? ('<b>'+it.zh+'</b> '+(it.en||'')+' — 尚無掃描本，暫以千里江山圖代之'
                        +'<br><span>no scan of this one yet; showing the Wang Ximeng scroll instead</span>')
                      : ('unknown painting “'+it.slug+'” — showing the default');
  document.body.appendChild(b);
  setTimeout(()=>b.classList.add('go'), 9000);
}
if(ROOM&&ROOM.api){
  roomFetch().then(()=>{ buildLog(); });
  // A room is other people writing while you read. Polling is the honest
  // simple answer at this size -- six people, a few notes an hour. Only while
  // the tab is in front, so a forgotten tab is not a standing request.
  setInterval(()=>{ if(!document.hidden) roomFetch().then(()=>{
    if($('log').classList.contains('on')) buildLog(); }); }, 15000);
}
measure(); applyLang();
x0 = VERT ? 0 : Math.max(0,CR-visW());
const bleed=$('bleed'), lastImg=imgs[imgs.length-1];
const reveal=()=>{ bleed.style.opacity='0'; };
if(lastImg){ lastImg.complete?setTimeout(reveal,100):lastImg.addEventListener('load',()=>setTimeout(reveal,100)); }
setTimeout(reveal,4000);
setMode('pane');
requestAnimationFrame(loop);
})();
</script>
<script>
// ?bg=paper|silk|blush|dawn puts the scroll on a light ground instead of in a
// dark room. Same switcher pattern as ?rolls= and ?font=.
(function(){
  var m=/[?&]bg=(paper|silk|blush|dawn)/.exec(location.search); if(!m) return;
  document.body.classList.add('bg-'+m[1],'bgtag');
  var d=document.createElement('div'); d.id='bgTag';
  d.textContent='ground \u00b7 '+m[1];
  document.body.appendChild(d);
})();
// ?font=b|c|d|e swaps the type stack so the options can be judged in place.
(function(){
  var m=/[?&]font=([a-e])/.exec(location.search); if(!m||m[1]==='b') return;
  document.body.classList.add('font-'+m[1],'fonttag');
  var N={a:'EB Garamond (was default)',c:'Helvetica Neue',d:'Avenir Next',e:'Futura'};
  var d=document.createElement('div'); d.id='fontTag';
  d.textContent='type \u00b7 '+m[1].toUpperCase()+' '+N[m[1]];
  document.body.appendChild(d);
})();
</script>
